function feedback(q,a){return `<div class="feedback ${a.result.correct?'':'incorrect'}" role="status"><h3>${a.result.correct?'✓ Correct':a.result.precision?'Check your reporting precision':'Not quite'}</h3>${!a.result.correct?`<p class="small">Expected answer: <strong>${answerLabel(q)}</strong>${a.result.precision?'. Your numerical value is right; match the requested decimal precision.':''}</p>`:''}${solutionHTML(q)}${q.type==='number'&&q.sf?`<p class="small muted" style="margin:13px 0 0">Suggested reporting: ${q.sf} significant figures. This question grades numerical value with a rounding tolerance.</p>`:''}${sourceHTML(byUnit(q.unit),q)}</div>`;}
function record(q,a){let s=P.stats[q.id]||{attempts:0,correct:0};s.attempts++;if(a.result.correct)s.correct++;s.lastCorrect=a.result.correct;s.assisted=a.hint;s.updated=Date.now();P.stats[q.id]=s;}
function capture(){let s=P.active,input=$('#answer-entry');if(s&&input&&!s.answers[s.index].checked)s.answers[s.index].given=input.value.trim();}
function check(){let s=P.active,a=s.answers[s.index],q=s.items[s.index];if(a.checked)return;capture();let result=grade(q,a.given);if(result.empty||result.invalid){$('#answer-error').textContent=result.empty?'Enter or select an answer first.':'Enter a complete number without units, for example 6.02e23.';return;}a.result=result;a.checked=true;record(q,a);save();draw();}
function submitTest(){capture();let s=P.active,missing=s.answers.filter(a=>a.given===null||a.given==='').length;confirmDialog('Submit this test?',missing?`${missing} unanswered question${missing===1?' will':'s will'} be marked incorrect. You can return and finish them first.`:'Your answers will be graded and the worked solutions revealed.','Submit & grade',()=>{for(let i=0;i<s.items.length;i++){let a=s.answers[i];if(!a.checked){a.result=grade(s.items[i],a.given);a.checked=true;record(s.items[i],a);}}finish();});}
function finish(){let s=P.active;R=copy(s);R.completed=Date.now();let correct=s.answers.filter(a=>a.result?.correct).length;P.history.unshift({title:s.title,mode:s.mode,correct,total:s.items.length,at:Date.now()});P.history=P.history.slice(0,30);P.active=null;save();go('results');}
function results(){if(!R)return `<div class="empty">Start a session to see results.</div>`;let right=R.answers.filter(a=>a.result?.correct).length,total=R.items.length,miss=total-right,assisted=R.answers.filter(a=>a.hint).length;return `<div class="session">${crumb([{text:'Session results'}])}<div class="panel result-hero"><div class="score-ring" style="--score:${right/total*100}"><strong>${Math.round(right/total*100)}%</strong></div><div><div class="eyebrow">${R.mode==='exam'?'Practice test':'Practice'} complete</div><h2 style="margin-bottom:8px">${right} of ${total} correct</h2><p class="muted small" style="margin:0">${miss?`${miss} question${miss===1?'':'s'} to revisit`:'All answers correct'}${assisted?' · '+assisted+' with hints':''}</p></div></div><div class="actions" style="margin-bottom:25px">${miss?`<button class="btn primary" data-action="retry-result">Retry missed (${miss})</button>`:''}<button class="btn ${miss?'':'primary'}" data-action="setup-all">Build another set</button><button class="btn" data-action="home">All sections</button></div><div class="toolbar"><h3>Review your answers</h3><span class="small muted">Open a question for the steps</span></div>${R.items.map((q,i)=>{let a=R.answers[i];return `<details class="review-item ${a.result.correct?'':'incorrect'}" ${!a.result.correct?'open':''}><summary>${i+1}. ${science(q.prompt)}</summary>${renderDiagram(q.diagram)}<p class="your-answer">Your answer: ${a.given===null||a.given===''?'Unanswered':science(a.given)}${a.hint?' · hint used':''} &nbsp; ${a.result.correct?'✓ Correct':'✕ Incorrect'}</p>${!q.variant&&DATA.worked?.[q.id]?'':`<strong class="small">Answer: ${answerLabel(q)}</strong>`}${solutionHTML(q)}<div style="margin-top:14px">${sourceHTML(byUnit(q.unit),q)}</div><button class="btn text" data-action="unit" data-unit="${q.unit}">Review this topic ↗</button></details>`}).join('')}</div>`;}
function missed(){return Q.filter(q=>P.stats[q.id]&&!P.stats[q.id].lastCorrect);}
function startCards(keys,dueOnly=false,existingOnly=false,kind=null){let list=CARDS.filter(c=>(!kind||c.kind===kind)&&keys.includes(c.unit)&&(!existingOnly||P.cards[c.id])&&(!dueOnly||!P.cards[c.id]||P.cards[c.id].due<=Date.now()));list=shuffle(list).sort((a,b)=>(P.cards[a.id]?.due||0)-(P.cards[b.id]?.due||0));F={items:list,index:0,revealed:false,known:0,again:0,dueOnly};go('cards');}
function cards(){if(!F)return `<div class="empty">Choose a topic to study its cards.</div>`;let c=F.items[F.index];if(!c)return `<div class="session"><div class="panel"><div class="eyebrow">${F.items.length?'Recall session complete':'Nothing due here'}</div><h2>${F.items.length?'A good stopping point.':'You’re up to date.'}</h2><p class="muted">${F.items.length?`${F.items.length} cards reviewed · ${F.known} recalled · ${F.again} to revisit.`:'These cards are scheduled for a later day.'}</p><div class="actions"><button class="btn primary" data-action="home">All sections</button><button class="btn" data-action="progress">Review schedule</button></div></div></div>`;let u=byUnit(c.unit);return `<div class="session"><div class="session-toolbar"><button class="btn text" data-action="home">${icon('back')} Exit cards</button><span class="session-meta">RECALL · ${F.index+1} / ${F.items.length}</span><span class="pill">${c.kind}</span></div><div class="progress-track"><span style="width:${F.index/F.items.length*100}%"></span></div><div class="card-meta"><span>§${e(sectionLabel(u))} · ${e(u.t)}</span><span>${P.cards[c.id]?.reviews?'Reviewed '+P.cards[c.id].reviews+'×':'New card'}</span></div><button class="flashcard ${F.revealed?'revealed':''}" data-action="flip" aria-label="${F.revealed?'Answer: ':'Reveal answer for: '}${e(F.revealed?c.back:c.front)}"><span class="side-label">${F.revealed?'Answer':'Recall'}</span><span>${science(F.revealed?c.back:c.front)}</span></button>${F.revealed?`<div class="card-controls"><button class="btn" data-action="rate" data-rating="again">Again<small>In 10 minutes</small></button><button class="btn" data-action="rate" data-rating="hard">Hard<small>Tomorrow</small></button><button class="btn primary" data-action="rate" data-rating="good">Got it<small>${cardInterval(c)} day${cardInterval(c)===1?'':'s'}</small></button></div>`:`<div class="card-controls"><button class="btn primary" data-action="flip">Reveal answer</button></div><p class="small muted" style="text-align:center;margin-top:14px">Recall it first. Then reveal and rate.</p>`}<div style="margin-top:25px">${sourceHTML(u)}</div></div>`;}
function cardInterval(c){return [1,3,7,14,30][P.cards[c.id]?.level||0];}
function rate(rating){if(!F?.revealed)return;let c=F.items[F.index],old=P.cards[c.id]||{level:0,reviews:0},interval=rating==='again'?600000:rating==='hard'?DAY:cardInterval(c)*DAY;P.cards[c.id]={level:rating==='again'?0:rating==='hard'?Math.max(0,old.level-1):Math.min(4,old.level+1),reviews:old.reviews+1,due:Date.now()+interval};if(rating==='good')F.known++;else F.again++;F.index++;F.revealed=false;save();draw();}

function elementPos(z){if(z===57)return [6,3];if(z===89)return [7,3];if(z>=58&&z<=71)return [9,z-54];if(z>=90&&z<=103)return [10,z-86];let ends=[2,10,18,36,54,86,118],p=ends.findIndex(x=>z<=x),k=z-(p?ends[p-1]:0);return [p+1,p===0?(z===1?1:18):p<3?(k<=2?k:k+10):p<5?k:k<=3?k:k-14];}

function elementDetail(){let z=V.element,a=EL[z-1],[row,col]=elementPos(z),period=row>8?row-3:row,noStandard=[43,61,...Array.from({length:118-84+1},(_,i)=>84+i)].includes(z)&&z!==90&&z!==91&&z!==92;return `<div class="element-detail"><div class="element-big">${a[0]}</div><div><h3>${a[1]} <span class="muted mono">${z}</span></h3><p>${noStandard?'Representative isotope mass number':'Approximate atomic weight'}: <strong>${noStandard?'['+a[2]+']':a[2]}</strong> · Period ${period}${row<8?' · Group '+col:''} · ${elementBlock(z)} block</p><p>${z===2?'Helium is in group 18 but has an s-shell configuration (1s²).':row>8?'Detached rows belong to periods 6 and 7.':''}</p></div></div>`;}
function periodicHTML(){return `${elementDetail()}<div class="table-wrap"><div class="periodic" aria-label="Periodic table">${EL.map((a,i)=>{let [r,c]=elementPos(i+1);return `<button class="element block-${elementBlock(i+1)} ${V.element===i+1?'selected':''}" style="grid-row:${r};grid-column:${c}" data-action="element" data-z="${i+1}" aria-label="${a[1]}, atomic number ${i+1}" aria-pressed="${V.element===i+1}"><small>${i+1}</small><b>${a[0]}</b><span class="weight">${a[2]}</span></button>`}).join('')}</div></div><div class="element-legend"><span>s block · cream</span><span>p block · green</span><span>d block · blue</span><span>f block · violet</span></div><p class="inline-note">Tap an element for details. Approximate values retained from the starter app; use the masses given in a question when provided. Bracketed detail values are isotope mass numbers, not standard atomic weights. Series placement uses the La/Ac group-3 layout shown in your course.</p>`;}
const IONS=[['NH₄⁺','Ammonium','+1'],['OH⁻','Hydroxide','−1'],['CN⁻','Cyanide','−1'],['NO₃⁻','Nitrate','−1'],['NO₂⁻','Nitrite','−1'],['SO₄²⁻','Sulfate','−2'],['SO₃²⁻','Sulfite','−2'],['CO₃²⁻','Carbonate','−2'],['HCO₃⁻','Hydrogen carbonate (bicarbonate)','−1'],['PO₄³⁻','Phosphate','−3'],['C₂H₃O₂⁻','Acetate','−1'],['ClO⁻','Hypochlorite','−1'],['ClO₂⁻','Chlorite','−1'],['ClO₃⁻','Chlorate','−1'],['ClO₄⁻','Perchlorate','−1'],['CrO₄²⁻','Chromate','−2'],['Cr₂O₇²⁻','Dichromate','−2'],['MnO₄⁻','Permanganate','−1']];
function reference(){let labels=[['table','Periodic table'],['formulas','Formulas & constants'],['ions','Common ions'],['solubility','Solubility rules'],['visual','Visual tools']];return `<div class="page-head"><div><div class="eyebrow">Your lab bench</div><h1>Reference</h1><p>A few useful things, all in one place.</p></div></div><div class="ref-layout"><nav class="ref-nav" aria-label="Reference topics">${labels.map(([key,label])=>`<button data-action="ref-tab" data-tab="${key}" class="${V.ref===key?'active':''}" ${V.ref===key?'aria-current="page"':''}>${label}</button>`).join('')}</nav><div>${V.ref==='table'?`<section class="panel"><h3>The periodic table</h3><div id="periodic-content">${periodicHTML()}</div></section>`:V.ref==='formulas'?formulas():V.ref==='ions'?`<section class="panel"><h3>Common polyatomic ions</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Formula</th><th>Name</th><th>Charge</th></tr></thead><tbody>${IONS.map(row=>`<tr>${row.map(v=>`<td>${science(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="inline-note">Supports Lecture 6 and later reactions. This is a general reference list; the professor’s required GRN ion list was not supplied.</p></section>`:V.ref==='solubility'?solubility():visualTools()}</div></div>`;}

function waveVisual(){let n=V.wave,cycles=1600/n,points=[];for(let x=0;x<=600;x+=2)points.push(`${x},${60+32*Math.sin(x/600*Math.PI*2*cycles)}`);let color=n<380?'#8d70aa':n<450?'#755ab5':n<495?'#4a83b6':n<570?'#4b9876':n<590?'#b89c34':n<620?'#c78542':n<=750?'#bc6057':'#9b6265';return `<div class="visual-box"><svg viewBox="0 0 600 120" role="img" aria-label="Schematic light wave at ${n} nanometers"><path d="M0 60h600" stroke="var(--line)"/><polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="2.5"/></svg></div><div class="visual-readouts"><div class="readout"><b>${science((2.998e17/n).toExponential(3)+" Hz")}</b><span>Frequency · increases as wavelength falls</span></div><div class="readout"><b>${science((6.626e-34*2.998e17/n).toExponential(3)+" J")}</b><span>Energy per photon</span></div></div><p class="inline-note">${n<380?'Ultraviolet':n>750?'Infrared':'Approximately visible light'} · The color is an illustration, not a calibrated spectrum.</p>`;}
function orbitalVisual(){let totals={C:6,N:7,O:8,F:9,Ne:10,Mg:12,P:15,S:16,Cl:17,Ar:18},z=totals[V.orbital],left=z,config=[],html='';for(let [label,orbitals] of [['1s',1],['2s',1],['2p',3],['3s',1],['3p',3]]){if(left<=0)break;let count=Math.min(left,orbitals*2),occ=Array(orbitals).fill('');for(let i=0;i<count;i++)occ[i%orbitals]+=i<orbitals?'↑':'↓';html+=`<div class="subshell"><div class="orbital-row">${occ.map(a=>`<div class="orbital" aria-label="${a==='↑↓'?'two paired electrons':a?'one unpaired electron':'empty orbital'}">${a}</div>`).join('')}</div>${label}<sup>${count}</sup></div>`;config.push(label+count);left-=count;}return `<div class="orbital-set" role="img" aria-label="Ground-state orbital diagram for ${V.orbital}, ${z} electrons">${html}</div><p class="small muted">${V.orbital}: ${z} electrons. Each box is one orbital; opposite arrows represent opposite spins.</p>`;}
function orbitalMini(){return `<div class="panel"><h3>See the electron filling</h3><p class="small muted">Explore diagrams for C through Ar.</p><button class="btn soft" data-action="visual-tools">Open visual tools ${icon('arrow')}</button></div>`;}
const LEWIS={H2O:{label:'H₂O',caption:'8 total valence electrons · 2 O–H bonds · 2 lone pairs on O.',atoms:[['O',200,90],['H',120,155],['H',280,155]],bonds:[[200,90,120,155,1],[200,90,280,155,1]],pairs:[[180,55],[220,55]]},NH3:{label:'NH₃',caption:'8 total valence electrons · 3 N–H bonds · 1 lone pair on N.',atoms:[['N',200,105],['H',100,105],['H',300,105],['H',200,185]],bonds:[[200,105,100,105,1],[200,105,300,105,1],[200,105,200,185,1]],pairs:[[200,65]]},CO2:{label:'CO₂',caption:'16 total valence electrons · 2 C=O double bonds · 2 lone pairs on each O.',atoms:[['C',200,110],['O',95,110],['O',305,110]],bonds:[[200,110,95,110,2],[200,110,305,110,2]],pairs:[[95,70],[95,150],[305,70],[305,150]]},N2:{label:'N₂',caption:'10 total valence electrons · 1 triple bond · 1 lone pair on each N.',atoms:[['N',150,110],['N',250,110]],bonds:[[150,110,250,110,3]],pairs:[[105,110],[295,110]]},BF3:{label:'BF₃',caption:'24 total valence electrons · 3 single bonds · B has only 6 electrons around it.',atoms:[['B',200,110],['F',100,110],['F',280,45],['F',280,175]],bonds:[[200,110,100,110,1],[200,110,280,45,1],[200,110,280,175,1]],pairs:[[100,73],[100,147],[60,110],[280,12],[320,45],[250,15],[280,208],[320,175],[250,205]]}};
function lewisSvg(){let d=LEWIS[V.lewis],bonds=d.bonds.map(([x1,y1,x2,y2,k])=>{let dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;return Array.from({length:k},(_,i)=>{let off=(i-(k-1)/2)*6;return `<line x1="${x1+ux*23-uy*off}" y1="${y1+uy*23+ux*off}" x2="${x2-ux*23-uy*off}" y2="${y2-uy*23+ux*off}" stroke="var(--ink)" stroke-width="2"/>`}).join('')}).join('');return `<div class="lewis-drawing"><svg viewBox="0 0 400 230" role="img" aria-label="${e(d.label+' Lewis diagram. '+d.caption)}">${bonds}${d.atoms.map(([a,x,y])=>`<text x="${x}" y="${y+9}" text-anchor="middle" font-family="Georgia" font-size="29" fill="${a==='H'?'var(--muted)':'var(--accent)'}">${a}</text>`).join('')}${d.pairs.map(([x,y])=>`<circle cx="${x-5}" cy="${y}" r="2.6" fill="var(--rust)"/><circle cx="${x+5}" cy="${y}" r="2.6" fill="var(--rust)"/>`).join('')}</svg></div><p class="small">${e(d.caption)}</p><p class="source">Connectivity and electron counts only; these flat drawings are not 3D molecular geometry. Lectures 19–20 · §7.3.</p>`;}
function lewisViewer(){return `<div class="lewis-tabs">${Object.entries(LEWIS).map(([key,d])=>`<button class="choice" data-action="lewis" data-value="${key}" aria-pressed="${V.lewis===key}">${d.label}</button>`).join('')}</div><div id="lewis-content" class="visual-box">${lewisSvg()}</div>`;}
function lewisMini(){return `<section class="panel"><h3>Count the electrons</h3>${lewisViewer()}</section>`;}
function progress(){let seen=Q.filter(q=>P.stats[q.id]?.attempts),right=seen.filter(q=>P.stats[q.id].lastCorrect&&!P.stats[q.id].assisted),due=CARDS.filter(c=>P.cards[c.id]&&P.cards[c.id].due<=Date.now()),reviewed=CARDS.filter(c=>P.cards[c.id]?.reviews),future=reviewed.filter(c=>P.cards[c.id].due>Date.now());return `<div class="page-head"><div><div class="eyebrow">A simple record</div><h1>Your progress</h1><p>Keep track of what you’ve tried and what needs another pass.</p></div><div class="actions"><button class="btn" data-action="export">${icon('download')} Export backup</button><button class="btn" data-action="import">Import</button></div></div>${P.migrated?'<div class="callout">Your starter-app flashcard levels were carried over. Quiz results begin fresh because the questions have changed.</div>':''}<div class="metrics"><div class="metric"><strong>${seen.length}<span class="mono"> / ${Q.length}</span></strong><span>Questions attempted</span></div><div class="metric"><strong>${seen.length?Math.round(right.length/seen.length*100)+'%':'—'}</strong><span>Latest answers correct, unassisted</span></div><div class="metric"><strong>${missed().length}</strong><span>Questions to revisit</span></div></div><div class="actions" style="margin-bottom:24px"><button class="btn primary" data-action="review-missed" ${!missed().length?'disabled':''}>Review missed (${missed().length})</button><button class="btn" data-action="cards-due" ${!due.length?'disabled':''}>Review due cards (${due.length})</button></div><div class="study-layout"><section class="panel"><h3>By chapter</h3>${CH.slice(1).map((c,i)=>{let qs=Q.filter(q=>byUnit(q.unit).ch===i+1&&!byUnit(q.unit).extension),tried=qs.filter(q=>P.stats[q.id]?.attempts).length;return `<div class="progress-row"><span>${c.name}</span><div class="progress-track"><span style="width:${tried/qs.length*100}%"></span></div><span class="mono">${tried}/${qs.length}</span></div>`}).join('')}<p class="stat-note">Bars show coverage, not mastery. The accuracy figure uses each question’s latest attempt and excludes assisted successes.</p></section><aside><section class="panel"><h3>Recall schedule</h3><div class="history-row"><span>Reviewed cards</span><strong>${reviewed.length}</strong></div><div class="history-row"><span>Due now</span><strong>${due.length}</strong></div><div class="history-row"><span>Scheduled later</span><strong>${future.length}</strong></div><div class="history-row"><span>New cards</span><strong>${CARDS.filter(c=>!P.cards[c.id]).length}</strong></div><p class="inline-note">Again: 10 minutes. Hard: tomorrow. Got it: 1, 3, 7, 14, then 30 days as recall improves.</p></section></aside></div><section class="panel"><h3>Recent sessions</h3>${P.history.length?P.history.slice(0,10).map(h=>`<div class="history-row"><span>${e(h.title)} · ${h.mode==='exam'?'Test':'Practice'}<br><span class="muted">${new Date(h.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></span><strong>${h.correct}/${h.total}</strong></div>`).join(''):'<p class="muted small">Completed sessions will appear here.</p>'}</section><p class="small muted">Saved on this browser and device. Use Export backup before moving to another device, clearing browser data, or changing where the app is hosted.</p><button class="btn text" style="color:var(--bad)" data-action="reset">Reset local progress</button>`;}
function aboutText(){return `<h3>Sources & scope</h3><p class="small">Gen Chem Atlas builds on your original chemquest.html, Lectures 2–28, and six supplied exam booklets. Explanations, worked examples, practice questions, and diagrams were independently written. No OpenStax textbook passages, figures, or assessments are embedded.</p><p class="small">Textbook organization and reading references: <a href="https://openstax.org/books/chemistry-2e/pages/1-introduction" target="_blank" rel="noopener noreferrer">Chemistry 2e</a>, Paul Flowers, Klaus Theopold, Richard Langley, and William R. Robinson, OpenStax (2019). Section headings were checked against the publisher’s chapter outlines. <a href="https://openstax.org/books/chemistry-2e/pages/preface" target="_blank" rel="noopener noreferrer">Publisher information ↗</a>.</p><p class="small">Sources lists exact filenames and PDF pages. Chapter 8 includes Lectures 26–28. Chapter 9 is supported by Summer 2025 Exam 4; its lecture slides have not yet been supplied. Coverage follows the skills in your materials and may include only part of a textbook section. The course’s separate General Reference Notes and the separate Exam 3 answer-sheet cycle diagram were not supplied.</p><p class="small">Exam practice uses original questions matched to source skills. It is not a transcription or a prediction of a future exam. The molecule builder grades bond orders and lone pairs on fixed atom scaffolds. Orbital activities grade electron filling and predictions. Freehand structures and arbitrary molecules are not automatically graded.</p><p class="small">Most numerical questions allow a rounding tolerance; explicit precision questions assess the requested precision. The app works offline except for textbook links. Saved data stays in your browser and can be exported or imported. This is an independent study aid, not an official course assessment or an OpenStax product.</p>`;}

  const atom=(x,y,a,hi=false)=>`<circle cx="${x}" cy="${y}" r="${hi?23:18}" class="${hi?'orb-atom-focus':'orb-atom'}"/><text x="${x}" y="${y+7}" text-anchor="middle" class="orb-atom-letter">${a}</text>`;
  const bond=(x1,y1,x2,y2,n=1)=>Array.from({length:n},(_,i)=>{const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),ox=-dy/l*(i-(n-1)/2)*6,oy=dx/l*(i-(n-1)/2)*6;return `<path d="M${x1+dx/l*24+ox} ${y1+dy/l*24+oy}L${x2-dx/l*24+ox} ${y2-dy/l*24+oy}"/>`;}).join('');
  let b='';
  if(['carbonylC','carbonylO'].includes(t.sketch))b=bond(140,65,260,65,2)+bond(140,65,70,25)+bond(140,65,70,105)+atom(70,25,'H')+atom(70,105,'H')+atom(140,65,'C',t.sketch==='carbonylC')+atom(260,65,'O',t.sketch==='carbonylO');
  else if(t.sketch==='acetylene')b=bond(30,65,120,65)+bond(120,65,220,65,3)+bond(220,65,310,65)+atom(30,65,'H')+atom(120,65,'C',true)+atom(220,65,'C')+atom(310,65,'H');
  else if(t.sketch==='carbonDioxide')b=bond(60,65,170,65,2)+bond(170,65,280,65,2)+atom(60,65,'O')+atom(170,65,'C',true)+atom(280,65,'O');
  else{
    const center=t.sketch==='water'?'O':t.sketch==='ammonia'?'N':'C';
    let hs=t.sketch==='water'?[[95,105],[245,105]]:t.sketch==='ammonia'?[[65,65],[170,15],[275,65]]:[[70,65],[170,15],[270,65],[170,115]];
    b=hs.map(([x,y])=>bond(170,65,x,y)).join('')+hs.map(([x,y])=>atom(x,y,'H')).join('')+atom(170,65,center,true);
  }
  return `<figure class="orb-molecule"><svg viewBox="0 0 340 140" role="img" aria-label="${e(t.formula+' connectivity; '+t.focus+' highlighted. Bond directions are schematic, not a 3D geometry prediction.')}" fill="none" stroke="currentColor" stroke-width="2">${b}</svg><figcaption>Highlighted atom · 2D connectivity</figcaption></figure>`;
}
function orbBoard(t,s){
  return `<div class="orb-board"><svg class="orb-energy-axis" viewBox="0 0 35 400" preserveAspectRatio="none" aria-hidden="true"><path d="M25 385V14m-5 8 5-8 5 8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="orb-energy-label">Energy</span><div class="orb-levels">${t.groups.map((g,i)=>({g,i})).reverse().map(({g,i})=>`<div class="orb-level"><span class="orb-level-name">${science(t.track==='hybrid'&&i===0?(s.hybrid||'Hybrid set'):g.label)}${t.track==='mo'?`<small>${g.bond===1?'bonding':'antibonding'}</small>`:''}</span><div class="orb-box-group">${s.boxes[i].map((v,j)=>`<button type="button" class="orb-box ${v?'orb-occupied':''}" data-lab-action="orb-box" data-row="${i}" data-col="${j}" ${s.solved?'disabled':''} aria-label="${e(g.label)} orbital ${j+1}: ${['empty','one up-spin electron','one down-spin electron','two electrons with opposite spins'][v]}. Activate to change occupancy."><span aria-hidden="true">${['','↑','↓','↑↓'][v]}</span><span class="orb-box-line" aria-hidden="true"></span></button>`).join('')}</div></div>`).join('')}</div></div>`;
}
function orbFeedback(t,s){
  if(!s.feedback)return '';
  const ok=s.feedback.correct;
  return `<div class="orb-feedback ${ok?'orb-success':''}" role="status"><strong>${s.revealed?'Solution':ok?'Configuration complete!':'Keep building'}</strong>${ok?`<p>${science(orbAnswer(t))}</p><details class="play-help"><summary>Why it works</summary><p>${e(t.explanation)}</p></details>`:`<ul>${s.feedback.errors.map(x=>`<li>${e(x)}</li>`).join('')}</ul>`}</div>`;
}
LABS.orbitals={
  title:'Orbital builder',description:'Place electrons. Predict bonding and magnetism.',icon:'atom',units:['u15','u16','u24','u25'],
  create(unit){const pool=orbPool(unit),s={unit,track:orbTrack(unit),round:0};orbReset(s,pool[0].id);return s;},
  render(s){

    return `<section class="orb-lab"><div class="orb-heading"><div><h2>${science(t.title)}</h2></div><label class="orb-task-picker">Challenge<select data-lab-input="orb-task" aria-label="Choose orbital challenge">${pool.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${e(x.title)}</option>`).join('')}</select></label></div><p class="orb-prompt">${e(t.prompt)}</p>${t.track==='hybrid'?orbSketch(t):''}<div class="orb-workspace"><div class="orb-diagram-panel"><div class="orb-budget ${delta<0?'orb-over-budget':''}"><span><b>${total}</b> / ${t.electrons} electrons</span><span>${delta>0?delta+' to place':delta<0?Math.abs(delta)+' too many':'Budget filled'}</span></div>${t.track==='mo'?`<p class="orb-order-note">Valence orbitals only · ${t.piFirst?'π2p is below σ2p':'σ2p is below π2p'} for this challenge.</p>`:t.track==='hybrid'?'<p class="orb-order-note">Bonded-atom diagram · hybrid orbitals below the remaining p orbitals.</p>':'<p class="orb-order-note">Ground-state atom · lowest energy at the bottom.</p>'}${orbBoard(t,s)}<p class="orb-cycle">Tap a box: empty → ↑ → ↓ → ↑↓.</p><details class="play-help"><summary>Diagram notes</summary><p>Energy spacing is schematic. Equal-energy boxes are interchangeable. Each box holds at most two opposite-spin electrons.</p></details></div><div class="orb-predictions">${t.track==='mo'?`<h3>Make a prediction</h3><label>Bond order<input type="text" inputmode="decimal" data-lab-input="orb-bondOrder" value="${e(s.bondOrder)}" placeholder="e.g. 1.5" ${s.solved?'disabled':''}></label><label>Magnetic behavior<select data-lab-input="orb-magnetism" ${s.solved?'disabled':''}><option value="">Choose…</option><option value="para" ${s.magnetism==='para'?'selected':''}>Paramagnetic · unpaired electrons</option><option value="dia" ${s.magnetism==='dia'?'selected':''}>Diamagnetic · all paired</option></select></label>`:t.track==='hybrid'?`<h3>Predict the bonds</h3><label>Hybridization<select data-lab-input="orb-hybrid" ${s.solved?'disabled':''}><option value="">Choose…</option>${['sp','sp²','sp³'].map(x=>`<option ${s.hybrid===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="orb-count-fields"><label>σ bonds at this atom<input type="text" inputmode="numeric" data-lab-input="orb-sigma" value="${e(s.sigma)}" placeholder="0–4" ${s.solved?'disabled':''}></label><label>π bonds at this atom<input type="text" inputmode="numeric" data-lab-input="orb-pi" value="${e(s.pi)}" placeholder="0–2" ${s.solved?'disabled':''}></label></div><p>Count bonds at the highlighted atom only.</p>`:`<h3>Fill the orbitals</h3><details class="play-help"><summary>Three filling rules</summary><ol><li>Lowest energy first.</li><li>One electron in each equal-energy box before pairing.</li><li>Keep unpaired spins parallel within a set.</li></ol><p>All ↑ or all ↓ is accepted.</p></details>`}<div class="orb-actions">${!s.solved?'<button class="btn primary" data-lab-action="orb-check">Check</button>':'<button class="btn primary" data-lab-action="orb-next">Next challenge →</button>'}<button class="btn" data-lab-action="orb-clear">Clear diagram</button>${!s.solved?'<button class="btn text" data-lab-action="orb-hint">Hint</button><button class="btn text" data-lab-action="orb-reveal">Show solution</button>':''}</div></div></div>${s.showHint?`<div class="orb-hint"><strong>Hint</strong><p>${e(t.hint)}</p></div>`:''}${orbFeedback(t,s)}<details class="source orb-source"><summary>Source</summary><p>${e(t.source)}</p></details></section>`;
  },
  act(s,action,el){
    const t=orbTask(s);if(!t)return;
    if(action==='orb-box'&&!s.solved){const i=Number(el.dataset.row),j=Number(el.dataset.col);if(s.boxes[i]&&Number.isInteger(j)&&j>=0&&j<s.boxes[i].length)s.boxes[i][j]=(s.boxes[i][j]+1)%4;s.feedback=null;}
    else if(action==='orb-check'&&!s.solved){
      const result=orbValidate(t,s);s.feedback=result;
      if(!s.recorded){labRecord('orbitals-'+t.id+'-'+s.unit,result.correct,s.assisted);s.recorded=true;}
      else if(result.correct)labRecord('orbitals-'+t.id+'-'+s.unit,true,true);
      if(result.correct){s.solved=true;s.round++;}else s.assisted=true;
    }
    else if(action==='orb-clear'){const assisted=s.assisted||s.recorded||s.solved;const recorded=s.recorded;orbReset(s,t.id);s.assisted=assisted;s.recorded=recorded;}
    else if(action==='orb-hint'){s.showHint=true;s.assisted=true;}
    else if(action==='orb-reveal'&&!s.solved){
      s.assisted=true;s.revealed=true;s.boxes=t.solution.map(row=>[...row]);s.hybrid=t.hybrid||'';s.sigma=t.sigma??'';s.pi=t.pi??'';s.bondOrder=t.bondOrder??'';s.magnetism=t.magnetism||'';s.feedback={correct:true,errors:[]};s.solved=true;
      if(!s.recorded){labRecord('orbitals-'+t.id+'-'+s.unit,false,true);s.recorded=true;}
    }
    else if(action==='orb-next'){const pool=orbPool(s.unit);const i=pool.findIndex(x=>x.id===s.id);orbReset(s,pool[(i+1)%pool.length].id);}
  },
  change(s,el){
    const input=el.dataset.labInput;
    if(input==='orb-task'){if(orbPool(s.unit).some(t=>t.id===el.value))orbReset(s,el.value);return;}
    if(s.solved)return;
    const prop=input?.replace('orb-','');
    if(['hybrid','sigma','pi','bondOrder','magnetism'].includes(prop)){s[prop]=el.value;s.feedback=null;}
  }
};

function eqLoad(s){const template=EQ_TEMPLATES.find(t=>t.id===s.pool[s.round%s.pool.length]);s.template=template.id;s.q=template.build();s.stage=0;s.good=false;s.feedback='';s.entry='';s.answerUnit='';s.assisted=false;s.hadError=false;s.recorded=false;s.revealed=false;s.selected=null;s.relationshipChoices=shuffle(s.q.relationship);s.setupChoices=shuffle(s.q.setup);return s;}

function eqRender(s){
 if(s.finished)return `<section class="eq-complete panel"><div class="eq-medal" aria-hidden="true">✓</div><h2>Round complete!</h2><button class="btn primary" data-lab-action="eq-restart">Play again ${icon('arrow')}</button></section>`;

 return `<div class="eq-round"><span>Calculation ${s.round+1} of ${s.total}</span></div><ol class="eq-chain" aria-label="Calculation steps">${labels.map((label,i)=>`<li class="${i<s.stage?'done':i===s.stage?'active':''}" ${i===s.stage?'aria-current="step"':''}><span>${i<s.stage?'✓':i+1}</span>${label}</li>`).join('')}</ol><section class="eq-board panel"><div class="eq-topline"><span class="eq-kicker">${e(title)}</span><span class="eq-target">Find ${science(q.target)}</span></div><h2 class="eq-prompt">${science(q.prompt)}</h2><dl class="eq-givens">${q.given.map(([label,value])=>`<div><dt>${e(label)}</dt><dd>${science(value)}</dd></div>`).join('')}</dl><div class="eq-task"><h3>${labels[s.stage]}</h3>${s.stage<2?`<div class="eq-options">${eqStageOptions(s).map((choice,i)=>`<button class="eq-option ${s.selected===i?(s.good?'correct':'incorrect'):''}" data-lab-action="eq-select" data-index="${i}" ${s.good||s.revealed?'disabled':''}><span class="eq-option-letter">${String.fromCharCode(65+i)}</span><span>${science(choice)}</span></button>`).join('')}</div>`:`<div class="eq-selected-equation">${science(q.setup[0])}</div><div class="eq-answer-row"><label for="eq-answer"><span>Numerical answer</span><input id="eq-answer" data-lab-input="eq-value" inputmode="text" autocomplete="off" spellcheck="false" value="${e(s.entry)}" placeholder="e.g. 2.50 or 2.50e-4" ${s.good||s.revealed?'disabled':''}></label><label for="eq-unit"><span>Unit</span><select id="eq-unit" data-lab-input="eq-unit" ${s.good||s.revealed?'disabled':''}><option value="">Choose unit</option>${q.unitChoices.map(u=>`<option value="${e(u)}" ${u===s.answerUnit?'selected':''}>${e(u)}</option>`).join('')}</select></label><button class="btn primary" data-lab-action="eq-check" ${s.good||s.revealed?'disabled':''}>Check answer</button></div><p class="eq-help">Use 3 significant figures. Choose the unit.</p>`}</div>${s.feedback?`<div class="eq-feedback ${s.good?'correct':s.revealed?'revealed':''}" role="status">${s.feedback}</div>`:''}${s.revealed||s.good&&s.stage===2?`<div class="eq-solution"><h3>Solution</h3><ol>${q.steps.map(step=>`<li>${science(step)}</li>`).join('')}</ol></div>`:''}<div class="eq-actions">${s.revealed||s.good&&s.stage===2?`<button class="btn primary" data-lab-action="eq-next">${s.round+1===s.total?'Finish round':'Next calculation'} ${icon('arrow')}</button>`:s.good?`<button class="btn primary" data-lab-action="eq-continue">${s.stage===0?'Set up the target':'Calculate'} ${icon('arrow')}</button>`:`<button class="btn" data-lab-action="eq-hint">Hint</button><button class="btn text" data-lab-action="eq-solution">Show solution</button>`}</div></section>`;
}
function eqRecord(s,correct){if(s.recorded)return;s.recorded=true;s.completed++;if(correct&&!s.assisted&&!s.hadError)s.independent++;labRecord('equation-'+s.template,correct,s.assisted||s.hadError);}
function eqAct(s,action,el){
 if(action==='eq-restart'){Object.assign(s,eqCreate(s.unitKey));return;}
 if(s.finished)return;
 if(action==='eq-next'){if(!(s.revealed||s.stage===2&&s.good))return;s.round++;if(s.round>=s.total)s.finished=true;else eqLoad(s);return;}
 if(s.revealed)return;
 if(action==='eq-select'&&s.stage<2&&!s.good){const index=Number(el.dataset.index),choices=eqStageOptions(s);if(!Number.isInteger(index)||index<0||index>=choices.length)return;s.selected=index;s.good=choices[index]===(s.stage===0?s.q.relationship[0]:s.q.setup[0]);if(s.good)s.feedback=s.stage===0?'✓ Correct. Now rearrange.':'✓ Ready to calculate.';else{s.hadError=true;s.feedback=s.stage===0?'Check which quantities the equation connects.':'Check the algebra, units, and factors.';}return;}
 if(action==='eq-continue'&&s.stage<2&&s.good){s.stage++;s.good=false;s.selected=null;s.feedback='';return;}
 if(action==='eq-hint'&&!s.good){s.assisted=true;s.feedback='Hint: '+science(s.q.hint);return;}
 if(action==='eq-solution'){s.assisted=true;s.revealed=true;s.feedback=`Answer: <strong>${science(eqNum(s.q.answer)+' '+s.q.unit)}</strong>`;eqRecord(s,false);return;}
 if(action==='eq-check'&&s.stage===2&&!s.good){const input=typeof document!=='undefined'?document.getElementById('eq-answer'):null,unit=typeof document!=='undefined'?document.getElementById('eq-unit'):null;if(input)s.entry=input.value;if(unit)s.answerUnit=unit.value;const value=eqParse(s.entry);if(!Number.isFinite(value)){s.feedback='Enter a finite numerical answer. Scientific notation such as 3.20e-19 is accepted.';return;}if(!s.answerUnit){s.feedback='Choose the unit that belongs to your answer.';return;}const goodNumber=Math.abs(value-s.q.answer)<=Math.max(Math.abs(s.q.answer)*0.0025,Number.EPSILON*Math.abs(s.q.answer)*8),goodUnit=s.answerUnit===s.q.unit;s.good=goodNumber&&goodUnit;if(s.good){s.feedback=`✓ Correct! ${science(eqNum(s.q.answer)+' '+s.q.unit)}.`;eqRecord(s,true);}else{s.hadError=true;s.feedback=goodNumber?'The numerical value is right. Recheck the unit after canceling factors.':goodUnit?'The unit is right. Recheck the substitution, conversion, and sign.':'Recheck the calculation and unit. Need help? Try a hint.';}return;}
}
function eqChange(s,el){if(s.finished||s.good||s.revealed)return false;if(el.dataset.labInput==='eq-value')s.entry=el.value;else if(el.dataset.labInput==='eq-unit')s.answerUnit=el.value;return false;}

function ionFormulaBoard(s,t){
 const v=s.values,complete=ionValidCount(v.cation,12,1)&&ionValidCount(v.anion,12,1),charge=complete?v.cation*t.cation[1]+v.anion*t.anion[1]:null;
 return `<div class="ion-ion-pair"><div class="ion-cation"><span>CATION</span><strong>${science(ionDisplay(t.cation))}</strong><small>${e(t.cation[3])}</small></div><span aria-hidden="true">+</span><div class="ion-anion"><span>ANION</span><strong>${science(ionDisplay(t.anion))}</strong><small>${e(t.anion[3])}</small></div></div><p class="ion-instruction">Make a neutral formula. Use the smallest ion ratio.</p><div class="ion-controls ion-two">${ionCountControl(s,'cation','Cation count',12,1)}${ionCountControl(s,'anion','Anion count',12,1)}</div><div class="ion-formula-preview"><div><span>YOUR FORMULA</span><strong>${complete?science(ionFormula(t,v.cation,v.anion)):'—'}</strong></div><div class="ion-net ${charge===0?'ion-neutral':''}"><span>NET CHARGE</span><strong>${charge===null?'—':ionCharge(charge)}</strong><small>${charge===null?'Enter both counts':charge===0?'Neutral':'Needs balancing'}</small></div></div><div class="ion-charge-math">${complete?`${v.cation} × (${ionSigned(t.cation[1])}) + ${v.anion} × (${ionSigned(t.anion[1])}) = ${ionSigned(charge)}`:'Charge = cation count × cation charge + anion count × anion charge'}</div><label class="ion-name-label" for="ion-name"><span>Name your compound</span><select id="ion-name" data-lab-input="ion-name" ${s.solved||s.revealed?'disabled':''}><option value="">Choose a name…</option>${s.names.map(n=>`<option value="${e(n)}" ${v.name===n?'selected':''}>${e(n)}</option>`).join('')}</select></label><details class="play-help"><summary>Formula tips</summary><p>Repeated polyatomic ions get parentheses. This formula unit shows ion ratios; it does not predict solubility.</p></details>`;
}
function ionRender(s){
 if(s.done)return `<section class="panel ion-finish"><div class="ion-medal" aria-hidden="true">✦</div><h2>Round complete!</h2><button class="btn primary" data-lab-action="ion-round">Play again ${icon('arrow')}</button></section>`;
 const t=ionTask(s),steps=ionSteps(t,s.track);
 return `<section class="panel ion-board"><div class="ion-top"><span class="pill">${s.track==='particles'?'Atom & ion inventory':'Ionic formula builder'}</span><span>Build ${s.index+1} / ${s.order.length}</span></div>${s.track==='particles'?ionParticleBoard(s,t):ionFormulaBoard(s,t)}${s.feedback?`<div class="ion-feedback ${s.feedback.correct?'ion-correct':'ion-retry'}" role="status"><strong>${s.feedback.correct?'Built correctly':s.feedback.kind==='multiple'?'Balanced—now simplify':'Check your build'}</strong><p>${e(s.feedback.message)}</p>${s.feedback.correct?`<ol>${steps.map(x=>`<li>${science(x)}</li>`).join('')}</ol>`:''}</div>`:''}${s.hint&&!s.revealed?`<div class="ion-hint"><strong>Hint</strong><p>${s.track==='particles'?'Start with Z. Then use neutrons = A − Z and electrons = Z − charge. A negative charge means extra electrons.':`Match the total positive charge to the total negative charge. The ion charges are ${ionCharge(t.cation[1])} and ${ionCharge(t.anion[1])}. Reduce both counts together, then check the name.`}</p></div>`:''}${s.revealed?`<div class="ion-hint" role="status"><strong>Worked build</strong>${s.track==='formula'?`<p class="ion-answer">${science(ionFormula(t,...t.ratio))} · ${e(t.name)}</p>`:''}<ol>${steps.map(x=>`<li>${science(x)}</li>`).join('')}</ol></div>`:''}<div class="ion-actions">${s.solved||s.revealed?`<button class="btn primary" data-lab-action="ion-next">${s.index+1===s.order.length?'Finish round':'Next build'} ${icon('arrow')}</button>`:`<button class="btn primary" data-lab-action="ion-check">Check build ${icon('check')}</button><button class="btn" data-lab-action="ion-hint" ${s.hint?'disabled':''}>Hint</button><button class="btn text" data-lab-action="ion-reveal">Show solution</button>`}</div></section>`;
}
function ionAct(s,action,el){
 if(action==='ion-round'){Object.assign(s,ionCreate(s.unit));return;}
 if(s.done)return;
 const t=ionTask(s);
 if(action==='ion-next'&&(s.solved||s.revealed)){s.index++;if(s.index>=s.order.length)s.done=true;else ionLoad(s);return;}
 if(s.solved||s.revealed)return;
 if(action==='ion-plus'||action==='ion-minus'){
  const key=el.dataset.field,allowed=s.track==='particles'?['protons','neutrons','electrons']:['cation','anion'];if(!allowed.includes(key))return;
  const max=s.track==='particles'?200:12,min=s.track==='particles'?0:1;
  s.values[key]=Math.max(min,Math.min(max,(Number.isFinite(s.values[key])?s.values[key]:min)+(action==='ion-plus'?1:-1)));s.drafts[key]=String(s.values[key]);s.feedback=null;return;
 }
 if(action==='ion-hint'){s.hint=true;s.assisted=true;return;}
 if(action==='ion-reveal'){
  s.revealed=true;s.assisted=true;s.feedback=null;s.values=ionSolution(t,s.track);s.drafts=Object.fromEntries(Object.entries(s.values).map(([k,v])=>[k,String(v)]));
  if(s.recorded===null){labRecord('ion-'+t.id,false,true);s.recorded=false;}return;
 }
 if(action==='ion-check'){
  const result=ionValidate(t,s.track,s.values);s.feedback=result;
  if(s.recorded===null){labRecord('ion-'+t.id,result.correct,s.assisted);s.recorded=result.correct;}
  else if(result.correct&&s.recorded===false){labRecord('ion-'+t.id,true,true);s.recorded=true;}
  if(result.correct){s.solved=true;if(!s.assisted)s.independent++;}else s.assisted=true;
 }
}
function ionChange(s,el){
 if(s.done||s.solved||s.revealed)return false;
 if(el.dataset.labInput==='ion-name'&&s.track==='formula'){s.values.name=s.names.includes(el.value)?el.value:'';s.drafts.name=s.values.name;s.feedback=null;return;}
 if(el.dataset.labInput==='ion-count'){
  const key=el.dataset.field,allowed=s.track==='particles'?['protons','neutrons','electrons']:['cation','anion'];if(!allowed.includes(key))return false;
  const raw=String(el.value);s.drafts[key]=raw;s.values[key]=raw.trim()===''?null:Number(raw);s.feedback=null;return;
 }
 return false;
}
LABS.ions={title:'Ion builder',description:'Build ions. Make neutral formulas.',icon:'atom',units:['u2','u3','u4','u18'],create:ionCreate,render:ionRender,act:ionAct,change:ionChange};

draw();
</script></body></html>
