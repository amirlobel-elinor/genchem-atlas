<script>const BRAND_MARK="<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"512\" height=\"512\" viewBox=\"0 0 64 64\"><rect width=\"64\" height=\"64\" rx=\"12\" fill=\"#214b7b\"/><rect x=\"4.5\" y=\"4.5\" width=\"55\" height=\"55\" rx=\"8\" fill=\"none\" stroke=\"#7396bf\" stroke-width=\".8\"/><g fill=\"#fff\" font-family=\"Arial,Helvetica,sans-serif\"><text x=\"11\" y=\"16\" font-size=\"8\">20</text><text x=\"32\" y=\"44\" text-anchor=\"middle\" font-size=\"33\" font-weight=\"700\" letter-spacing=\"-1.6\">Ca</text><text x=\"32\" y=\"55\" text-anchor=\"middle\" font-size=\"6.3\" letter-spacing=\".6\" fill=\"#d0def0\">40.078</text></g></svg>\n";const DATA={"units":[{"id":"1.1–1.4","ch":1,"t":"Matter, Properties, Units, and Density","k":[["Pure substance","A sample of constant composition: a single element or compound"],["Mixture","Two or more substances combined, either homogeneous or heterogeneous"],["Extensive property","A property that depends on the amount of sample, like mass or volume"],["Intensive property","A property independent of sample amount, like density or boiling point"],["Density","Mass per unit volume of a substance"]],"f":[["Density","d = m / V"],["Celsius to Kelvin","T(K) = T(°C) + 273.15"],["Fahrenheit to Celsius","T(°C) = (T(°F) − 32)(5/9)"]],"key":"u0","title":"Matter & measurement","sources":[{"lecture":2,"pages":"2–10","file":"Lecture 2 Slides.pdf"}],"sections":["1.1","1.2","1.3","1.4"],"notes":["Classify a sample before calculating: a pure substance has fixed composition; a mixture can vary. A compound contains more than one element chemically combined.","A physical change keeps chemical identity. A chemical change creates different substances. A property describes what a sample is like or how it can behave.","Mass and volume depend on sample size. Density and boiling point are intensive when conditions and composition are fixed.","Write conversion factors so unwanted units cancel. For squared or cubed units, apply the conversion factor to the same power."],"method":["Identify the requested unit.","Write a chain of unit ratios.","Calculate and check the scale."],"trap":"Do not use the final water level as an object’s volume: use the rise in water level.","extension":false,"label":"Lecture 2","example":"u0-q4","examRefs":[{"exam":"fa26-pe1","file":"Blank Fa26 PE1.pdf","pages":"4–8"},{"exam":"su25-e1","file":"105A_E1_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u0-c0","u0-c1","u0-c2","u0-c3","u0-c4","u0-c5","u0-c6","u0-c7"]},{"id":"1.5–1.6","ch":1,"t":"Measurement, Significant Digits, and Problem Solving","k":[["Significant digits","All certain digits in a measurement plus one estimated digit"],["Accuracy","How close a measurement is to the true value"],["Precision","How close repeated measurements are to one another"],["Dimensional analysis","Using conversion factors to cancel units and reach the desired unit"]],"f":[["Sig figs in addition and subtraction","Result has as many decimal places as the least precise value"],["Sig figs in multiplication and division","Result has as many significant figures as the value with the fewest"],["Celsius to Fahrenheit","T(°F) = (9/5) T(°C) + 32"]],"key":"u1","title":"Precision & significant figures","sources":[{"lecture":3,"pages":"2–10","file":"Lecture 3 Slides.pdf"}],"sections":["1.5","1.6"],"notes":["A measured value contains certain digits plus one estimated digit. Exact counts and defined conversion factors do not limit precision.","Leading zeros do not count. Zeros between nonzero digits count; trailing zeros after a decimal point count. Scientific notation makes intended precision explicit.","For products and quotients, use the fewest significant figures. For sums and differences, use the least precise decimal place.","Keep guard digits through intermediate steps. Round the final answer once. Accuracy concerns agreement with a reference; precision concerns agreement among repeated results."],"method":["Choose the appropriate rounding rule.","Compute without rounding intermediate steps.","Report the final value at the required precision."],"trap":"Kelvin has no degree symbol. The exact offset 273.15 does not add precision to a measured Celsius temperature.","extension":false,"label":"Lecture 3","example":"u1-q4","examRefs":[{"exam":"fa26-pe1","file":"Blank Fa26 PE1.pdf","pages":"4–8"},{"exam":"su25-e1","file":"105A_E1_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u1-c0","u1-c1","u1-c2","u1-c3","u1-c4","u1-c5","u1-c6"]},{"id":"2.1–2.3","ch":2,"t":"Atomic Theory, Atomic Structure, and the Periodic Table","k":[["Law of definite proportions","A compound always contains the same elements in the same mass proportions"],["Law of multiple proportions","Masses of one element combining with a fixed mass of another form small whole-number ratios"],["Isotopes","Atoms of the same element with different numbers of neutrons"],["Period","A horizontal row of the periodic table"],["Group","A vertical column of the periodic table"]],"f":[["Atomic number","= number of protons"],["Mass number","= protons + neutrons"],["Number of neutrons","= mass number − atomic number"],["Overall charge of an ion","= protons − electrons"]],"key":"u2","title":"Atoms, ions & the periodic table","sources":[{"lecture":4,"pages":"2–14","file":"Lecture 4 Slides.pdf"}],"sections":["2.1","2.2","2.3","2.5"],"notes":["Atomic number Z counts protons and identifies the element. Mass number A counts protons plus neutrons in one isotope.","Isotopes have the same Z and different neutron counts. Ions form by changing electron count, not proton count.","For a charge written as a signed number, electrons = Z − charge. A negative charge therefore means more electrons than protons.","The periodic table groups elements with related chemistry. Groups run vertically; periods run horizontally. Definite proportions concerns one compound; multiple proportions compares different compounds of the same elements."],"method":["Find Z from the element.","Calculate neutrons as A − Z.","Adjust electron count for the signed charge."],"trap":"Mass number is an integer count. Isotopic mass in u is close to that count, but is not exactly the same quantity.","extension":false,"label":"Lecture 4","example":"u2-q4","examRefs":[{"exam":"fa26-pe1","file":"Blank Fa26 PE1.pdf","pages":"4–8"},{"exam":"su25-e1","file":"105A_E1_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u2-c0","u2-c1","u2-c2","u2-c3","u2-c4","u2-c5","u2-c6","u2-c7","u2-c8"]},{"id":"2.3–2.4","ch":2,"t":"Atomic Mass, Isotopes, and Chemical Formulas","k":[["Average atomic mass","Mass averaged over isotopes, weighted by natural abundance"],["Molecular formula","Gives the type and number of every atom in a molecule"],["Empirical formula","Gives the simplest whole-number ratio of atoms"],["Structural formula","Shows how the atoms are connected"],["Isomers","Different molecules sharing the same molecular formula"]],"f":[["Average atomic mass","Σ (fractional abundance × isotope mass)"]],"key":"u3","title":"Isotopes & chemical formulas","sources":[{"lecture":5,"pages":"2–9","file":"Lecture 5 Slides.pdf"}],"sections":["2.3","2.4"],"notes":["An average atomic mass is a weighted mean of isotope masses. Use fractional abundances that add to 1.","For two isotopes, write the fractions as x and 1 − x. For several isotopes, subtract known percentages from 100% to find a missing abundance.","A molecular formula gives actual atom counts; an empirical formula gives the smallest whole-number ratio. A structural formula records connections.","Constitutional isomers have the same molecular formula and different connectivity. Matching a formula alone does not establish identical structure."],"method":["Convert percentages to fractions.","Multiply each mass by its fraction and add.","Check that the mean lies between the isotope masses."],"trap":"Do not round an average atomic mass to an integer before using it in a molar-mass calculation.","extension":false,"label":"Lecture 5","example":"u3-q3","examRefs":[{"exam":"fa26-pe1","file":"Blank Fa26 PE1.pdf","pages":"4–8"},{"exam":"su25-e1","file":"105A_E1_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u3-c0","u3-c1","u3-c2","u3-c3","u3-c4","u3-c5"]},{"id":"2.6–2.7","ch":2,"t":"Molecular and Ionic Compounds; Nomenclature","k":[["Monatomic ion","An ion made of a single atom, such as Ca²⁺ or Cl⁻"],["Polyatomic ion","An ion made of several bonded atoms, such as SO₄²⁻"],["Oxyanion","A polyatomic anion containing oxygen"],["Ionic compound (salt)","Electrically neutral material made of cations and anions in a repeating structure"],["Molecular compound","Compound of nonmetals held together by covalent bonds"],["Oxyacid","An acid that contains an oxyanion"]],"f":[["Roman numerals in ionic names","Show the charge of a metal that can form more than one ion"],["Naming oxyacids from oxyanions","-ate becomes -ic acid; -ite becomes -ous acid"],["Naming binary acids","hydro- + base name + -ic acid"],["Diatomic elements","H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂"]],"key":"u4","title":"Compounds & naming","sources":[{"lecture":6,"pages":"3–16","file":"Lecture 6 Slides.pdf"}],"sections":["2.6","2.7"],"notes":["An ionic formula must have total charge zero. Choose the smallest whole-number ratio of ions and place parentheses around a repeated polyatomic ion.","Name ionic compounds as cation then anion. A Roman numeral gives a variable-charge metal’s charge, not its subscript. Ammonium salts are ionic even though they contain no metal.","For molecular compounds, prefixes state atom counts. Usually omit mono- on the first element. Familiar acid names follow their own rules.","An -ate oxyanion gives an -ic acid; -ite gives -ous. Binary acids in water use hydro-…-ic acid. Not every ionic solid is soluble."],"method":["Identify ionic, molecular, or acid naming.","Find ion charges or atom counts.","Check charge balance and parentheses."],"trap":"Do not use molecular prefixes to name an ionic compound, or infer that every metal must have a Roman numeral.","extension":false,"label":"Lecture 6","example":"u4-q7","examRefs":[{"exam":"fa26-pe1","file":"Blank Fa26 PE1.pdf","pages":"4–8"},{"exam":"su25-e1","file":"105A_E1_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u4-c0","u4-c1","u4-c2","u4-c3","u4-c4","u4-c5","u4-c6","u4-c7","u4-c8","u4-c9"]},{"id":"3.1–3.2","ch":3,"t":"Moles, Formula Masses, and Formula Determination","k":[["Mole","SI amount of substance containing exactly 6.02214076 × 10²³ specified entities"],["Molar mass","Mass of one mole of a substance, in g/mol"],["Percent composition","Percent by mass of each element in a compound"],["Combustion analysis","Burning a sample and measuring CO₂ and H₂O to find its C and H content"]],"f":[["Avogadro’s number","Nₐ = 6.02214076 × 10²³ mol⁻¹ (use 6.022 × 10²³ for this practice)"],["Percent composition","% X = (mass of X ÷ mass of compound) × 100%"],["Molecular formula from empirical formula","Multiply the empirical formula by (molar mass ÷ empirical formula mass)"],["Moles from mass","n = m / M (M is molar mass)"],["Entities from moles","N = nNₐ"]],"key":"u5","title":"Moles & formula determination","sources":[{"lecture":7,"pages":"2–15","file":"Lecture 7 Slides1.pdf"}],"sections":["3.1","3.2"],"notes":["Use molar mass to move between grams and moles. Use Avogadro’s constant to move between moles and entities; specify whether you mean atoms, molecules, or formula units.","Mass percent is the mass contributed by one element divided by the compound’s total mass. For percentages, a hypothetical 100 g sample is a convenient starting point.","To find an empirical formula, convert each element’s mass to moles, divide by the smallest, then scale all ratios to whole numbers. A ratio near 1.5 usually calls for multiplying all ratios by 2.","Combustion analysis gives n(C) = n(CO₂) and n(H) = 2n(H₂O). If a sample contains only C, H, and O, find its oxygen mass by subtracting C and H masses from the sample mass."],"method":["Masses → moles of each element.","Moles → smallest whole-number ratio.","Use molar mass to scale to the molecular formula."],"trap":"A formula such as H₂O counts atoms per molecule; one mole of H₂O contains two moles of H atoms.","extension":false,"label":"Lecture 7","example":"u5-q2","examRefs":[{"exam":"fa26-pe1","file":"Blank Fa26 PE1.pdf","pages":"4–8"},{"exam":"su25-e1","file":"105A_E1_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u5-c0","u5-c1","u5-c2","u5-c3","u5-c4","u5-c5","u5-c6","u5-c7","u5-c8"]},{"id":"3.3–3.4","ch":3,"t":"Solutions, Molarity, and Dilution","k":[["Solution","A homogeneous mixture"],["Solvent","The component that does the dissolving, usually in greater amount"],["Solute","A component dissolved in the solvent"],["Aqueous solution","A solution with water as the solvent"],["Molarity","Moles of solute per liter of solution"]],"f":[["Molarity","M = mol solute ÷ L solution"],["Dilution","M₁V₁ = M₂V₂"],["Mass percent","% w/w = (g solute ÷ g solution) × 100"],["Mass-volume percent","% m/v = g solute per 100 mL of solution"],["Volume percent","% v/v = (volume solute / volume solution) × 100"]],"key":"u6","title":"Solutions & concentration","sources":[{"lecture":8,"pages":"2–7","file":"Lecture 8 Slides.pdf"}],"sections":["3.3","3.4"],"notes":["Molarity is moles of solute per liter of final solution. It is not moles per liter of solvent added.","During dilution, solute amount stays constant: M₁V₁ = M₂V₂. Use matching volume units on both sides.","Mass percent uses mass of solution in the denominator; volume percent uses solution volume. A mass/volume percentage states grams of solute per 100 mL of solution.","Density can connect mass of solution to volume of solution. For an ionic solute, multiply the formula-unit concentration by the number of each ion released."],"method":["Convert volume to liters when using n = MV.","Find solute moles.","Divide by final solution volume."],"trap":"Final volume and solvent added are different. Subtract the initial volume only when volume additivity is explicitly assumed.","extension":false,"label":"Lecture 8","example":"u6-q2","examRefs":[{"exam":"fa26-pe1","file":"Blank Fa26 PE1.pdf","pages":"4–8"},{"exam":"su25-e1","file":"105A_E1_25Su Questions.pdf","pages":"2–4"},{"exam":"su25-e2","file":"105A_E2_25Su Questions(1).pdf","pages":"2–4"}],"cardIds":["u6-c0","u6-c1","u6-c2","u6-c3","u6-c4","u6-c5","u6-c6","u6-c7","u6-c8","u6-c9"]},{"id":"4.1","ch":4,"t":"Writing and Balancing Chemical Equations","k":[["Reactant","A species used up in a reaction"],["Product","A species formed in a reaction"],["Coefficient","A number in front of a formula giving the ratio of species in a reaction"],["Conservation of mass","Atoms are rearranged, not created or destroyed, so equations must balance"]],"f":[["State symbols","(s) solid, (l) liquid, (g) gas, (aq) aqueous"]],"key":"u7","title":"Balancing reactions","sources":[{"lecture":8,"pages":"8–13","file":"Lecture 8 Slides.pdf"}],"sections":["4.1"],"notes":["A balanced reaction conserves each element and total charge. Coefficients count relative numbers of entities or moles.","Change coefficients in front of formulas; never change a formula’s subscripts to balance an equation.","Balance elements present in the fewest species first. An unchanged polyatomic ion can sometimes be counted as one unit.","For combustion of a C/H/O compound, balance carbon, then hydrogen, then oxygen. Clear fractional coefficients at the end and reduce to the smallest integers."],"method":["Write correct reactant and product formulas.","Adjust coefficients and recount every element.","Reduce to the smallest whole-number set."],"trap":"A mole ratio is not a mass ratio. Species with different molar masses need different masses for equal moles.","extension":false,"label":"Lecture 8","example":"u7-q2","examRefs":[{"exam":"fa26-pe1","file":"Blank Fa26 PE1.pdf","pages":"4–8"},{"exam":"su25-e1","file":"105A_E1_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u7-c0","u7-c1","u7-c2","u7-c3","u7-c4"]},{"id":"4.2","ch":4,"t":"Classifying Chemical Reactions","k":[["Precipitation reaction","Reaction in solution that produces a poorly soluble solid"],["Spectator ions","Ions that appear unchanged on both sides of a reaction"],["Net ionic equation","Equation showing only the species that actually react"],["Oxidation","Loss of electrons"],["Reduction","Gain of electrons"],["Oxidizing agent","The species that is reduced"],["Reducing agent","The species that is oxidized"],["Equivalence point","Point at which reactants have combined in the balanced reaction’s stoichiometric ratio"]],"f":[["Oxidation state of a free element","0"],["Oxidation states in a compound","They sum to the overall charge"],["Common nonmetal oxidation states","Usually O = −2 and H = +1; bonded F = −1. Apply exceptions when specified."],["General titration equivalence","n(A)/a = n(B)/b for balanced coefficients a and b"]],"key":"u8","title":"Aqueous reactions & redox","sources":[{"lecture":9,"pages":"2–18","file":"Lecture 9 Slides.pdf"}],"sections":["4.2"],"notes":["Use solubility rules to predict a solid product. Group 1 and ammonium salts, and nitrates, are generally soluble. The reference panel includes the course’s qualitative solubility table.","For a net ionic equation, split strong aqueous electrolytes into ions. Keep solids, liquids, gases, and weak electrolytes intact. Cancel only species that are identical on both sides.","Neutralization follows the balanced reaction. Equivalence means stoichiometric amounts have reacted; acid and base moles are equal only for a 1:1 reaction.","Oxidation increases oxidation state; reduction decreases it. The reducing agent is oxidized, and the oxidizing agent is reduced. Oxidation states are bookkeeping, not necessarily real atomic charges."],"method":["Predict products and physical states.","Balance atoms and charge.","Cancel spectator ions or track oxidation-state changes."],"trap":"The familiar O = −2 and H = +1 assignments have exceptions. A question must give enough context to recognize the relevant rule.","extension":false,"label":"Lecture 9","example":"u8-q4","examRefs":[{"exam":"practice-e2","file":"Practice Exam 2 Question Booklet va(1).pdf","pages":"2–6"},{"exam":"su25-e2","file":"105A_E2_25Su Questions(1).pdf","pages":"2–4"}],"cardIds":["u8-c0","u8-c1","u8-c2","u8-c3","u8-c4","u8-c5","u8-c6","u8-c7","u8-c8","u8-c9","u8-c10","u8-c11"]},{"id":"4.3–4.4","ch":4,"t":"Reaction Stoichiometry and Limiting Reactants","k":[["Stoichiometry","The quantitative relationship between amounts of reactants and products"],["Limiting reactant","The reactant that is completely used up first"],["Excess reactant","A reactant left over after the limiting reactant is consumed"],["Mole ratio","Ratio of coefficients used as a conversion factor"]],"f":[["Stoichiometry pathway","grams A → mol A → mol B (coefficient ratio) → grams B"],["Compare limiting reactants","Smallest available n / stoichiometric coefficient limits the reaction"],["Excess remaining","Initial amount − amount consumed"]],"key":"u9","title":"Stoichiometry & limiting reactants","sources":[{"lecture":10,"pages":"2–10","file":"Lecture 10 Slides.pdf"}],"sections":["4.3","4.4"],"notes":["A balanced equation supplies mole ratios. Convert a given mass to moles before applying those ratios.","For each reactant, divide its available moles by its coefficient. The smallest value sets the maximum reaction amount.","Calculate theoretical product from the limiting reactant. To find excess remaining, subtract the amount consumed from its initial amount.","For solutions, first use n = MV. After reaction, compute any remaining concentration using the final mixed volume, if the problem says volumes add."],"method":["Find each reactant’s moles.","Compare moles divided by coefficient.","Use the limiting amount to find products and leftovers."],"trap":"The smallest starting mass is not necessarily the limiting reactant.","extension":false,"label":"Lecture 10","example":"u9-q2","examRefs":[{"exam":"practice-e2","file":"Practice Exam 2 Question Booklet va(1).pdf","pages":"2–6"},{"exam":"su25-e1","file":"105A_E1_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u9-c0","u9-c1","u9-c2","u9-c3","u9-c4","u9-c5","u9-c6"]},{"id":"4.4–4.5","ch":4,"t":"Reaction Yields and Quantitative Analysis","k":[["Theoretical yield","Maximum product possible if all of the limiting reactant reacts"],["Actual yield","The amount of product actually obtained"],["Percent yield","Actual yield as a percentage of theoretical yield"],["Titration","Adding one reactant to another in small measured amounts to follow the reaction"],["Analyte","The reactant of unknown concentration in a titration"],["Titrant","The reactant added slowly from the buret"],["Indicator","A substance that changes color near the equivalence point"]],"f":[["Percent yield","% yield = (actual ÷ theoretical) × 100%"],["Titration at equivalence (1:1)","M(acid) · V(acid) = M(base) · V(base)"]],"key":"u10","title":"Yield & titrations","sources":[{"lecture":11,"pages":"2–9","file":"Lecture 11 Slides.pdf"}],"sections":["4.4","4.5"],"notes":["Theoretical yield comes from the limiting reactant. Actual yield is measured. Percent yield compares actual to theoretical amounts in the same units.","For consecutive reaction steps, multiply fractional yields. An 80% step followed by a 75% step gives 60% overall yield.","At titration equivalence, n(A)/a = n(B)/b for the balanced coefficients a and b. An indicator endpoint is an observed signal close to that ideal point.","Titration can reveal concentration, mass percent, or molar mass. For a known acid mass, find acid moles from titrant moles and the neutralization ratio."],"method":["Balance the reaction.","Use the known titrant to find analyte moles.","Convert those moles to the quantity requested."],"trap":"Do not apply MₐVₐ = MᵦVᵦ without first checking the reaction coefficients.","extension":false,"label":"Lecture 11","example":"u10-q2","examRefs":[{"exam":"practice-e2","file":"Practice Exam 2 Question Booklet va(1).pdf","pages":"2–6"},{"exam":"su25-e1","file":"105A_E1_25Su Questions.pdf","pages":"2–4"},{"exam":"su25-e2","file":"105A_E2_25Su Questions(1).pdf","pages":"2–4"}],"cardIds":["u10-c0","u10-c1","u10-c2","u10-c3","u10-c4","u10-c5","u10-c6","u10-c7","u10-c8"]},{"id":"5.1","ch":5,"t":"Energy Basics","k":[["Thermochemistry","The study of heat absorbed or released in reactions and processes"],["Endothermic process","The system absorbs heat from its surroundings (q > 0)"],["Exothermic process","The system releases heat to its surroundings (q < 0)"],["Internal energy (U)","The total microscopic kinetic and potential energy of a system"],["Heat capacity","Heat needed to change a sample’s temperature by 1 °C"],["Specific heat capacity","Heat needed to change 1 g of a substance by 1 °C"]],"f":[["First law of thermodynamics","ΔU = q + w"],["Heat from specific heat","q = m · c · ΔT"],["Heat capacity","C = q ÷ ΔT"],["The joule","1 J = 1 kg·m²/s²"],["Pressure–volume work","w = −PextΔV (constant external pressure)"]],"key":"u11","title":"Energy, heat & work","sources":[{"lecture":12,"pages":"2–16","file":"Lecture 12 Slides.pdf"}],"sections":["5.1"],"notes":["Choose the system first. Heat entering it is positive; heat leaving it is negative. Work done on the system is positive; work done by it is negative.","The first law is ΔU = q + w. For expansion or compression against a constant external pressure, w = −PextΔV.","Heat is energy transferred because of a temperature difference. Temperature is not a measure of a sample’s total stored energy.","For a sample with approximately constant specific heat and no phase change, q = mcΔT. A sample’s heat capacity is C = mc."],"method":["Define the system and signs.","Put heat and work in matching units.","Add q and w or apply q = mcΔT."],"trap":"Expansion gives negative work; compression gives positive work. Convert L·atm to J before adding work to heat in joules.","extension":false,"label":"Lecture 12","example":"u11-q3","examRefs":[{"exam":"practice-e2","file":"Practice Exam 2 Question Booklet va(1).pdf","pages":"2–6"},{"exam":"su25-e2","file":"105A_E2_25Su Questions(1).pdf","pages":"2–4"}],"cardIds":["u11-c0","u11-c1","u11-c2","u11-c3","u11-c4","u11-c5","u11-c6","u11-c7","u11-c8","u11-c9","u11-c10"]},{"id":"5.2","ch":5,"t":"Calorimetry","k":[["Calorimetry","Measuring heat of a process from the temperature change of a calorimeter"],["Constant-pressure calorimetry","Coffee-cup calorimetry; the vessel is not sealed"],["Constant-volume calorimetry","Calorimetry in a rigid vessel; the volume stays fixed"],["Combustion reaction","Reaction with an oxidant, commonly oxygen, that releases energy"]],"f":[["Calorimeter energy balance","q(system) = −q(surroundings)"],["Hydrocarbon combustion","Complete combustion: CₓHᵧ + (x + y/4)O₂ → xCO₂ + (y/2)H₂O"],["Coffee-cup calorimetry","qrxn = −(msolution csolution + Ccup)ΔT; omit Ccup only if neglected"],["Bomb calorimetry","qrxn = −CcalΔT"]],"key":"u12","title":"Calorimetry","sources":[{"lecture":13,"pages":"2–11","file":"Lecture 13 Slides.pdf"}],"sections":["5.2"],"notes":["For an insulated setup, the heat changes of system and surroundings sum to zero. If the solution warms, the reaction releases heat.","For coffee-cup measurements, qsolution = msolution csolution ΔT. Include calorimeter heat capacity if it is given; otherwise follow the stated neglect assumption.","At constant pressure, measured heat corresponds to ΔH when only pressure–volume work occurs. At constant volume, heat corresponds to ΔU when no other work occurs.","For a hot solid placed in cooler water, use a common final temperature and separate temperature changes: qmetal + qwater = 0, neglecting the cup and environmental loss."],"method":["Calculate the surroundings’ heat gain or loss.","Reverse the sign to get the reaction heat.","Divide by moles if a molar quantity is requested."],"trap":"A sealed vessel is not automatically rigid. The bomb’s fixed volume, rather than the seal alone, is what makes it constant-volume calorimetry.","extension":false,"label":"Lecture 13","example":"u12-q3","examRefs":[{"exam":"practice-e2","file":"Practice Exam 2 Question Booklet va(1).pdf","pages":"2–6"},{"exam":"su25-e2","file":"105A_E2_25Su Questions(1).pdf","pages":"2–4"}],"cardIds":["u12-c0","u12-c1","u12-c2","u12-c3","u12-c4","u12-c5","u12-c6","u12-c7"]},{"id":"5.3","ch":5,"t":"Enthalpy","k":[["Enthalpy (H)","H = U + PV; ΔH equals constant-pressure heat when only pressure–volume work occurs"],["State function","A property that depends only on initial and final states, not the path"],["Standard enthalpy of formation","Enthalpy change for forming one mole of a substance from reference-state elements"],["Hess’s law","The ΔH of an overall reaction equals the sum of the ΔH of its steps"]],"f":[["Enthalpy change","ΔH = H(final) − H(initial)"],["Reversing a reaction","Flips the sign of ΔH"],["Scaling a reaction","Multiplies ΔH by the same factor"],["Hess’s law of summation","ΔH(overall) = Σ ΔH(steps)"],["Formation enthalpy calculation","ΔH°rxn = ΣνΔH°f(products) − ΣνΔH°f(reactants)"]],"key":"u13","title":"Enthalpy & Hess’s law","sources":[{"lecture":14,"pages":"2–14","file":"Lecture 14 Slides.pdf"}],"sections":["5.3"],"notes":["Enthalpy is H = U + PV. At constant pressure with only pressure–volume work, ΔH equals the heat transferred. H and U are state functions; heat and work depend on the path.","Reversing a reaction changes the sign of ΔH. Multiplying all coefficients multiplies ΔH by the same factor.","Hess’s law adds enthalpy changes for reactions that sum to the target reaction. Cancel intermediate species and check physical states.","Formation enthalpy describes making one mole from elements in their reference states. Use ΔH°rxn = ΣνΔH°f(products) − ΣνΔH°f(reactants). A reference-state element has ΔH°f = 0."],"method":["Match species, coefficients, and phases.","Reverse or scale the given reactions.","Add enthalpies after canceling intermediates."],"trap":"Liquid water and water vapor have different formation enthalpies. Standard state specifies reference conditions; temperature must still be stated (often 298.15 K).","extension":false,"label":"Lecture 14","example":"u13-q3","examRefs":[{"exam":"practice-e2","file":"Practice Exam 2 Question Booklet va(1).pdf","pages":"2–6"},{"exam":"su25-e2","file":"105A_E2_25Su Questions(1).pdf","pages":"2–4"}],"cardIds":["u13-c0","u13-c1","u13-c2","u13-c3","u13-c4","u13-c5","u13-c6","u13-c7","u13-c8"]},{"id":"6.1–6.2","ch":6,"t":"Electromagnetic Energy and the Bohr Model","k":[["Wavelength (λ)","Distance between successive crests of a wave"],["Frequency (ν)","Number of wave cycles per second"],["Photon","A particle of light with energy proportional to its frequency"],["Photoelectric effect","Light ejecting electrons from a metal if its frequency exceeds a threshold"],["Ground state","Lowest-energy state of an atom; for hydrogen, its electron has n = 1"],["Excited state","A state above an atom’s minimum energy; for hydrogen, the electron has n > 1"]],"f":[["Wave relation","c = λν (c = 2.998 × 10⁸ m/s)"],["Photon energy","E = hν = hc ÷ λ (h = 6.626 × 10⁻³⁴ J·s)"],["Photoelectric effect","KE(electron) = hν − hν₀"],["Bohr energy levels (hydrogen)","Eₙ = −R_H ÷ n² (R_H = 2.179 × 10⁻¹⁸ J)"],["Hydrogen photon energy","Ephoton = RH |1/nf² − 1/ni²|"],["Photoelectron speed","v = √(2KE / me)"]],"key":"u14","title":"Light & the hydrogen atom","sources":[{"lecture":15,"pages":"2–16","file":"Lecture 15 Slides.pdf"}],"sections":["6.1","6.2"],"notes":["For light in vacuum, c = λν and photon energy E = hν. Higher frequency means shorter wavelength and more energy per photon.","In the photoelectric effect, each electron receives energy from a photon. Above threshold, KEmax = hν − Φ. Greater intensity increases photon count; it does not increase energy per photon.","Hydrogen energy levels follow Eₙ = −RH/n². Absorption raises the atom’s energy; emission lowers it. The photon always carries a positive energy magnitude.","Find total photon number by dividing beam energy by energy per photon. Convert nm to m, mJ to J, and eV to J before using SI constants."],"method":["Convert data to compatible units.","Choose c = λν, E = hν, or the energy-level difference.","Keep atomic ΔE signed and photon energy positive."],"trap":"The n = 1 ground-state description here applies to hydrogen’s one electron; it is not a rule that all ground-state electrons in all atoms have n = 1.","extension":false,"label":"Lecture 15","example":"u14-q3","examRefs":[{"exam":"practice-e2","file":"Practice Exam 2 Question Booklet va(1).pdf","pages":"2–6"},{"exam":"su25-e3","file":"105A_E3_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u14-c0","u14-c1","u14-c2","u14-c3","u14-c4","u14-c5","u14-c6","u14-c7","u14-c8","u14-c9","u14-c10","u14-c11"]},{"id":"6.3","ch":6,"t":"Quantum Theory and Atomic Orbitals","k":[["Orbital","A quantum state whose probability density describes where an electron may be detected"],["Principal quantum number (n)","Describes the relative size and energy of an orbital"],["Angular momentum quantum number (l)","Describes the shape of an orbital"],["Magnetic quantum number (mₗ)","Describes the spatial orientation of an orbital"],["Spin quantum number (mₛ)","Distinguishes two electrons in the same orbital (+½ or −½)"],["de Broglie wavelength","The wavelength associated with a moving particle"],["Heisenberg uncertainty principle","An intrinsic limit: position and momentum spreads obey ΔxΔp ≥ h/(4π)"]],"f":[["de Broglie wavelength","λ = h ÷ (m·v)"],["Heisenberg uncertainty principle","Δx · mΔv ≥ h ÷ 4π"],["Allowed l values","l = 0, 1, …, n − 1"],["Allowed mₗ values","mₗ = −l, …, 0, …, +l"],["Subshell capacity","2ℓ + 1 orbitals; at most 2(2ℓ + 1) electrons"],["Shell capacity","n² orbitals; at most 2n² electrons"]],"key":"u15","title":"Quantum numbers & matter waves","sources":[{"lecture":16,"pages":"2–14","file":"Lecture 16 Slides.pdf"}],"sections":["6.3"],"notes":["An atomic orbital is a quantum state described by a wavefunction; its probability density tells us where the electron is likely to be detected. It is not a miniature planetary orbit.","Allowed values: n = 1,2,…; ℓ = 0,…,n − 1; mℓ = −ℓ,…,+ℓ; ms = +½ or −½. The labels s,p,d,f correspond to ℓ = 0,1,2,3.","A subshell has 2ℓ + 1 orbitals and holds up to 2(2ℓ + 1) electrons. A shell holds up to 2n² electrons.","A particle has de Broglie wavelength λ = h/p ≈ h/(mv) at nonrelativistic speed. The uncertainty relation ΔxΔp ≥ h/(4π) is intrinsic to quantum states, not just imperfect equipment."],"method":["Check whether every quantum number is allowed.","Count the possible orbitals and spin states.","For matter waves, use mass in kilograms."],"trap":"An impossible set of quantum numbers describes zero electrons, even if its individual numbers look familiar.","extension":false,"label":"Lecture 16","example":"u15-q3","examRefs":[{"exam":"practice-e2","file":"Practice Exam 2 Question Booklet va(1).pdf","pages":"2–6"},{"exam":"su25-e3","file":"105A_E3_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u15-c0","u15-c1","u15-c2","u15-c3","u15-c4","u15-c5","u15-c6","u15-c7","u15-c8","u15-c9","u15-c10","u15-c11","u15-c12"]},{"id":"6.4","ch":6,"t":"Electronic Structure of Atoms","k":[["Pauli exclusion principle","No two electrons in an atom share all four quantum numbers"],["Aufbau principle","Electrons fill the lowest-energy available orbitals first"],["Hund’s rule","Equal-energy orbitals fill singly with parallel spins before pairing"],["Valence electrons","For main-group atoms here: electrons in the outermost occupied principal shell"],["Electron configuration","The listing of subshells and how many electrons each holds"]],"f":[["Electrons per subshell","s: 2, p: 6, d: 10, f: 14"],["Forming a cation","Remove electrons from the highest-n orbitals first"],["Forming an anion","Add electrons to the next available lowest-energy orbital"]],"key":"u16","title":"Electron configurations","sources":[{"lecture":17,"pages":"3–12","file":"Lecture 17 Slides.pdf"}],"sections":["6.4"],"notes":["Fill available low-energy orbitals for the ground state. Each orbital holds at most two electrons with opposite spins (Pauli).","Within a set of equal-energy orbitals, place one electron in each with parallel spins before pairing (Hund).","Count all electrons to identify an atom or ion. For main-group atoms, outermost-shell electrons are the valence electrons used in these exercises.","To form a cation, remove electrons from the highest principal shell first. Transition-metal cations lose ns electrons before (n−1)d electrons. Excited configurations need not follow ground-state filling order."],"method":["Determine the electron total from Z and charge.","Fill subshells and apply Hund’s rule.","Recount electrons and identify outermost-shell occupancy."],"trap":"The neutral filling sequence is not simply reversed to make a transition-metal cation.","extension":false,"label":"Lecture 17","example":"u16-q4","examRefs":[{"exam":"practice-e2","file":"Practice Exam 2 Question Booklet va(1).pdf","pages":"2–6"},{"exam":"su25-e3","file":"105A_E3_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u16-c0","u16-c1","u16-c2","u16-c3","u16-c4","u16-c5","u16-c6","u16-c7"]},{"id":"6.5","ch":6,"t":"Periodic Variations in Element Properties","k":[["Ionization energy","Energy needed to remove an electron from a gaseous atom, forming a cation"],["Successive ionization energies","Energies for removing the 1st, 2nd, 3rd… electrons one at a time"],["Electron affinity","Energy change when a gaseous atom gains an electron to form an anion"],["Electronegativity","An atom’s tendency to pull shared electrons toward itself in a covalent bond"],["Isoelectronic species","Atoms or ions with the same number of electrons"]],"f":[["First ionization energy process","X(g) → X⁺(g) + e⁻"],["First electron affinity process","X(g) + e⁻ → X⁻(g)"]],"key":"u17","title":"Periodic trends","sources":[{"lecture":18,"pages":"2–15","file":"Lecture 18 Slides.pdf"}],"sections":["6.5"],"notes":["Across a period, increasing effective nuclear attraction generally pulls electrons closer. Atomic radius tends to decrease and first ionization energy tends to increase.","Down a group, extra shells and shielding usually increase radius and lower first ionization energy. These are patterns, not exception-free laws.","Cations are smaller than their parent atoms; anions are larger. In an isoelectronic series, more protons pull the same electron count into a smaller radius.","A large jump in successive ionization energies occurs when removal reaches a core electron. Electronegativity describes attraction for shared electrons, while electron affinity describes an energy change upon gaining an electron."],"method":["Check whether the comparison is within a period, group, or isoelectronic series.","Identify the change in shell count or nuclear charge.","Use the pattern with its physical reason."],"trap":"Do not rank arbitrary diagonal comparisons from arrows alone. Use data or a clearly justified comparison when trends compete.","extension":false,"label":"Lecture 18","example":"u17-q5","examRefs":[{"exam":"practice-e2","file":"Practice Exam 2 Question Booklet va(1).pdf","pages":"2–6"},{"exam":"su25-e3","file":"105A_E3_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u17-c0","u17-c1","u17-c2","u17-c3","u17-c4","u17-c5","u17-c6"]},{"id":"7.1","ch":7,"t":"Ionic Bonding","k":[["Ionic bond","Electrostatic attraction between a cation and an anion"],["Cation","Positive ion formed when an atom loses electrons"],["Anion","Negative ion formed when an atom gains electrons"]],"f":[],"key":"u18","title":"Ionic bonding","sources":[{"lecture":19,"pages":"2, 9–12","file":"Lecture 19 Slides.pdf"}],"sections":["7.1"],"notes":["Oppositely charged ions attract electrostatically. An ionic crystal is an extended arrangement of ions, not a collection of separate salt molecules.","A formula unit expresses the simplest neutral ratio of ions. Combine charges so the total is zero.","Main-group metals commonly lose valence electrons, and many nonmetals gain electrons. The resulting ions often have noble-gas electron counts.","The attraction in the crystal helps stabilize the ions. Electron transfer alone does not describe the entire energy balance of forming an ionic solid."],"method":["Predict or read the ion charges.","Choose the smallest ratio that balances charge.","Check the electron count of each ion."],"trap":"Ionic does not mean water-soluble. Solubility depends on the compound and conditions.","extension":false,"label":"Lecture 19","example":"u18-q4","examRefs":[],"cardIds":["u18-c0","u18-c1","u18-c2"]},{"id":"7.2","ch":7,"t":"Covalent Bonding","k":[["Covalent bond","Sharing of electrons between two atoms, typically nonmetals"],["Bond length","Distance between two bonded nuclei, found at the minimum of the potential energy curve"],["Pure covalent bond","Bond with electrons shared equally because the atoms have similar electronegativity"],["Polar covalent bond","Bond with unequal sharing because the atoms differ in electronegativity"],["Partial charges (δ⁺ and δ⁻)","Symbols marking the electron-poor and electron-rich ends of a polar bond"]],"f":[],"key":"u19","title":"Covalent bonds & bond polarity","sources":[{"lecture":19,"pages":"3–8","file":"Lecture 19 Slides.pdf"}],"sections":["7.2"],"notes":["A covalent bond involves shared electron density between atoms. Unequal attraction for that density makes a bond polar.","The more electronegative bonded atom is the partial-negative end. A bond dipole points toward it; partial charge is not the same as an ion’s integer charge.","At the equilibrium bond length, potential energy is minimized and net force is zero. Very short separations are strongly repulsive.","Bonding lies on a continuum. Electronegativity differences are a useful guide, but a single rigid cutoff does not fully classify every compound."],"method":["Compare the bonded atoms’ electronegativities.","Place δ− on the more electronegative atom.","Separate bond polarity from whole-molecule polarity."],"trap":"A molecule can have polar bonds whose dipoles cancel. The supplied lectures establish bond polarity; whole-molecule geometry is an optional extension.","extension":false,"label":"Lecture 19","example":"u19-q4","examRefs":[{"exam":"su25-e3","file":"105A_E3_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u19-c0","u19-c1","u19-c2","u19-c3","u19-c4"]},{"id":"7.3","ch":7,"t":"Lewis Symbols and Structures","k":[["Lewis symbol","Element symbol with dots for its valence electrons"],["Lone pair","Pair of valence electrons not shared in a bond"],["Octet rule","Main-group atoms tend to have 8 valence electrons (H and He: 2)"],["Free radical","An atom, molecule, or ion with at least one unpaired electron"],["Electron-deficient molecule","Central atom has fewer than 8 valence electrons, typically B or Al"],["Hypervalent molecule","A molecule represented with more than eight electrons around a period-3-or-heavier center"]],"f":[["Electrons in single, double, triple bonds","2, 4, and 6"],["Total valence electrons for an anion","Sum of atoms’ valence e⁻ + magnitude of the negative charge"],["Total valence electrons for a cation","Sum of atoms’ valence e⁻ − magnitude of the positive charge"]],"key":"u20","title":"Lewis structures & octet exceptions","sources":[{"lecture":19,"pages":"9–17","file":"Lecture 19 Slides.pdf"},{"lecture":20,"pages":"2–9","file":"Lecture 20 Slides.pdf"},{"lecture":22,"pages":"11","file":"Lecture 22 Slides.pdf"}],"sections":["7.3"],"notes":["Count all valence electrons, adding for a negative charge and subtracting for a positive charge. Use two electrons per bond and per lone pair.","Choose connectivity, make single bonds, complete terminal octets, then allocate remaining electrons. Make multiple bonds if the central atom still lacks an octet.","Hydrogen needs only two electrons. Check both the total electron budget and each atom’s local electron count. Bracket a polyatomic ion and show its overall charge.","Lecture 20 explicitly includes odd-electron species, electron-deficient B/Al centers, and expanded-octet Lewis representations for period 3 or heavier centers."],"method":["Count the electron budget.","Build the skeleton and place pairs.","Check octets, charge, and any stated exception."],"trap":"A bond’s pair counts toward the octet of both bonded atoms, but counts only once in the molecule’s total electron budget.","extension":false,"label":"Lectures 19–20, 22","example":"u20-q4","examRefs":[{"exam":"su25-e3","file":"105A_E3_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u20-c0","u20-c1","u20-c2","u20-c3","u20-c4","u20-c5","u20-c6","u20-c7","u20-c8"]},{"id":"7.4","ch":7,"t":"Formal Charges and Resonance","k":[["Formal charge","Hypothetical atom charge assuming bonding electrons are shared equally"],["Resonance","Several valid Lewis structures exist for the same arrangement of atoms"],["Resonance contributor","One of the individual Lewis structures of a resonant species"],["Resonance hybrid","One delocalized electronic structure represented by multiple valid contributors"],["Localized electrons","Electrons held by one atom or shared by just two"],["Delocalized electrons","Electrons shared across three or more atoms"],["Curved electron-pair arrow","A full-headed curved arrow showing where one electron pair is reassigned"],["Equivalent resonance contributors","Valid contributors with the same energy by symmetry"],["Conjugation","A connected set of suitably aligned orbitals through which electrons can delocalize"]],"f":[["Formal charge","FC = valence e⁻ − lone-pair e⁻ − ½(bonding e⁻)"],["Formal charge (alternate form)","FC = valence e⁻ − 2(lone pairs) − sum of bond orders"],["Sum of formal charges","Equals the overall charge of the molecule or ion"],["Average resonance bond order","Total bond-order contribution divided among equivalent bonds"]],"key":"u21","title":"Formal charge & resonance","sources":[{"lecture":21,"pages":"2–10","file":"Lecture 21 Slides.pdf"},{"lecture":22,"pages":"2–11","file":"Lecture 22 Slides.pdf"}],"sections":["7.4"],"notes":["Formal charge assigns half the bonding electrons to each atom: FC = valence electrons − nonbonding electrons − bond order sum.","Formal charges over the structure sum to the overall charge. Prefer reasonable octets and small charge separation; a negative formal charge usually favors a more electronegative atom.","Resonance contributors keep atom positions and connectivity fixed while changing electron placement. They are drawings of one delocalized structure, not separate molecules rapidly switching.","A lone pair adjacent to a π system may participate in delocalization when orbital alignment permits. Curved arrows start at electrons and indicate where that pair is placed.","A curved full-headed arrow begins at a lone pair or a bond and follows a pair of electrons to its destination. When a lone pair forms a new π bond, move the neighboring π pair if necessary to keep a second-period atom within an octet.","For equivalent contributors, shared bond order is intermediate. In carbonate, each C–O bond has an average order of 4/3; the molecule does not alternate between one long bond and one short bond.","An amide nitrogen lone pair can interact with the neighboring carbonyl π system when the orbitals align. An amine separated from a π bond by a saturated carbon has no continuous conjugated path."],"method":["Count nonbonding electrons and bond orders.","Compute every formal charge and check the total.","Compare valid contributors without moving atoms."],"trap":"Resonance moves electrons, not atoms. Preserve total charge and avoid placing more than eight electrons around a second-period atom.","extension":false,"label":"Lectures 21–22","example":"u21-q3","coverage":"lecture","examRefs":[{"exam":"su25-e3","file":"105A_E3_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u21-c0","u21-c1","u21-c2","u21-c3","u21-c4","u21-c5","u21-c9","u21-c10","u21-c11","u21-c6","u21-c7","u21-c8","u21-c12"]},{"id":"7.5","ch":7,"t":"Strengths of Ionic and Covalent Bonds","k":[["Bond energy","Energy needed to break a covalent bond in the gas phase"],["Energy of atomization","Energy needed to break all bonds in a molecule into individual gaseous atoms"],["Lattice energy","Here: positive energy required to separate an ionic solid into gaseous ions"],["Born–Haber cycle","Two routes to forming an ionic compound; Hess’s law finds an unknown step"]],"f":[["Reaction enthalpy from bond energies","ΔH°rxn = Σ D(bonds broken) − Σ D(bonds formed)"],["Lattice energy proportionality","Dissociation energy magnitude ∝ |q₊q₋| / r"],["Reaction enthalpy from formation enthalpies","ΔH°rxn = Σ n·ΔH°f(products) − Σ n·ΔH°f(reactants)"],["Born–Haber balance (positive U)","U = ΔHatom + ΣIE + ΔHdiss + ΣEA − ΔHf"]],"key":"u22","title":"Bond energies & lattice energy","sources":[{"lecture":23,"pages":"2–13","file":"Lecture 23 Slides.pdf"}],"sections":["7.5"],"notes":["Breaking bonds requires energy; forming bonds releases it. Estimate a gas-phase reaction enthalpy as bond energies broken minus bond energies formed.","Average bond energies are approximate. Count every affected bond and multiply by its count. Different molecular environments can shift the exact value.","For the same pair of elements, a higher bond order usually means a shorter, stronger bond.","This app uses the positive lattice-dissociation convention: energy to separate a solid into gaseous ions. Larger charge magnitudes and smaller ion separations generally increase this energy.","Build a Born–Haber cycle from solid metal and elemental nonmetal in their reference states. Atomize the metal, ionize it to the required charge, dissociate the required amount of nonmetal, add electrons to gaseous atoms, and then assemble the crystal.","For MX₂ with M²⁺ and X⁻, include the first and second ionization energies, one X₂ dissociation, and two first electron affinities. A second electron affinity would add an electron to X⁻; it is not needed to make two separate X⁻ ions.","With positive lattice dissociation energy U, ΔHf = atomization + ionization + dissociation + electron affinity − U. If the question gives lattice formation enthalpy instead, its sign is negative."],"method":["List and count broken bonds.","List and count formed bonds.","Subtract formed-bond energy from broken-bond energy."],"trap":"Lattice formation energy has the opposite sign to lattice dissociation energy. Check the convention before comparing values.","extension":false,"label":"Lecture 23","example":"u22-q3","coverage":"lecture","examRefs":[{"exam":"su25-e3","file":"105A_E3_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u22-c0","u22-c1","u22-c2","u22-c3","u22-c4","u22-c5","u22-c6","u22-c7"]},{"id":"7.6","ch":7,"t":"Molecular Structure and Polarity","k":[["VSEPR theory","Electron domains around a central atom repel and arrange to minimize repulsion"],["Electron domain","A bond (single, double, or triple) or lone pair around a central atom"],["Electron domain geometry","Arrangement of all domains, including lone pairs"],["Molecular geometry","Arrangement of the bonded atoms only"],["Dipole moment","Vector sum of all bond dipoles in a molecule"],["Polar molecule","A molecule with a nonzero net electric dipole moment"],["Axial position","One of the two sites along the main axis in a trigonal bipyramid"],["Equatorial position","One of the three sites in the central plane of a trigonal bipyramid"],["Solid wedge","A bond directed out of the page toward the viewer"],["Hashed bond","A bond directed behind the page away from the viewer"]],"f":[["Electron domains on a central atom","# of bonded atoms + # of lone pairs"],["Domain repulsion order","Lone pair–lone pair > lone pair–bond pair > bond pair–bond pair (qualitative)"],["Ideal electron-domain angles","2 domains: 180°; 3: 120°; 4: 109.5°; 5: 90°, 120°, 180°; 6: 90°, 180°"]],"key":"u23","title":"Molecular shape & polarity","sources":[{"lecture":24,"pages":"2–14","file":"Lecture 24 Slides.pdf"},{"lecture":25,"pages":"2–9","file":"Lecture 25 Slides.pdf"}],"sections":["7.6"],"notes":["VSEPR counts electron domains around a central atom: each bonded atom gives one domain, and each lone pair gives one. A multiple bond still occupies one domain.","Electron geometry includes lone pairs. Molecular shape describes only the atom positions. Four domains give tetrahedral electron geometry, but lone pairs can produce pyramidal or bent shapes.","Lone pairs usually compress adjacent bond angles. In a trigonal bipyramidal arrangement, they preferentially occupy equatorial sites.","Molecular polarity is the vector sum of bond dipoles. Symmetry cancels them only when both arrangement and bonded-atom identities permit it.","Five domains give trigonal bipyramidal electron geometry. Put lone pairs in equatorial positions first: AX₄E is seesaw, AX₃E₂ is T-shaped, and AX₂E₃ is linear.","Six domains give octahedral electron geometry. AX₅E is square pyramidal; for AX₄E₂, place the two lone pairs opposite one another to obtain a square-planar molecule.","A solid wedge projects toward the viewer; a hashed bond projects behind the page; an ordinary line lies in the page. These are perspective conventions, not different bond orders.","For molecules with several centers, determine the geometry around each center separately. Polar bonds cancel only when their vectors and magnitudes cancel; mixed terminal atoms can destroy an otherwise symmetric cancellation."],"method":["Count bonding domains and lone pairs.","Assign electron geometry, then molecular shape.","Check whether the bond dipoles cancel."],"trap":"A flat Lewis structure does not establish molecular polarity. Count domains, place lone pairs, and consider the identities and positions of the outer atoms.","extension":false,"label":"Lectures 24–25","example":"u23-q4","coverage":"lecture","examRefs":[{"exam":"su25-e4","file":"105A_E4_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u23-c0","u23-c1","u23-c2","u23-c3","u23-c4","u23-c5","u23-c8","u23-c9","u23-c10","u23-c11","u23-c6","u23-c7","u23-c12"]},{"id":"8.1–8.3","ch":8,"t":"Valence Bond Theory, Hybrid Orbitals, and Multiple Bonds","title":"Valence Bond Theory, Hybrid Orbitals, and Multiple Bonds","key":"u24","sections":["8.1","8.2","8.3"],"k":[["Sigma (σ) bond","Bonding overlap along the line joining two nuclei"],["Pi (π) bond","Bonding overlap of parallel orbitals on either side of the internuclear axis"],["Hybridization","A localized bonding model that combines orbitals on one atom into directional orbitals"],["Unhybridized p orbital","A remaining p orbital available for side-on overlap in a π bond"],["Orbital phase","The sign of an orbital wavefunction; matching phases can combine constructively. Colors do not indicate positive and negative electrical charge."],["Degenerate hybrid orbitals","Hybrid orbitals in the same idealized set have equal energy."],["Hybridized-atom orbital diagram","A bookkeeping diagram that places an atom’s valence electrons into its hybrid orbitals and any remaining unhybridized orbitals."]],"f":[["Domain-to-hybrid mapping","2 domains → sp; 3 → sp²; 4 → sp³"],["Multiple-bond accounting","Single: 1σ; double: 1σ + 1π; triple: 1σ + 2π"],["Orbital bookkeeping","sp: 2 hybrids + 2 p; sp²: 3 hybrids + 1 p; sp³: 4 hybrids"],["Five and six electron domains","Course-model labels: 5 domains → sp³d; 6 domains → sp³d²"],["Hybrid-orbital conservation","Number of atomic orbitals combined = number of hybrid orbitals formed"],["Carbonyl oxygen orbital occupancy","Localized sp² model: two paired sp² orbitals, one singly occupied sp² orbital, and one singly occupied p orbital"],["Sigma count from connectivity","Count one σ bond for each connected atom pair, including bonds to hydrogen"]],"notes":["Count σ-bond directions and lone pairs around the selected atom. In the standard localized model, two, three, and four domains correspond to sp, sp², and sp³, with ideal arrangements of 180°, 120°, and 109.5°.","A multiple bond has one σ bond. Its additional π bonds come from side-on overlap of unhybridized p orbitals; those p orbitals must be aligned.","For an overlap question, identify both atoms and decide whether the requested bond is σ or π. An sp² carbon–hydrogen σ bond combines a carbon sp² orbital with a hydrogen 1s orbital.","Keep free-atom and bonded-atom orbital diagrams distinct. Free carbon has 2s²2p². A standard sp² valence-bond description uses three sp² orbitals and one p orbital for its four valence electrons.","Resonance can alter a simple domain-count assignment: an amide nitrogen is approximately planar and its lone pair occupies a p orbital that participates in conjugation. Use the displayed connectivity.","Orbital colors or plus/minus signs represent wavefunction phase, not ionic charge. Constructive overlap increases electron density between the nuclei; a node separates opposite-phase regions.","One s plus two p orbitals produces three sp² hybrids, leaving one p orbital. One s plus one p produces two sp hybrids and leaves two perpendicular p orbitals. The number of orbitals is conserved.","For five and six domains, the course uses the idealized labels sp³d and sp³d². Keep these model assignments distinct from the detailed electronic description of a real hypervalent molecule.","For a bonded-atom diagram, account for the atom’s assigned electrons, including formal charge. Reserve a singly occupied hybrid orbital for each σ bond and a singly occupied p orbital for each localized π bond; place remaining lone pairs in the appropriate orbitals.","In a simple carbonyl group, oxygen has two paired sp² orbitals and two singly occupied orbitals: one sp² for the σ bond and one p for the π bond. Carbon has three singly occupied sp² orbitals and one singly occupied p orbital.","Distinguish ideal electron-domain angles from measured molecular angles: tetrahedral domains have an ideal 109.5° angle; the H–O–H bond angle in water is approximately 104.5°."],"method":["Draw the local Lewis structure and identify the atom.","Count directions and identify σ versus π overlap.","Label hybrid orbitals, remaining p orbitals, and electron occupancy."],"trap":"Hybrid labels are model descriptions. A double bond counts as one domain but contains two bonds of different symmetry.","extension":false,"coverage":"lecture","label":"Lectures 26 & 28","sources":[{"lecture":26,"file":"Lecture 26 Slides.pdf","pages":"2–16"},{"lecture":28,"file":"Lecture 28 Slides1.pdf","pages":"2–9"}],"examScope":"Q2–3, Q15","example":"u24-n0","examRefs":[{"exam":"su25-e4","file":"105A_E4_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u24-c0","u24-c1","u24-c2","u24-c3","u24-l26-c4","u24-l26-c5","u24-l26-c6","u24-c4","u24-c5","u24-c6","u24-l26-c10","u24-l26-c11","u24-l26-c12","u24-l26-c13"]},{"id":"8.4","ch":8,"t":"Molecular Orbital Theory","title":"Molecular Orbital Theory","key":"u25","sections":["8.4"],"k":[["Bonding molecular orbital","An orbital whose occupation stabilizes the bonded arrangement relative to separated atoms"],["Antibonding molecular orbital","An orbital whose occupation opposes bonding, labeled with an asterisk"],["Bond order","Half the difference between bonding and antibonding electron counts"],["Paramagnetic","Attracted to a magnetic field because at least one electron is unpaired"],["Diamagnetic","All electrons are paired; weakly repelled by a magnetic field"],["Internuclear node","A region of zero wavefunction amplitude between the nuclei in an antibonding overlap."],["Degenerate π orbitals","A pair of π orbitals at the same energy; singly occupy both with parallel spins before pairing electrons."],["MO versus hybrid orbital","An MO describes electrons across the molecule; a hybrid orbital is assigned to one atom in a localized bonding model."]],"f":[["MO bond order","Bond order = ½(Nbonding − Nantibonding)"],["Valence-electron count for ions","Add electrons for negative charge; subtract for positive charge"],["Two-orbital MO combination","Two compatible atomic orbitals combine to give two molecular orbitals: one bonding and one antibonding"],["Effect of one antibonding electron","Add one antibonding electron: bond order falls by 0.5; remove one: it rises by 0.5"]],"notes":["Count all valence electrons, adjusting for ionic charge. Occupy the molecular orbitals from low to high energy using Pauli exclusion and Hund’s rule.","For a degenerate pair of π orbitals, put one electron in each before pairing. Magnetism depends on the resulting unpaired electrons, not only on bond order.","Calculate bond order from all occupied bonding and antibonding orbitals in the stated diagram. A higher bond order generally corresponds to a shorter, stronger bond when comparing closely related species.","The order of σ2p and π2p levels is not universal. These practice questions state the required level order or give electron counts so that you do not have to guess a heteronuclear diagram.","An ion may lose an electron from a bonding or an antibonding orbital. Removing an antibonding electron raises bond order by one-half.","Combining two compatible atomic orbitals produces two MOs. The bonding combination places more density between the nuclei; the antibonding combination has a node between them.","The supplied CO practice diagram places π2p below σ2p. The supplied NF and CF practice diagrams place σ2p below π2p. Read the shown order instead of transferring one diagram to every species.","For helium species, fill σ1s before σ*1s. Four electrons give bond order zero in this elementary model; three give bond order one-half and one unpaired electron. Bond order zero means no net covalent stabilization in this model, rather than a universal claim that two atoms can never associate.","For a charged species, adjust the electron count first and refill the stated diagram. Decide magnetism from unpaired electrons after filling; do not infer it from the sign of the ion charge."],"method":["Count electrons with the charge included.","Fill the supplied MO order and check unpaired electrons.","Compute bond order from the occupied levels."],"trap":"Use the order supplied in the problem. An unpaired electron makes a species paramagnetic even if its bond order is an integer.","extension":false,"coverage":"lecture","label":"Lectures 27–28","sources":[{"lecture":27,"file":"Lecture 27 Slides.pdf","pages":"2–12"},{"lecture":28,"file":"Lecture 28 Slides1.pdf","pages":"10"}],"examScope":"Q4–5","example":"u25-n0","examRefs":[{"exam":"su25-e4","file":"105A_E4_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u25-c0","u25-c1","u25-c2","u25-c3","u25-c4","u25-l26-c5","u25-l26-c6","u25-l26-c7","u25-c5","u25-c6","u25-l26-c10","u25-l26-c11"]},{"id":"9.1–9.2","ch":9,"t":"Gas Pressure and the Ideal Gas Law","title":"Gas Pressure and the Ideal Gas Law","key":"u26","sections":["9.1","9.2"],"k":[["Ideal gas","A model of particles with negligible volume and negligible intermolecular attractions"],["Absolute temperature","Temperature measured from absolute zero in kelvin"],["Rigid container","A container whose volume stays fixed"]],"f":[["Ideal gas equation","PV = nRT"],["Fixed amount of gas","P₁V₁/T₁ = P₂V₂/T₂"],["Pressure conversion","1 atm = 101.325 kPa = 760 torr"],["Gas constant for L·atm","R = 0.082057 L·atm·mol⁻¹·K⁻¹"]],"notes":["Choose units before substitution. With R in L·atm/(mol·K), pressure must be in atm, volume in liters, amount in moles, and temperature in kelvin.","For a sealed rigid vessel, n and V are constant, so P/T is constant. Convert both temperatures to kelvin before comparing them.","For fixed n at constant temperature, pressure rises as volume decreases. At constant pressure, volume is proportional to absolute temperature.","PV = nRT applies to absolute pressure. If a problem gives a gauge reading, add the ambient pressure before using the ideal-gas equation."],"method":["List what stays constant.","Convert temperature to K and match R to the other units.","Solve symbolically, then substitute and report units."],"trap":"A ratio of Celsius temperatures is not a gas-law temperature ratio.","extension":false,"coverage":"exam","label":"Summer Exam 4","sources":[],"examScope":"Q7, Q12","example":"u26-n0","examRefs":[{"exam":"su25-e4","file":"105A_E4_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u26-c0","u26-c1","u26-c2","u26-c3","u26-c4","u26-c5","u26-c6"]},{"id":"9.3","ch":9,"t":"Gas Density and Molar Mass","title":"Gas Density and Molar Mass","key":"u27","sections":["9.3"],"k":[["Gas density","Mass of gas per unit volume under the stated conditions"],["Mean molar mass","Mass per mole averaged over the particles in a gas mixture"]],"f":[["Gas density","d = PM / (RT)"],["Molar mass from gas density","M = dRT / P"],["Constant-pressure density ratio","d₂/d₁ = T₁/T₂ for fixed composition"]],"notes":["Combine PV = nRT with n = m/M to obtain d = m/V = PM/(RT). This relates a measurable density to molar mass.","At fixed pressure and composition, warming a gas lowers its density because its particles occupy more volume per unit mass.","Use a consistent mass unit. For density in g/L and the L·atm gas constant, the molar mass comes out in g/mol.","The supplied Exam 4 tests density and molar-mass applications within §9.3. It does not establish complete lecture coverage of every mixture or gas-reaction subtopic in that section."],"method":["Identify P, T, density, and any known molar mass.","Rearrange d = PM/(RT).","For a second temperature, keep pressure and composition explicit."],"trap":"Density changes with temperature and pressure; molar mass does not change when the same gas is warmed.","extension":false,"coverage":"exam","label":"Summer Exam 4","sources":[],"examScope":"Q11","example":"u27-n0","examRefs":[{"exam":"su25-e4","file":"105A_E4_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u27-c0","u27-c1","u27-c2","u27-c3","u27-c4"]},{"id":"9.4–9.5","ch":9,"t":"Effusion and the Kinetic-Molecular Theory","title":"Effusion and the Kinetic-Molecular Theory","key":"u28","sections":["9.4","9.5"],"k":[["Effusion","Escape of gas particles through a small opening into a lower-pressure region"],["Diffusion","Spreading and mixing due to molecular motion"],["Root-mean-square speed","Square root of the mean of squared molecular speeds"],["Mean translational kinetic energy","Average translational kinetic energy set by absolute temperature"]],"f":[["Graham’s law","rateA / rateB = √(MB / MA)"],["RMS speed","urms = √(3RT / M), using M in kg/mol"],["Mean speed","umean = √(8RT / (πM)), using M in kg/mol"],["Molar kinetic energy","KEtrans,m = 3RT/2"]],"notes":["At the same temperature, gases have the same mean translational kinetic energy but different speed distributions. Lighter particles move faster on average.","The effusion-rate ratio varies with the inverse square root of molar mass. A gas that effuses twice as fast has one-quarter the molar mass.","For a fixed quantity passing through an opening, elapsed time is inversely proportional to effusion rate. Invert a time ratio before using it as a rate ratio.","Use R = 8.314 J/(mol·K) and M in kg/mol for speed calculations. The resulting speed unit is m/s.","Mean speed and root-mean-square speed are different quantities. These questions name the statistic explicitly; the Exam 4 speed item is treated as an RMS-speed skill rather than copying its ambiguous “average velocity” wording."],"method":["Decide whether the quantity is rate, elapsed time, mean speed, or RMS speed.","Use kelvin and convert molar mass to kg/mol for speeds.","Check that the lighter gas is faster at the same temperature."],"trap":"Do not insert g/mol into √(3RT/M) with R = 8.314 J/(mol·K).","extension":false,"coverage":"exam","label":"Summer Exam 4","sources":[],"examScope":"Q1, Q6, Q10","example":"u28-n0","examRefs":[{"exam":"su25-e4","file":"105A_E4_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u28-c0","u28-c1","u28-c2","u28-c3","u28-c4","u28-c5","u28-c6","u28-c7"]},{"id":"9.6","ch":9,"t":"Non-Ideal Gas Behavior","title":"Non-Ideal Gas Behavior","key":"u29","sections":["9.6"],"k":[["Intermolecular attraction correction","The van der Waals a term accounts for attractive interactions"],["Excluded-volume correction","The van der Waals b term accounts for finite particle size"],["Compressibility factor","Z = PV/(nRT); equals 1 for the ideal-gas model"]],"f":[["van der Waals equation","(P + a(n/V)²)(V − nb) = nRT"],["Pressure from van der Waals","P = nRT/(V − nb) − a(n/V)²"]],"notes":["The ideal-gas model becomes less reliable when particles are crowded or attractions become important. Low pressure and sufficiently high temperature generally favor ideal behavior.","In a van der Waals description, a measures the attraction correction and b measures the excluded-volume correction. Under matching conditions, smaller corrections usually mean closer agreement with the ideal model.","Attractions tend to lower the measured pressure relative to the attraction-free picture. Finite particle volume reduces the space available for motion and tends to raise pressure.","The supplied exam compares gases using a and b. Comparisons must use the same conditions; the best match to ideal behavior cannot be decided from temperature or pressure alone."],"method":["Hold temperature, volume, and amount constant for comparisons.","Compare both attraction and excluded-volume corrections.","If calculating, match units and keep V greater than nb."],"trap":"Neither a nor b is a universal ideality score independent of conditions.","extension":false,"coverage":"exam","label":"Summer Exam 4","sources":[],"examScope":"Q8","example":"u29-n0","examRefs":[{"exam":"su25-e4","file":"105A_E4_25Su Questions.pdf","pages":"2–4"}],"cardIds":["u29-c0","u29-c1","u29-c2","u29-c3","u29-c4"]}],"elements":[["H","Hydrogen","1.008"],["He","Helium","4.003"],["Li","Lithium","6.94"],["Be","Beryllium","9.012"],["B","Boron","10.81"],["C","Carbon","12.011"],["N","Nitrogen","14.007"],["O","Oxygen","15.999"],["F ,"209"],["At","Astatine","210"],["Rn","Radon","222"],["Fr","Francium","223"],["Ra","Radium","226"],["Ac","Actinium","227"],["Th","Thorium","232.038"],["Pa","Protactinium","231.036"],["U","Uranium","238.029"],["Np","Neptunium","237"],["Pu","Plutonium","244"],["Am","Americium","243"],["Cm","Curium","247"],["Bk","Berkelium","247"],["Cf","Californium","251"],["Es","Einsteinium","252"],["Fm","Fermium","257"],["Md","Mendelevium","258"],["No","Nobelium","259"],["Lr","Lawrencium","266"],["Rf","Rutherfordium","267"],["Db","Dubnium","268"],["Sg","Seaborgium","269"],["Bh","Bohrium","270"],["Hs","Hassium","277"],["Mt","Meitnerium","278"],["Ds","Darmstadtium","281"],["Rg","Roentgenium","282"],["Cn","Copernicium","285"],["Nh","Nihonium","286"],["Fl","Flerovium","289"],["Mc","Moscovium","290"],["Lv","Livermorium","293"],["Ts","Tennessine","294"],["Og","Oganesson","294"]],"questions":[{"id":"u0-q0","unit":"u0","type":"concept","prompt":"A clear sample of salt water has the same composition throughout. How is it classified?","answer":"Homogeneous mixture","options":["Homogeneous mixture","Element","Compound","Heterogeneous mixture"],"steps":["Water and salt remain distinct substances even when the mixture looks uniform."],"level":"core","hint":"Identify the requested unit.","source":"L2 p2–3"},{"id":"u0-q1","unit":"u0","type":"concept","prompt":"Which observation describes a chemical change?","answer":"A clean iron surface forms rust","options":["A clean iron surface forms rust","Ice melts","Ethanol evaporates","A copper wire bends"],"steps":["Rust formation creates different chemical substances; the other changes preserve identity."],"level":"core","hint":"Identify the requested unit.","source":"L2 p4","examIds":["fa26-pe1","su25-e1"]},{"id":"u0-q2","unit":"u0","type":"concept","prompt":"Which property stays the same when a uniform metal block is cut in half at constant temperature?","answer":"Density","options":["Density","Mass","Volume","Total heat capacity"],"steps":["Mass and volume both halve, so their ratio stays the same."],"level":"core","hint":"Identify the requested unit.","source":"L2 p5"},{"id":"u0-q3","unit":"u0","type":"concept","prompt":"Which statement distinguishes a compound from a mixture?","answer":"A compound has a fixed chemical composition","options":["A compound has a fixed chemical composition","A compound must be a solid","A mixture contains only elements","A mixture cannot be uniform"],"steps":["Compounds have fixed element ratios; a mixture’s component proportions can vary."],"level":"core","hint":"Identify the requested unit.","source":"L2 p2–3"},{"id":"u0-q4","unit":"u0","type":"number","prompt":"A metal piece has a mass of 26.80 g. It raises a water level from 18.40 mL to 21.75 mL. Find its density.","answer":8.0,"answerUnit":"g/mL","steps":["V = 21.75 − 18.40 = 3.35 mL.","d = 26.80 / 3.35 = 8.00 g/mL."],"level":"core","hint":"Identify the requested unit.","source":"L2 p9–10","sf":3,"tol":0.048,"examIds":["fa26-pe1","su25-e1"]},{"id":"u0-q5","unit":"u0","type":"number","prompt":"Convert 48.6 μm/ms to m/s.","answer":0.0486,"answerUnit":"m/s","steps":["48.6 × (10⁻⁶ m/μm) / (10⁻³ s/ms) = 0.0486 m/s."],"level":"core","hint":"Identify the requested unit.","source":"L2 p7","sf":3,"tol":0.0002916},{"id":"u0-q6","unit":"u0","type":"number","prompt":"A cube has side length 2.50 cm and density 2.70 g/cm³. What is its mass?","answer":42.2,"answerUnit":"g","steps":["V = (2.50 cm)³ = 15.625 cm³.","m = dV = 2.70 × 15.625 = 42.1875 g → 42.2 g."],"level":"core","hint":"Identify the requested unit.","source":"L2 p9","sf":3,"tol":0.25320000000000004},{"id":"u0-q7","unit":"u0","type":"number","prompt":"Convert 7.20 cm³ to m³.","answer":7.2e-06,"answerUnit":"m³","steps":["1 cm = 10⁻² m, so 1 cm³ = 10⁻⁶ m³.","7.20 cm³ = 7.20 × 10⁻⁶ m³."],"level":"core","hint":"Identify the requested unit.","source":"L2 p7","sf":3,"tol":4.3199999999999996e-08},{"id":"u1-q0","unit":"u1","type":"concept","prompt":"How many significant figures are in 0.004080?","answer":"4","options":["4","2","3","6"],"steps":["Leading zeros are placeholders. The internal zero and final decimal zero both count."],"level":"core","hint":"Choose the appropriate rounding rule.","source":"L3 p2–3"},{"id":"u1-q1","unit":"u1","type":"concept","prompt":"A balance repeatedly reads 5.21 g for a 5.00 g standard. These measurements are…","answer":"Precise but inaccurate","options":["Precise but inaccurate","Accurate but imprecise","Both accurate and precise","Neither precise nor inaccurate"],"steps":["The readings agree with each other but differ systematically from the reference."],"level":"core","hint":"Choose the appropriate rounding rule.","source":"L3 p7"},{"id":"u1-q2","unit":"u1","type":"concept","prompt":"Which factor is exact and therefore does not limit significant figures?","answer":"100 cm per meter","options":["100 cm per meter","A mass measured as 100. g","A length measured as 1.00 m","A density measured as 1.00 g/mL"],"steps":["The centimeter–meter relationship is a definition, not a measurement."],"level":"core","hint":"Choose the appropriate rounding rule.","source":"L3 p2–5"},{"id":"u1-q3","unit":"u1","type":"concept","prompt":"Which result correctly reports 3.40 × 2.0?","answer":"6.8","options":["6.8","6.80","6.800","7"],"steps":["The factor 2.0 has two significant figures, so the product is reported with two."],"level":"core","hint":"Choose the appropriate rounding rule.","source":"L3 p4–5"},{"id":"u1-q4","unit":"u1","type":"number","prompt":"Calculate 12.11 + 0.3 + 4.056. Report the answer to the correct decimal place.","answer":16.5,"answerUnit":"","steps":["The unrounded sum is 16.466.","The least precise term, 0.3, reaches only tenths. Report 16.5."],"level":"core","hint":"Choose the appropriate rounding rule.","source":"L3 p4–5","dec":1,"tol":1e-09,"examIds":["fa26-pe1"]},{"id":"u1-q5","unit":"u1","type":"number","prompt":"Convert 24.6 °C to kelvin, keeping the proper decimal precision.","answer":297.8,"answerUnit":"K","steps":["24.6 + 273.15 = 297.75 K.","The measured Celsius value is precise to tenths, so report 297.8 K."],"level":"core","hint":"Choose the appropriate rounding rule.","source":"L3 p8","dec":1,"tol":1e-09},{"id":"u1-q6","unit":"u1","type":"number","prompt":"A current supplies 1.80 C/s for 20.0 min. Each electron carries 1.602 × 10⁻¹⁹ C and produces 5.59 × 10⁻²³ g of metal. Find the deposited mass.","answer":0.754,"answerUnit":"g","steps":["Time = 20.0 × 60 = 1200 s; charge = 2160 C.","Electrons = 2160 / (1.602 × 10⁻¹⁹).","Mass = electron count × 5.59 × 10⁻²³ = 0.754 g."],"level":"challenge","hint":"Choose the appropriate rounding rule.","source":"L3 p10","sf":3,"tol":0.004524},{"id":"u2-q0","unit":"u2","type":"concept","prompt":"Two neutral atoms are isotopes of the same element. They must have the same…","answer":"Number of protons","options":["Number of protons","Mass number","Number of neutrons","Isotopic mass"],"steps":["Proton count identifies the element; isotopes differ in neutron count."],"level":"core","hint":"Find Z from the element.","source":"L4 p7–10","examIds":["su25-e1"]},{"id":"u2-q1","unit":"u2","type":"concept","prompt":"Rutherford’s large-angle scattering observations supported a…","answer":"Small, dense, positively charged nucleus","options":["Small, dense, positively charged nucleus","Uniformly spread positive charge","Nucleus containing electrons only","Solid atom with no empty space"],"steps":["Most particles passed through, but rare strong deflections indicated a compact concentration of positive charge."],"level":"core","hint":"Find Z from the element.","source":"L4 p7"},{"id":"u2-q2","unit":"u2","type":"concept","prompt":"Two samples of one pure compound contain the same mass ratio of their elements. This illustrates…","answer":"Definite proportions","options":["Definite proportions","Multiple proportions","Hund’s rule","A variable composition"],"steps":["Definite proportions describes the fixed composition of a particular compound."],"level":"core","hint":"Find Z from the element.","source":"L4 p3–6"},{"id":"u2-q3","unit":"u2","type":"concept","prompt":"Which pair lies in the same group?","answer":"Li and Na","options":["Li and Na","Na and Mg","C and N","O and Ne"],"steps":["Li and Na are group 1 elements in the same vertical column."],"level":"core","hint":"Find Z from the element.","source":"L4 p12–14","examIds":["fa26-pe1"]},{"id":"u2-q4","unit":"u2","type":"number","prompt":"How many neutrons are present in ⁵⁶Fe³⁺? Iron has Z = 26.","answer":30,"answerUnit":"neutrons","steps":["Neutrons = A − Z = 56 − 26 = 30. Charge affects electrons only."],"level":"core","hint":"Find Z from the element.","source":"L4 p9–11","tol":1e-10,"examIds":["fa26-pe1","su25-e1"]},{"id":"u2-q5","unit":"u2","type":"number","prompt":"How many electrons are present in ³²S²⁻? Sulfur has Z = 16.","answer":18,"answerUnit":"electrons","steps":["A neutral S atom has 16 electrons. The 2− ion has gained two: 18."],"level":"core","hint":"Find Z from the element.","source":"L4 p8–11","tol":1e-10},{"id":"u2-q6","unit":"u2","type":"number","prompt":"A compound contains 2.50 g of element B per 1.00 g of element A. How many grams of A are in 14.0 g of this compound?","answer":4.0,"answerUnit":"g","steps":["The combined mass ratio is 1.00 + 2.50 = 3.50.","Mass of A = 14.0 × 1.00/3.50 = 4.00 g."],"level":"core","hint":"Find Z from the element.","source":"L4 p6","sf":3,"tol":0.024},{"id":"u2-q7","unit":"u2","type":"concept","prompt":"In two compounds, a fixed 12 g of C combines with 16 g and 32 g of O. This illustrates…","answer":"Multiple proportions","options":["Multiple proportions","Only definite proportions","Changing atomic number","Isotopic abundance"],"steps":["The O masses for a fixed C mass form a small whole-number ratio, 1:2."],"level":"core","hint":"Find Z from the element.","source":"L4 p3–5"},{"id":"u3-q0","unit":"u3","type":"concept","prompt":"What is the empirical formula of C₆H₁₂O₆?","answer":"CH₂O","options":["CH₂O","C₂H₄O₂","C₃H₆O₃","C₆H₁₂O₆"],"steps":["Divide all subscripts by their greatest common divisor, 6."],"level":"core","hint":"Convert percentages to fractions.","source":"L5 p6–8"},{"id":"u3-q1","unit":"u3","type":"concept","prompt":"Two structures have the same formula but different atom connections. They are…","answer":"Constitutional isomers","options":["Constitutional isomers","Isotopes","Ions with identical structure","Different empirical formulas"],"steps":["Isomers share a molecular formula but differ in structure."],"level":"core","hint":"Convert percentages to fractions.","source":"L5 p9"},{"id":"u3-q2","unit":"u3","type":"concept","prompt":"A weighted average of two isotope masses must lie…","answer":"Between the two masses","options":["Between the two masses","Above both masses","Below both masses","At their unweighted midpoint"],"steps":["With positive fractions adding to one, the mean is bounded by the two isotope masses."],"level":"core","hint":"Convert percentages to fractions.","source":"L5 p2–5"},{"id":"u3-q3","unit":"u3","type":"number","prompt":"A fictional element has isotopes of masses 62.00 u (70.00%) and 64.00 u (30.00%). Calculate its average mass.","answer":62.6,"answerUnit":"u","steps":["Average = 0.7000(62.00) + 0.3000(64.00) = 62.60 u."],"level":"core","hint":"Convert percentages to fractions.","source":"L5 p2–5","dec":2,"tol":0.006,"examIds":["fa26-pe1","su25-e1"]},{"id":"u3-q4","unit":"u3","type":"number","prompt":"A fictional element has isotope masses 10.00 u and 11.00 u, with average mass 10.80 u. What percentage is the 10.00 u isotope?","answer":20.0,"answerUnit":"%","steps":["Let x be the lighter isotope fraction.","10.00x + 11.00(1 − x) = 10.80, so x = 0.20 = 20.0%."],"level":"core","hint":"Convert percentages to fractions.","source":"L5 p2–5","sf":3,"tol":0.12,"examIds":["fa26-pe1","su25-e1"]},{"id":"u3-q5","unit":"u3","type":"text","prompt":"Reduce C₄H₁₀O₂ to its empirical formula. Enter plain digits, for example CH2O.","answer":"C2
