 normally accompanies increasing bond order?","answer":"Shorter bond and larger bond dissociation energy","steps":["Adding bonding interaction generally draws the atoms closer and makes separation more costly."],"level":"core","hint":"List and count broken bonds.","source":"Lecture 23 p. 3","options":["Shorter bond and larger bond dissociation energy","Longer bond and larger bond dissociation energy","Shorter bond and smaller bond dissociation energy","No change in either quantity"],"examIds":["su25-e3"]},{"id":"u23-n0","unit":"u23","type":"concept","prompt":"A central atom has 4 bonding domains and 1 lone pair. What is its molecular shape?","answer":"Seesaw","steps":["Five total domains give a trigonal bipyramid. The lone pair occupies an equatorial position, leaving a seesaw shape."],"level":"core","hint":"Count bonding domains and lone pairs.","source":"Lecture 24 pp. 7, 10","options":["Seesaw","Tetrahedral","Square planar","Trigonal pyramidal"],"examIds":["su25-e4"]},{"id":"u23-n1","unit":"u23","type":"concept","prompt":"A central atom has 3 bonding domains and 2 lone pairs. Where are the lone pairs, and what is the molecular shape?","answer":"Both equatorial; T-shaped","steps":["Five domains give trigonal bipyramidal electron geometry. Two equatorial lone pairs leave two axial bonds and one equatorial bond."],"level":"core","hint":"Count bonding domains and lone pairs.","source":"Lecture 24 pp. 7, 10; Summer 2025 Exam 4 Q9","options":["Both equatorial; T-shaped","Both axial; trigonal planar","One axial and one equatorial; tetrahedral","Both equatorial; trigonal pyramidal"],"examIds":["su25-e4"]},{"id":"u23-n2","unit":"u23","type":"concept","prompt":"For an AX₄E₂ center with six total electron domains, what arrangement minimizes lone-pair repulsion?","answer":"Opposite lone pairs and a square-planar molecule","steps":["Opposite positions separate the two lone pairs by 180°. The four bonded atoms lie in a square plane."],"level":"core","hint":"Count bonding domains and lone pairs.","source":"Lecture 24 pp. 8, 11","options":["Opposite lone pairs and a square-planar molecule","Adjacent lone pairs and a tetrahedral molecule","Both lone pairs on one atom outside the center","No preferred arrangement"],"examIds":["su25-e4"]},{"id":"u23-n3","unit":"u23","type":"concept","prompt":"What is the molecular shape of IF₅ in the standard expanded-octet Lewis model?","answer":"Square pyramidal","steps":["I contributes 7 valence electrons and makes five single bonds, leaving one lone pair.","Six domains give octahedral electron geometry; five outer atoms form a square pyramid."],"level":"core","hint":"Count bonding domains and lone pairs.","source":"Lecture 24 pp. 8, 13","options":["Square pyramidal","Trigonal bipyramidal","Octahedral","Pentagonal planar"],"examIds":["su25-e4"]},{"id":"u23-n4","unit":"u23","type":"concept","prompt":"Why is CO₂ nonpolar while SO₂ is polar?","answer":"Linear CO₂ has canceling bond dipoles; bent SO₂ does not","steps":["Use both the bond polarities and the three-dimensional shape. Equal opposing vectors cancel in linear CO₂; bent SO₂ has a nonzero sum."],"level":"core","hint":"Count bonding domains and lone pairs.","source":"Lecture 25 pp. 4–9","options":["Linear CO₂ has canceling bond dipoles; bent SO₂ does not","C–O bonds are nonpolar","S–O bonds contain no electrons","Any molecule with two identical outer atoms is nonpolar"],"diagram":"dipoles","examIds":["su25-e4"]},{"id":"u23-n5","unit":"u23","type":"concept","prompt":"In a perspective molecular drawing, what does a solid wedge represent?","answer":"A bond pointing toward the viewer","steps":["The wedge encodes depth, not bond order. A hashed bond points behind the page."],"level":"core","hint":"Count bonding domains and lone pairs.","source":"Lecture 24 p. 4","options":["A bond pointing toward the viewer","A double bond","A bond pointing behind the page","An unusually strong single bond"],"examIds":["su25-e4"]},{"id":"u23-n6","unit":"u23","type":"concept","prompt":"For ideal PF₅ geometry, which angles occur between P–F bonds?","answer":"90°, 120°, and 180°","steps":["Equatorial–equatorial angles are 120°; axial–equatorial angles are 90°; the two axial bonds are 180° apart."],"level":"core","hint":"Count bonding domains and lone pairs.","source":"Lecture 24 pp. 7, 10","options":["90°, 120°, and 180°","109.5° only","120° only","90° only"],"examIds":["su25-e4"]},{"id":"u23-n7","unit":"u23","type":"concept","prompt":"In CH₃–C(=O)–CH₃, what are the approximate local geometries at a methyl carbon and the carbonyl carbon?","answer":"Tetrahedral; trigonal planar","steps":["A methyl carbon has four bonded directions. The carbonyl carbon has three domains because C=O counts as one."],"level":"core","hint":"Count bonding domains and lone pairs.","source":"Lecture 25 pp. 2–3","options":["Tetrahedral; trigonal planar","Trigonal planar; tetrahedral","Linear; bent","Both tetrahedral"],"examIds":["su25-e4"]},{"id":"u23-n8","unit":"u23","type":"concept","prompt":"Which molecule has zero net bond-dipole sum in its ideal geometry?","answer":"XeF₄","steps":["Square-planar XeF₄ has equal opposing Xe–F bond dipoles. The other listed shapes/substitutions do not cancel all their dipoles."],"level":"core","hint":"Count bonding domains and lone pairs.","source":"Lecture 24 p. 11; Lecture 25 pp. 4–9","options":["XeF₄","CH₃F","NH₃","SO₂"],"examIds":["su25-e4"]},{"id":"u23-n9","unit":"u23","type":"concept","prompt":"An ideal trigonal-bipyramidal PF₃Cl₂ has both Cl atoms axial. Is the net bond-dipole sum zero?","answer":"Yes: the axial pair cancels and the three equal equatorial vectors cancel","steps":["Opposite identical axial bonds cancel one another. Three identical equatorial bonds separated by 120° also sum to zero."],"level":"challenge","hint":"Count bonding domains and lone pairs.","source":"Lecture 25 p. 8","options":["Yes: the axial pair cancels and the three equal equatorial vectors cancel","No: any two different outer elements guarantee a net dipole","No: axial dipoles always add in the same direction","Yes: none of the bonds is polar"],"examIds":["su25-e4"]},{"id":"u24-n0","unit":"u24","type":"concept","prompt":"What hybridization describes the carbonyl carbon in H₂C=O in a localized valence-bond model?","answer":"sp²","steps":["There are three σ-bond directions around carbon. Three sp² orbitals form σ bonds; one unhybridized p orbital participates in the π bond."],"level":"core","hint":"Draw the local Lewis structure and identify the atom.","source":"Summer 2025 Exam 4 Q2, Q15","options":["sp²","sp","sp³","No p orbital is present"],"diagram":"formaldehyde","examIds":["su25-e4"]},{"id":"u24-n1","unit":"u24","type":"number","prompt":"How many π bonds are in H–C≡C–H?","answer":2,"steps":["A triple bond has one σ bond and two π bonds."],"level":"core","hint":"Draw the local Lewis structure and identify the atom.","source":"Summer 2025 Exam 4 Q2–3, Q15","answerUnit":"","tol":1e-09,"examIds":["su25-e4"]},{"id":"u24-n2","unit":"u24","type":"number","prompt":"How many σ bonds are present in H₂C=CH₂?","answer":5,"steps":["Four C–H σ bonds plus one C–C σ bond give five.","The extra part of the C=C double bond is a π bond."],"level":"core","hint":"Draw the local Lewis structure and identify the atom.","source":"Summer 2025 Exam 4 Q2–3","answerUnit":"","tol":1e-09,"examIds":["su25-e4"]},{"id":"u24-n3","unit":"u24","type":"concept","prompt":"Which orbitals form a C–H σ bond on the carbon of an sp² alkene center?","answer":"C sp² and H 1s","steps":["The carbon uses one directional sp² orbital for a σ bond; H supplies its 1s orbital."],"level":"core","hint":"Draw the local Lewis structure and identify the atom.","source":"Summer 2025 Exam 4 Q3","options":["C sp² and H 1s","C p and H p","C sp³ and H 2s","C 1s and H sp²"],"examIds":["su25-e4"]},{"id":"u24-n4","unit":"u24","type":"concept","prompt":"A C≡N bond contains which σ and π overlaps in the usual localized model?","answer":"One sp–sp σ overlap and two p–p π overlaps","steps":["Each center has two domains in a typical nitrile group. Two unhybridized p orbitals on each center supply the two π interactions."],"level":"core","hint":"Draw the local Lewis structure and identify the atom.","source":"Summer 2025 Exam 4 Q2–3","options":["One sp–sp σ overlap and two p–p π overlaps","Three sp–sp σ overlaps","One sp³–sp³ σ overlap and two s–s π overlaps","Two σ overlaps and one π overlap"],"examIds":["su25-e4"]},{"id":"u24-n5","unit":"u24","type":"concept","prompt":"Which orbital arrangement describes the valence orbitals of an sp²-bonded carbon?","answer":"Three sp² orbitals and one unhybridized p orbital","steps":["Combining one s and two p orbitals produces three sp² orbitals; one p orbital remains."],"level":"core","hint":"Draw the local Lewis structure and identify the atom.","source":"Summer 2025 Exam 4 Q15","options":["Three sp² orbitals and one unhybridized p orbital","Two sp² orbitals and two s orbitals","Four sp³ orbitals","One sp orbital and three p orbitals"],"examIds":["su25-e4"]},{"id":"u24-n6","unit":"u24","type":"concept","prompt":"What changes between the free-atom and the simple sp² valence-bond diagram of carbon?","answer":"The valence electrons are represented in hybrid orbitals plus one remaining p orbital","steps":["The free atom has 2s²2p². The bonding model redistributes the same four valence electrons into orbitals suitable for σ and π bonding."],"level":"core","hint":"Draw the local Lewis structure and identify the atom.","source":"Summer 2025 Exam 4 Q15","options":["The valence electrons are represented in hybrid orbitals plus one remaining p orbital","Carbon acquires four extra electrons","The 1s core becomes the π bond","The atomic number changes"],"examIds":["su25-e4"]},{"id":"u24-n7","unit":"u24","type":"concept","prompt":"Why is unrestricted rotation about an isolated C=C bond energetically unfavorable?","answer":"Rotation disrupts the side-on p-orbital overlap of the π bond","steps":["The π interaction requires aligned p orbitals. Twisting reduces their overlap."],"level":"core","hint":"Draw the local Lewis structure and identify the atom.","source":"Summer 2025 Exam 4 Q2–3","options":["Rotation disrupts the side-on p-orbital overlap of the π bond","Rotation removes the σ bond without affecting π bonding","The carbon nuclei are motionless in all molecules","All single bonds are stronger than all double bonds"],"examIds":["su25-e4"]},{"id":"u25-n0","unit":"u25","type":"number","prompt":"An MO diagram contains 8 bonding electrons and 4 antibonding electrons. Calculate its bond order.","answer":2,"steps":["Bond order = (8 − 4)/2 = 2."],"level":"core","hint":"Count electrons with the charge included.","source":"Summer 2025 Exam 4 Q4–5","answerUnit":"","tol":1e-09,"examIds":["su25-e4"]},{"id":"u25-n1","unit":"u25","type":"concept","prompt":"For a stated order σ2s < σ*2s < π2p < σ2p < π*2p < σ*2p, place 10 valence electrons. What is the magnetism?","answer":"Diamagnetic","steps":["Fill σ2s², σ*2s², π2p⁴, σ2p². All electrons are paired."],"level":"core","hint":"Count electrons with the charge included.","source":"Summer 2025 Exam 4 Q4–5","options":["Diamagnetic","Paramagnetic with one unpaired electron","Paramagnetic with two unpaired electrons","Magnetism cannot be assessed from electron pairing"],"examIds":["su25-e4"]},{"id":"u25-n2","unit":"u25","type":"concept","prompt":"Two electrons enter an empty pair of degenerate π* orbitals. What does Hund’s rule predict?","answer":"One electron in each orbital with parallel spins","steps":["Degenerate orbitals are singly occupied with parallel spins before pairing."],"level":"core","hint":"Count electrons with the charge included.","source":"Summer 2025 Exam 4 Q4–5","options":["One electron in each orbital with parallel spins","Two paired electrons in one orbital first","Both electrons in the next σ* orbital","One orbital is removed from the diagram"],"examIds":["su25-e4"]},{"id":"u25-n3","unit":"u25","type":"number","prompt":"A diatomic species has bond order 2.0. One electron is removed from its highest occupied antibonding orbital. What is the new bond order?","answer":2.5,"steps":["Removing one antibonding electron increases (Nb − Na)/2 by 0.5."],"level":"core","hint":"Count electrons with the charge included.","source":"Summer 2025 Exam 4 Q4–5","answerUnit":"","tol":1e-09,"examIds":["su25-e4"]},{"id":"u25-n4","unit":"u25","type":"number","prompt":"How many valence electrons must be placed for NO⁺? Use N = 5 and O = 6 valence electrons.","answer":10,"steps":["5 + 6 − 1 = 10. Positive charge removes an electron."],"level":"core","hint":"Count electrons with the charge included.","source":"Summer 2025 Exam 4 Q4","answerUnit":"","tol":1e-09,"examIds":["su25-e4"]},{"id":"u25-n5","unit":"u25","type":"concept","prompt":"An MO diagram shows two unpaired electrons. What conclusion follows?","answer":"The species is paramagnetic","steps":["At least one unpaired electron gives paramagnetic behavior."],"level":"core","hint":"Count electrons with the charge included.","source":"Summer 2025 Exam 4 Q5","options":["The species is paramagnetic","The species must have bond order zero","The species must be diamagnetic","The species contains only ionic bonds"],"examIds":["su25-e4"]},{"id":"u25-n6","unit":"u25","type":"concept","prompt":"Why must you inspect the supplied MO energy order before filling a heteronuclear diatomic ion?","answer":"The relative σ2p and π2p energies can depend on the species","steps":["Use the specified order, then apply Aufbau filling, Pauli exclusion, and Hund’s rule."],"level":"core","hint":"Count electrons with the charge included.","source":"Summer 2025 Exam 4 Q4–5","options":["The relative σ2p and π2p energies can depend on the species","Every molecule has exactly the same order","Ion charge never affects the number of electrons","Pauli exclusion applies only to atoms"],"examIds":["su25-e4"]},{"id":"u26-n0","unit":"u26","type":"number","prompt":"An ideal gas has n = 0.125 mol, T = 300. K, and V = 2.50 L. Find P using R = 0.082057 L·atm/(mol·K).","answer":1.230855,"steps":["P = nRT/V.","P = (0.125 mol)(0.082057 L·atm/(mol·K))(300. K)/(2.50 L) = 1.23 atm."],"level":"core","hint":"List what stays constant.","source":"Summer 2025 Exam 4 Q12","answerUnit":"atm","sf":3,"tol":0.00492342,"examIds":["su25-e4"]},{"id":"u26-n1","unit":"u26","type":"number","prompt":"A sealed rigid vessel is at 1.60 atm and 27.0 °C. At what Celsius temperature will its pressure be 2.00 atm?","answer":102.03749999999997,"steps":["T₁ = 300.15 K. At fixed n and V, T₂ = T₁P₂/P₁.","T₂ = 375.19 K = 102.04 °C, approximately 102 °C."],"level":"core","hint":"List what stays constant.","source":"Summer 2025 Exam 4 Q7","answerUnit":"°C","sf":3,"tol":0.40814999999999985,"examIds":["su25-e4"]},{"id":"u26-n2","unit":"u26","type":"number","prompt":"A gas occupies 450. mL at 1.20 atm. At constant temperature and amount, what volume does it occupy at 0.900 atm?","answer":600.0,"steps":["P₁V₁ = P₂V₂.","V₂ = (1.20 atm)(450. mL)/(0.900 atm) = 600. mL."],"level":"core","hint":"List what stays constant.","source":"Summer 2025 Exam 4 Q7, Q12","answerUnit":"mL","sf":3,"tol":2.4,"examIds":["su25-e4"]},{"id":"u26-n3","unit":"u26","type":"number","prompt":"Convert 152 kPa to atmospheres. Use 1 atm = 101.325 kPa.","answer":1.5001233654083395,"steps":["152 kPa × (1 atm / 101.325 kPa) = 1.50 atm."],"level":"core","hint":"List what stays constant.","source":"Summer 2025 Exam 4 Q7, Q12","answerUnit":"atm","sf":3,"tol":0.006000493461633358,"examIds":["su25-e4"]},{"id":"u26-n4","unit":"u26","type":"concept","prompt":"A sealed rigid ideal-gas container is heated from 200 K to 400 K. What happens to its pressure?","answer":"It doubles","steps":["P/T is constant when n and V are fixed."],"level":"core","hint":"List what stays constant.","source":"Summer 2025 Exam 4 Q7","options":["It doubles","It halves","It stays the same","It increases by a factor of four"],"examIds":["su25-e4"]},{"id":"u26-n5","unit":"u26","type":"concept","prompt":"Which temperature can be directly substituted in PV = nRT?","answer":"298.15 K","steps":["The equation uses absolute temperature. Convert Celsius by adding 273.15."],"level":"core","hint":"List what stays constant.","source":"Summer 2025 Exam 4 Q7, Q12","options":["298.15 K","25.0 °C","77.0 °F","Any temperature scale gives the same result"],"examIds":["su25-e4"]},{"id":"u26-n6","unit":"u26","type":"number","prompt":"How many moles of ideal gas occupy 3.00 L at 2.00 atm and 298 K? Use R = 0.082057 L·atm/(mol·K).","answer":0.24536880690153748,"steps":["n = PV/(RT) = (2.00 atm)(3.00 L)/[(0.082057 L·atm/(mol·K))(298 K)] = 0.245 mol."],"level":"core","hint":"List what stays constant.","source":"Summer 2025 Exam 4 Q12","answerUnit":"mol","sf":3,"tol":0.00098147522760615,"examIds":["su25-e4"]},{"id":"u27-n0","unit":"u27","type":"number","prompt":"A gas has density 1.18 g/L at 1.00 atm and 300. K. Find its molar mass using R = 0.082057 L·atm/(mol·K).","answer":29.048178,"steps":["M = dRT/P.","M = (1.18 g/L)(0.082057 L·atm/(mol·K))(300. K)/(1.00 atm) = 29.0 g/mol."],"level":"core","hint":"Identify P, T, density, and any known molar mass.","source":"Summer 2025 Exam 4 Q11","answerUnit":"g/mol","sf":3,"tol":0.116192712,"examIds":["su25-e4"]},{"id":"u27-n1","unit":"u27","type":"number","prompt":"The density of a gas is 1.20 g/L at 300. K. At the same pressure and composition, find its density at 360. K.","answer":1.0,"steps":["At constant P and M, d₂ = d₁T₁/T₂.","d₂ = (1.20 g/L)(300./360.) = 1.00 g/L."],"level":"core","hint":"Identify P, T, density, and any known molar mass.","source":"Summer 2025 Exam 4 Q11","answerUnit":"g/L","sf":3,"tol":0.004,"examIds":["su25-e4"]},{"id":"u27-n2","unit":"u27","type":"concept","prompt":"Why can heating the gas in a balloon reduce its density at nearly constant pressure?","answer":"Its volume per mole increases","steps":["The ideal-gas model gives d = PM/(RT). With P and composition fixed, increasing T reduces d."],"level":"core","hint":"Identify P, T, density, and any known molar mass.","source":"Summer 2025 Exam 4 Q11","options":["Its volume per mole increases","Its molecular masses decrease","Its atoms lose protons","Its pressure must become zero"],"examIds":["su25-e4"]},{"id":"u27-n3","unit":"u27","type":"number","prompt":"Find the ideal density of CO₂ at 1.10 atm and 310. K. Use M = 44.01 g/mol and R = 0.082057 L·atm/(mol·K).","answer":1.9031224164791822,"steps":["d = PM/(RT) = (1.10 atm)(44.01 g/mol)/[(0.082057)(310.)] = 1.90 g/L."],"level":"core","hint":"Identify P, T, density, and any known molar mass.","source":"Summer 2025 Exam 4 Q11","answerUnit":"g/L","sf":3,"tol":0.007612489665916729,"examIds":["su25-e4"]},{"id":"u27-n4","unit":"u27","type":"concept","prompt":"Two ideal gases have equal P and T. Gas A has twice the molar mass of gas B. How do their densities compare?","answer":"A has twice the density of B","steps":["At fixed P and T, d = PM/(RT), so density is directly proportional to molar mass."],"level":"core","hint":"Identify P, T, density, and any known molar mass.","source":"Summer 2025 Exam 4 Q11","options":["A has twice the density of B","A has half the density of B","Their densities are equal","A has four times the density of B"],"examIds":["su25-e4"]},{"id":"u28-n0","unit":"u28","type":"number","prompt":"An unknown gas effuses 1.50 times as fast as CO₂ under the same conditions. Use M(CO₂) = 44.01 g/mol. Find the unknown molar mass.","answer":19.56,"steps":["1.50 = √(44.01/Munknown).","Munknown = 44.01/(1.50)² = 19.6 g/mol."],"level":"core","hint":"Decide whether the quantity is rate, elapsed time, mean speed, or RMS speed.","source":"Summer 2025 Exam 4 Q1","answerUnit":"g/mol","sf":3,"tol":0.07823999999999999,"examIds":["su25-e4"]},{"id":"u28-n1","unit":"u28","type":"number","prompt":"Find the RMS speed of N₂ at 300. K. Use M = 0.0280 kg/mol and R = 8.314 J/(mol·K).","answer":516.9484638585498,"steps":["urms = √(3RT/M).","urms = √[3(8.314)(300.)/0.0280] = 517 m/s."],"level":"core","hint":"Decide whether the quantity is rate, elapsed time, mean speed, or RMS speed.","source":"Summer 2025 Exam 4 Q10","answerUnit":"m/s","sf":3,"tol":2.067793855434199,"examIds":["su25-e4"]},{"id":"u28-n2","unit":"u28","type":"number","prompt":"At what temperature does a gas of molar mass 0.0320 kg/mol have RMS speed 480. m/s? Use R = 8.314 J/(mol·K).","answer":295.597786865528,"steps":["T = M urms²/(3R).","T = (0.0320 kg/mol)(480. m/s)²/[3(8.314 J/(mol·K))] = 296 K."],"level":"core","hint":"Decide whether the quantity is rate, elapsed time, mean speed, or RMS speed.","source":"Summer 2025 Exam 4 Q10","answerUnit":"K","sf":3,"tol":1.182391147462112,"examIds":["su25-e4"]},{"id":"u28-n3","unit":"u28","type":"concept","prompt":"At the same temperature, which sample has the largest RMS molecular speed?","answer":"He","steps":["With T fixed, urms is inversely proportional to √M. Helium has the smallest molar mass."],"level":"core","hint":"Decide whether the quantity is rate, elapsed time, mean speed, or RMS speed.","source":"Summer 2025 Exam 4 Q6","options":["He","Ne","Ar","Kr"],"examIds":["su25-e4"]},{"id":"u28-n4","unit":"u28","type":"concept","prompt":"At the same temperature, what is equal for ideal He and ideal Xe?","answer":"Mean translational kinetic energy per particle","steps":["Mean translational kinetic energy is proportional to absolute temperature. The lighter He particles have larger speeds."],"level":"core","hint":"Decide whether the quantity is rate, elapsed time, mean speed, or RMS speed.","source":"Summer 2025 Exam 4 Q6","options":["Mean translational kinetic energy per particle","RMS speed","Mass per particle","Effusion rate"],"examIds":["su25-e4"]},{"id":"u28-n5","unit":"u28","type":"number","prompt":"A fixed quantity of gas A effuses in 30.0 s; the same quantity of gas B takes 60.0 s under identical conditions. If MB = 40.0 g/mol, find MA.","answer":10,"steps":["rateA/rateB = timeB/timeA = 2.00.","2.00 = √(40.0/MA), so MA = 10.0 g/mol."],"level":"core","hint":"Decide whether the quantity is rate, elapsed time, mean speed, or RMS speed.","source":"Summer 2025 Exam 4 Q1","answerUnit":"g/mol","sf":3,"tol":0.04,"examIds":["su25-e4"]},{"id":"u28-n6","unit":"u28","type":"concept","prompt":"What happens to the RMS speed of one gas when its kelvin temperature increases by a factor of four?","answer":"The RMS speed doubles","steps":["urms ∝ √T, so √4 = 2."],"level":"core","hint":"Decide whether the quantity is rate, elapsed time, mean speed, or RMS speed.","source":"Summer 2025 Exam 4 Q6, Q10","options":["The RMS speed doubles","It quadruples","It halves","It remains constant"],"examIds":["su25-e4"]},{"id":"u28-n7","unit":"u28","type":"concept","prompt":"Which formula gives mean speed, as distinct from RMS speed?","answer":"√(8RT/(πM))","steps":["Mean speed is √(8RT/(πM)); RMS speed is √(3RT/M). Both require M in kg/mol when R is 8.314."],"level":"challenge","hint":"Decide whether the quantity is rate, elapsed time, mean speed, or RMS speed.","source":"Summer 2025 Exam 4 Q10 (speed-statistic clarification)","options":["√(8RT/(πM))","√(3RT/M)","3RT/2","RT/M"],"examIds":["su25-e4"]},{"id":"u29-n0","unit":"u29","type":"concept","prompt":"Under the same dilute-gas conditions, which van der Waals pair suggests the smallest corrections to ideal behavior?","answer":"a = 0.20, b = 0.025","steps":["The first pair has both the smallest attraction correction a and the smallest excluded-volume parameter b."],"level":"core","hint":"Hold temperature, volume, and amount constant for comparisons.","source":"Summer 2025 Exam 4 Q8","options":["a = 0.20, b = 0.025","a = 1.50, b = 0.040","a = 6.80, b = 0.060","a = 9.50, b = 0.090"],"examIds":["su25-e4"]},{"id":"u29-n1","unit":"u29","type":"concept","prompt":"Which conditions generally favor the ideal-gas approximation?","answer":"Low pressure and high temperature","steps":["Low pressure separates particles; higher temperature reduces the relative importance of attractive potential energy."],"level":"core","hint":"Hold temperature, volume, and amount constant for comparisons.","source":"Summer 2025 Exam 4 Q8","options":["Low pressure and high temperature","High pressure and low temperature","High pressure and low volume only","Temperature has no effect"],"examIds":["su25-e4"]},{"id":"u29-n2","unit":"u29","type":"concept","prompt":"Which physical effect does the van der Waals parameter b represent?","answer":"Finite molecular size and excluded volume","steps":["The volume available for motion is modeled as V − nb."],"level":"core","hint":"Hold temperature, volume, and amount constant for comparisons.","source":"Summer 2025 Exam 4 Q8","options":["Finite molecular size and excluded volume","Intermolecular attractions","Ionization energy","Average bond order"],"examIds":["su25-e4"]},{"id":"u29-n3","unit":"u29","type":"concept","prompt":"Holding other effects fixed, how do intermolecular attractions influence a gas pressure compared with an attraction-free model?","answer":"They tend to lower it","steps":["Attraction reduces the net momentum transfer to the container walls relative to the attraction-free picture."],"level":"core","hint":"Hold temperature, volume, and amount constant for comparisons.","source":"Summer 2025 Exam 4 Q8","options":["They tend to lower it","They necessarily double it","They change the number of protons","They have no effect at any density"],"examIds":["su25-e4"]},{"id":"u29-n4","unit":"u29","type":"number","prompt":"A sample has PV = 24.0 L·atm and nRT = 25.0 L·atm. Calculate its compressibility factor Z.","answer":0.96,"steps":["Z = PV/(nRT) = 24.0/25.0 = 0.960."],"level":"core","hint":"Hold temperature, volume, and amount constant for comparisons.","source":"Summer 2025 Exam 4 Q8 (non-ideal behavior extension)","answerUnit":"","sf":3,"tol":0.00384,"examIds":["su25-e4"]},{"id":"u0-n0","unit":"u0","type":"number","prompt":"Mix 40.0 g of a liquid with density 0.800 g/mL and 100.0 g water with density 1.00 g/mL. Assuming additive volumes and masses, find the mixture density.","answer":0.9333333333333333,"steps":["Vliquid = (40.0 g)/(0.800 g/mL) = 50.0 mL; Vwater = 100.0 mL.","Total mass = 140.0 g; total volume = 150.0 mL.","Density = 140.0/150.0 = 0.933 g/mL."],"level":"core","hint":"Identify the requested unit.","source":"Fall 2026 Practice Exam 1, PDF p. 7, FR1","answerUnit":"g/mL","sf":3,"tol":0.0037333333333333333,"examIds":["fa26-pe1"]},{"id":"u0-n1","unit":"u0","type":"number","prompt":"Convert 59.0 °F to kelvin. Use T(°C) = (T(°F) − 32)(5/9).","answer":288.15,"steps":["T = (59.0 − 32)(5/9) = 15.0 °C.","T(K) = 15.0 + 273.15 = 288.15 K, reported as 288.2 K."],"level":"core","hint":"Identify the requested unit.","source":"Fall 2026 Practice Exam 1, PDF p. 5, Q13","answerUnit":"K","dec":1,"tol":0.050000000001,"examIds":["fa26-pe1"]},{"id":"u1-n0","unit":"u1","type":"concept","prompt":"Evaluate 9.84 / (15.25 − 12.1) with appropriate measurement precision. Which final report is correct?","answer":"3.1","steps":["The denominator is 3.15 before rounding, but its limiting decimal place is tenths, giving two significant figures.","Keep guard digits: 9.84/3.15 = 3.1238…; report the final answer with two significant figures, 3.1."],"level":"core","hint":"Choose the appropriate rounding rule.","source":"Fall 2026 Practice Exam 1, PDF p. 4, Q1","options":["3.1","3.12381","3.124","3"],"examIds":["fa26-pe1"]},{"id":"u1-n1","unit":"u1","type":"number","prompt":"Convert 18.6 in³ to cm³. The exact length conversion is 1 in = 2.54 cm.","answer":304.79939040000005,"steps":["Cube the whole conversion factor: 18.6 in³ × (2.54 cm/in)³.","The result is 304.799… cm³, or 305 cm³ at three significant figures."],"level":"core","hint":"Choose the appropriate rounding rule.","source":"Fall 2026 Practice Exam 1, PDF p. 4, Q2","answerUnit":"cm³","sf":3,"tol":1.2191975616000001,"examIds":["fa26-pe1"]},{"id":"u3-n0","unit":"u3","type":"number","prompt":"A fictional element has isotope masses 20.00, 21.00, and 22.00 u, with abundances 90.00%, 6.00%, and 4.00%. Calculate its mean atomic mass.","answer":20.14,"steps":["Convert abundances to 0.9000, 0.0600, and 0.0400.","Average = 20.00(0.9000) + 21.00(0.0600) + 22.00(0.0400) = 20.14 u."],"level":"core","hint":"Convert percentages to fractions.","source":"Fall 2026 Practice Exam 1, PDF p. 8, FR4","answerUnit":"u","dec":2,"tol":0.0050000000010000005,"examIds":["fa26-pe1","su25-e1"]},{"id":"u4-n0","unit":"u4","type":"text","prompt":"Write the neutral formula of iron(III) phosphate.","answer":"FePO4","steps":["Fe³⁺ and PO₄³⁻ combine in a 1:1 ratio."],"level":"core","hint":"Identify ionic, molecular, or acid naming.","source":"Fall 2026 Practice Exam 1, PDF p. 4, Q5; Summer 2025 Exam 1 Q1","examIds":["fa26-pe1","su25-e1"]},{"id":"u4-n1","unit":"u4","type":"text","prompt":"Write the molecular formula indicated by the name dinitrogen tetroxide.","answer":"N2O4","steps":["Di- gives 2 nitrogen atoms; tetra- gives 4 oxygen atoms. Do not reduce a named molecular formula."],"level":"core","hint":"Identify ionic, molecular, or acid naming.","source":"Fall 2026 Practice Exam 1, PDF p. 4, Q4","examIds":["fa26-pe1","su25-e1"]},{"id":"u5-n0","unit":"u5","type":"text","prompt":"A compound contains 61.02% C, 15.25% H, and 23.73% N by mass. Use C = 12.0, H = 1.00, N = 14.0 g/mol. Determine its empirical formula.","answer":"C3H9N","steps":["For 100 g: n(C) = 5.085 mol, n(H) = 15.25 mol, n(N) = 1.695 mol.","Divide by 1.695 to obtain approximately C:H:N = 3:9:1."],"level":"core","hint":"Masses → moles of each element.","source":"Fall 2026 Practice Exam 1, PDF p. 7, FR2; Summer 2025 Exam 1 Q16","examIds":["fa26-pe1","su25-e1"]},{"id":"u5-n1","unit":"u5","type":"number","prompt":"How many oxygen atoms are in 8.20 g of Ca(NO₃)₂? Use molar mass 164.0 g/mol and Nₐ = 6.022 × 10²³ mol⁻¹.","answer":1.8066e+23,"steps":["Amount of compound = 8.20/164.0 = 0.0500 mol.","Each formula unit contains 6 oxygen atoms.","O atoms = (0.0500 mol)(6)(6.022 × 10²³ mol⁻¹) = 1.81 × 10²³."],"level":"core","hint":"Masses → moles of each element.","source":"Fall 2026 Practice Exam 1, PDF p. 6, Q14; Summer 2025 Exam 1 Q12","answerUnit":"atoms","sf":3,"tol":7.2264e+20,"examIds":["fa26-pe1","su25-e1"]},{"id":"u5-n2","unit":"u5","type":"number","prompt":"How many Al₂(SO₄)₃ formula units contain 3.00 × 10²¹ aluminum ions?","answer":1.5e+21,"steps":["Each formula unit contains 2 Al ions.","Formula units = (3.00 × 10²¹)/2 = 1.50 × 10²¹."],"level":"core","hint":"Masses → moles of each element.","source":"Fall 2026 Practice Exam 1, PDF p. 6, Q15","answerUnit":"formula units","sf":3,"tol":6e+18,"examIds":["fa26-pe1"]},{"id":"u5-n3","unit":"u5","type":"concept","prompt":"Which alcohol has the smallest oxygen mass percentage? Each contains one O atom.","answer":"C₃H₈O","steps":["With one O atom in each formula, the oxygen numerator is the same. The largest total molar mass gives the smallest oxygen percentage."],"level":"core","hint":"Masses → moles of each element.","source":"Fall 2026 Practice Exam 1, PDF p. 5, Q9","options":["C₃H₈O","CH₄O","C₂H₆O","The percentages are equal"],"examIds":["fa26-pe1"]},{"id":"u6-n0","unit":"u6","type":"number","prompt":"A 200. mL sample of 0.800 M nonvolatile solute is heated until its solution volume is 80.0 mL. No solute is lost. Find the final concentration.","answer":2.0,"steps":["The solute amount is conserved: M₁V₁ = M₂V₂.","M₂ = (0.800 M)(200. mL)/(80.0 mL) = 2.00 M."],"level":"core","hint":"Convert volume to liters when using n = MV.","source":"Fall 2026 Practice Exam 1, PDF p. 5, Q8","answerUnit":"M","sf":3,"tol":0.008,"examIds":["fa26-pe1"]},{"id":"u6-n1","unit":"u6","type":"number","prompt":"What mass of MgCl₂ is needed to prepare 150.0 mL of 0.300 M solution? Use molar mass 95.21 g/mol.","answer":4.28445,"steps":["n = (0.300 mol/L)(0.1500 L) = 0.0450 mol.","Mass = (0.0450 mol)(95.21 g/mol) = 4.28 g."],"level":"core","hint":"Convert volume to liters when using n = MV.","source":"Fall 2026 Practice Exam 1, PDF p. 5, Q11","answerUnit":"g","sf":3,"tol":0.017137799999999998,"examIds":["fa26-pe1"]},{"id":"u7-n0","unit":"u7","type":"text","prompt":"Balance KClO₃ → KCl + O₂ with the smallest whole numbers. Enter the three coefficients in that order, separated by commas.","answer":"2,2,3","steps":["2 KClO₃ → 2 KCl + 3 O₂ conserves 2 K, 2 Cl, and 6 O atoms."],"level":"core","hint":"Write correct reactant and product formulas.","source":"Fall 2026 Practice Exam 1, PDF p. 8, FR3","examIds":["fa26-pe1","su25-e1"]},{"id":"u9-n0","unit":"u9","type":"concept","prompt":"A particle picture contains 3 N₂ molecules and 6 H₂ molecules. For N₂ + 3 H₂ → 2 NH₃, which reactant limits product formation?","answer":"H₂","steps":["Three N₂ molecules would require nine H₂ molecules. Six H₂ can react with only two N₂ molecules.","Four NH₃ molecules form, leaving one N₂ molecule."],"level":"core","hint":"Find each reactant’s moles.","source":"Summer 2025 Exam 1 Q10","options":["H₂","N₂","NH₃","Neither; the amounts are exactly stoichiometric"],"examIds":["su25-e1"]},{"id":"u9-n1","unit":"u9","type":"number","prompt":"A current supplies 1.50 C/s for 20.0 min to Ag⁺ + e⁻ → Ag. Use 96485 C/mol electrons and 107.9 g/mol Ag. What mass of Ag is deposited?","answer":2.012955381665544,"steps":["Total charge = (1.50 C/s)(20.0 min)(60 s/min) = 1800 C.","Moles e⁻ = 1800/96485 mol; the Ag:e⁻ mole ratio is 1:1.","Mass Ag = (1800/96485)(107.9) = 2.01 g."],"level":"challenge","hint":"Find each reactant’s moles.","source":"Summer 2025 Exam 1 Q13 (dimensional-analysis application)","answerUnit":"g","sf":3,"tol":0.008051821526662176,"examIds":["su25-e1"]},{"id":"u10-n0","unit":"u10","type":"number","prompt":"For 2 Al + 3 Cl₂ → 2 AlCl₃, react 2.70 g Al with 14.2 g Cl₂ at 85.0% yield. Use Al = 26.98, Cl₂ = 70.90, AlCl₃ = 133.33 g/mol. Find the isolated AlCl₃ mass.","answer":11.341451074870276,"steps":["Al = 0.1001 mol; Cl₂ = 0.2003 mol.","Compare n/coefficient: Al gives 0.0500 and Cl₂ gives 0.0668, so Al limits.","Theoretical AlCl₃ = (2.70/26.98)(133.33) = 13.34 g. Actual = 0.850(13.34) = 11.3 g."],"level":"challenge","hint":"Balance the reaction.","source":"Summer 2025 Exam 1 Q18; Practice Exam 2 FR4","answerUnit":"g","sf":3,"tol":0.04536580429948111,"examIds":["su25-e1","practice-e2"]},{"id":"u6-n2","unit":"u6","type":"number","prompt":"An ethanol solution is 10.0% (v/v). Use ethanol density 0.789 g/mL and molar mass 46.07 g/mol. Find its molarity.","answer":1.7126112437594965,"steps":["Choose 1.000 L of solution, containing 100. mL ethanol.","Ethanol mass = (100. mL)(0.789 g/mL) = 78.9 g.","Amount = 78.9/46.07 = 1.71 mol in 1.000 L, so M = 1.71 mol/L."],"level":"core","hint":"Convert volume to liters when using n = MV.","source":"Summer 2025 Exam 2 Q12 (using the correct ethanol formula C₂H₆O)","answerUnit":"M","sf":3,"tol":0.006850444975037986,"examIds":["su25-e2"]},{"id":"u10-n1","unit":"u10","type":"number","prompt":"For Na₂CO₃ + 2 HCl → 2 NaCl + H₂O + CO₂, what volume of 0.500 M HCl completely reacts with 20.0 mL of 0.100 M Na₂CO₃?","answer":8,"steps":["Carbonate amount = (0.0200 L)(0.100 mol/L) = 0.00200 mol.","HCl required = 0.00400 mol; volume = 0.00400/0.500 = 0.00800 L = 8.00 mL."],"level":"core","hint":"Balance the reaction.","source":"Summer 2025 Exam 2 Q11","answerUnit":"mL","sf":3,"tol":0.032,"examIds":["su25-e2"]},{"id":"u8-n0","unit":"u8","type":"number","prompt":"For CO₃²⁻ + 2 H⁺ → H₂O + CO₂, how many moles of CO₂ form when 0.00300 mol carbonate is completely neutralized?","answer":0.003,"steps":["The carbonate-to-CO₂ mole ratio is 1:1, so 0.00300 mol CO₂ forms."],"level":"core","hint":"Predict products and physical states.","source":"Summer 2025 Exam 2 Q11","answerUnit":"mol","sf":3,"tol":1.2e-05,"examIds":["su25-e2"]},{"id":"u12-n0","unit":"u12","type":"concept","prompt":"Two salts dissolve completely in equal masses of water. Compare equal 10.0 g portions of salt A (ΔHsol = +20.0 kJ/mol; M = 100. g/mol) and B (+15.0 kJ/mol; M = 50.0 g/mol). Which absorbs more heat?","answer":"B: 3.00 kJ","steps":["A absorbs (10.0/100.)(20.0) = 2.00 kJ.","B absorbs (10.0/50.0)(15.0) = 3.00 kJ. Compare heat per gram for equal masses."],"level":"challenge","hint":"Calculate the surroundings’ heat gain or loss.","source":"Summer 2025 Exam 2 Q13","options":["B: 3.00 kJ","A: 2.00 kJ","They absorb the same heat","Neither: positive ΔH releases heat"],"examIds":["su25-e2"]},{"id":"u13-n0","unit":"u13","type":"concept","prompt":"Which equation represents formation of exactly one mole of CaCO₃(s) from elements in their reference states?","answer":"Ca(s) + C(graphite) + 3/2 O₂(g) → CaCO₃(s)","steps":["A standard formation equation uses reference-state elements and forms exactly one mole of compound. Fractional coefficients are permitted."],"level":"core","hint":"Match species, coefficients, and phases.","source":"Summer 2025 Exam 2 Q8","options":["Ca(s) + C(graphite) + 3/2 O₂(g) → CaCO₃(s)","CaO(s) + CO₂(g) → CaCO₃(s)","Ca²⁺(aq) + CO₃²⁻(aq) → CaCO₃(s)","Ca(g) + C(g) + 3 O(g) → CaCO₃(s)"],"examIds":["su25-e2"]},{"id":"u13-n1","unit":"u13","type":"number","prompt":"For 2 H₂S(g) + 3 O₂(g) → 2 SO₂(g) + 2 H₂O(l), ΔHrxn = −1120 kJ. Use ΔHf[H₂S(g)] = −20.0 and ΔHf[H₂O(l)] = −286.0 kJ/mol. Find ΔHf[SO₂(g)].","answer":-294,"steps":["Let x = ΔHf[SO₂(g)]. Oxygen in its reference state contributes zero.","−1120 = 2x + 2(−286.0) − 2(−20.0) = 2x − 532.0.","2x = −588.0, so x = −294.0 kJ/mol."],"level":"challenge","hint":"Match species, coefficients, and phases.","source":"Summer 2025 Exam 2 Q14 (balanced original reaction)","answerUnit":"kJ/mol","dec":1,"tol":0.050000000001,"examIds":["su25-e2"]},{"id":"u12-n1","unit":"u12","type":"number","prompt":"A 50.0 g metal sample with c = 0.900 J/(g·°C) at 90.0 °C is placed in 150.0 g water with c = 4.18 J/(g·°C) at 20.0 °C. Neglect heat loss. Find the equilibrium temperature.","answer":24.6875,"steps":["Energy conservation: (50.0)(0.900)(Tf − 90.0) + (150.0)(4.18)(Tf − 20.0) = 0.","Tf = [45.0(90.0) + 627(20.0)]/(45.0 + 627) = 24.7 °C."],"level":"challenge","hint":"Calculate the surroundings’ heat gain or loss.","source":"Practice Exam 2, PDF p. 5, FR1; Summer 2025 Exam 2 Q15","answerUnit":"°C","dec":1,"tol":0.050000000001,"examIds":["practice-e2","su25-e2"]},{"id":"u14-n0","unit":"u14","type":"number","prompt":"A metal has threshold frequency 9.00 × 10¹⁴ s⁻¹. Light of wavelength 250. nm strikes it. Use h = 6.626 × 10⁻³⁴ J·s, c = 2.998 × 10⁸ m/s, and me = 9.11 × 10⁻³¹ kg. Find the maximum electron speed.","answer":659724.0550105816,"steps":["Ephoton = hc/λ = 7.9459 × 10⁻¹⁹ J.","Work function = hν₀ = 5.9634 × 10⁻¹⁹ J; KEmax = 1.9825 × 10⁻¹⁹ J.","vmax = √(2KEmax/me) = 6.60 × 10⁵ m/s."],"level":"challenge","hint":"Convert data to compatible units.","source":"Practice Exam 2, PDF p. 6, FR3; Summer 2025 Exam 3 Q2","answerUnit":"m/s","sf":3,"tol":2638.8962200423266,"examIds":["practice-e2","su25-e3"]},{"id":"u16-n0","unit":"u16","type":"number","prompt":"Given Pd has [Kr] 4d¹⁰ and the Kr core includes 4s²4p⁶, how many electrons in Pd have n = 4?","answer":18,"steps":["Count all n = 4 subshells: 4s² + 4p⁶ + 4d¹⁰ = 2 + 6 + 10 = 18.","The electron configuration is provided, so no exception memorization is required."],"level":"core","hint":"Determine the electron total from Z and charge.","source":"Practice Exam 2 Q14","answerUnit":"electrons","tol":1e-09,"examIds":["practice-e2"]},{"id":"u15-n0","unit":"u15","type":"number","prompt":"An electron has position uncertainty 1.00 × 10⁻¹⁰ m. Use me = 9.11 × 10⁻³¹ kg and h = 6.626 × 10⁻³⁴ J·s. Find the minimum speed uncertainty.","answer":578792.8940323263,"steps":["Δx·mΔv ≥ h/(4π), so Δvmin = h/(4πmΔx).","Δvmin = 5.79 × 10⁵ m/s."],"level":"core","hint":"Check whether every quantum number is allowed.","source":"Summer 2025 Exam 3 Q10","answerUnit":"m/s","sf":3,"tol":2315.1715761293053,"examIds":["su25-e3"]},{"id":"u20-n0","unit":"u20","type":"number","prompt":"How many total valence electrons are in CH₃C(=O)NH₂?","answer":24,"steps":["There are two C, five H, one N, and one O atoms.","Total = 2(4) + 5(1) + 5 + 6 = 24 electrons."],"level":"core","hint":"Count the electron budget.","source":"Summer 2025 Exam 3 Q11","answerUnit":"electrons","tol":1e-09,"diagram":"amide","examIds":["su25-e3"]},{"id":"u20-n1","unit":"u20","type":"number","prompt":"In the standard expanded-octet Lewis structure of IF₄⁺, how many lone pairs are on iodine?","answer":1,"steps":["Total valence electrons = 7 + 4(7) − 1 = 34.","Four I–F bonds use 8 electrons; terminal F lone pairs use 24.","The remaining 2 electrons form one lone pair on I."],"level":"core","hint":"Count the electron budget.","source":"Summer 2025 Exam 3 Q12","answerUnit":"lone pair","tol":1e-09,"examIds":["su25-e3"]},{"id":"u14-n1","unit":"u14","type":"number","prompt":"For hydrogen, find the wavelength absorbed for n = 3 → n = 5. Use RH = 2.179 × 10⁻¹⁸ J, h = 6.626 × 10⁻³⁴ J·s, and c = 2.998 × 10⁸ m/s.","answer":1282.001003900872,"steps":["ΔE = RH(1/3² − 1/5²) = 1.5495 × 10⁻¹⁹ J.","λ = hc/ΔE = 1.2820 × 10⁻⁶ m = 1.28 × 10³ nm, in the infrared."],"level":"core","hint":"Convert data to compatible units.","source":"Summer 2025 Exam 3 Q13","answerUnit":"nm","sf":3,"tol":5.128004015603488,"examIds":["su25-e3"]},{"id":"u24-l26-0","unit":"u24","type":"concept","prompt":"Two orbital lobes overlap along the internuclear axis. Which combination describes a bonding σ overlap?","answer":"Matching phase and effective end-on overlap","steps":["The shared region must overlap spatially and combine constructively.","End-on overlap along the internuclear axis has σ symmetry."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 26 · PDF pp. 2–4","options":["Matching phase and effective end-on overlap","Opposite phase with a node between the nuclei","Matching phase but no spatial overlap","Any two lobes, regardless of orientation or phase"]},{"id":"u24-l26-1","unit":"u24","type":"concept","prompt":"An orbital diagram colors one lobe blue and the other red. What does the color difference normally represent?","answer":"Opposite signs of the orbital wavefunction","steps":["The colors distinguish phase, not electrical charge.","Both regions describe possible locations of a negatively charged electron."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 26 · PDF pp. 3","options":["Opposite signs of the orbital wavefunction","A positively charged lobe and a negatively charged lobe","Two different elements","A proton-filled lobe and an electron-filled lobe"]},{"id":"u24-l26-2","unit":"u24","type":"number","prompt":"How many hybrid orbitals result when one s orbital and two p orbitals are combined?","answer":3,"steps":["Three input orbitals produce three output orbitals.","The result is an sp² set; one of the original three p orbitals remains unhybridized."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 26 · PDF pp. 6–8","answerUnit":"","tol":1e-09},{"id":"u24-l26-3","unit":"u24","type":"concept","prompt":"In the course’s idealized hybridization model, which label corresponds to six electron domains?","answer":"sp³d²","steps":["Six domains correspond to an octahedral arrangement.","The course model labels the six-orbital set sp³d²."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 26 · PDF pp. 10–12","options":["sp³d²","sp³","sp²","sp³d"]},{"id":"u24-l26-4","unit":"u24","type":"number","prompt":"How many unhybridized p orbitals remain on each sp-hybridized carbon in a C≡C bond?","answer":2,"steps":["One s and one p orbital are combined into two sp hybrids.","Two p orbitals remain; each participates in a different π overlap."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 26 · PDF pp. 7, 11–12","answerUnit":"","tol":1e-09},{"id":"u24-l26-5","unit":"u24","type":"number","prompt":"How many σ bonds are present in CH₃–C≡C–CH₃? Include the C–H bonds.","answer":9,"steps":["The six hydrogen atoms give six C–H σ bonds.","The four-carbon chain has three C–C connections, each with one σ bond.","Total σ bonds = 6 + 3 = 9. The triple bond also contains two π bonds."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 26 · PDF pp. 11, 13–14","answerUnit":"","tol":1e-09},{"id":"u24-l26-6","unit":"u24","type":"concept","prompt":"Which orbitals make the π bond of a simple C=C group?","answer":"One unhybridized p orbital on each carbon","steps":["Each sp² carbon retains one unhybridized p orbital.","Parallel p orbitals overlap side-on to form the π interaction."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 26 · PDF pp. 8, 11, 13","options":["One unhybridized p orbital on each carbon","Two sp³ orbitals on each carbon","The carbon 1s core orbitals","One hydrogen 1s orbital and one carbon sp² orbital"]},{"id":"u24-l26-7","unit":"u24","type":"number","prompt":"What is the ideal angle between the directions of two sp hybrid orbitals?","answer":180,"steps":["Two electron domains lie on opposite sides of the atom.","Their ideal linear arrangement has an angle of 180°."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 26 · PDF pp. 7, 12","answerUnit":"degrees","tol":1e-09},{"id":"u24-l26-8","unit":"u24","type":"number","prompt":"In the course model, a five-domain atom is assigned sp³d hybridization. How many hybrid orbitals are in that set?","answer":5,"steps":["One s, three p, and one d orbital are combined in this idealized model.","Five input orbitals give five hybrid orbitals."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 26 · PDF pp. 10–12","answerUnit":"","tol":1e-09},{"id":"u24-l26-9","unit":"u24","type":"concept","prompt":"Which statement correctly compares ideal tetrahedral geometry and water?","answer":"The tetrahedral ideal is 109.5°; water’s H–O–H angle is about 104.5°","steps":["Four electron domains lead to a tetrahedral reference arrangement.","The actual molecular angle need not equal the ideal domain angle; water is bent with an H–O–H angle near 104.5°."],"level":"core","hint":"Separate an ideal electron-domain arrangement from the measured molecular bond angle.","source":"Lecture 26 · PDF pp. 5, 9, 12","options":["The tetrahedral ideal is 109.5°; water’s H–O–H angle is about 104.5°","Both angles must be exactly 109.5°","Water has a linear 180° bond angle","Every molecule with two bonds has a 90° bond angle"]},{"id":"u25-l27-0","unit":"u25","type":"number","prompt":"Combining two compatible 1s atomic orbitals produces how many molecular orbitals?","answer":2,"steps":["The number of orbitals is conserved.","The combinations give one bonding σ1s MO and one antibonding σ*1s MO."],"level":"core","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 27 · PDF pp. 2–3, 7","answerUnit":"","tol":1e-09},{"id":"u25-l27-1","unit":"u25","type":"concept","prompt":"Which feature distinguishes σ*1s from σ1s in an elementary MO picture?","answer":"A node between the two nuclei","steps":["The antibonding combination is formed by destructive interference between the nuclei.","The bonding combination instead increases electron density in that internuclear region."],"level":"core","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 27 · PDF pp. 2–3","options":["A node between the two nuclei","A third nucleus in the center","An orbital that can hold four electrons","An orbital that must always be empty"]},{"id":"u25-l27-2","unit":"u25","type":"number","prompt":"Use σ1s < σ*1s. What bond order does the elementary MO model predict for He₂?","answer":0,"steps":["Two He atoms supply four electrons.","The occupancy is σ1s² σ*1s².","Bond order = (2 − 2)/2 = 0: there is no net covalent stabilization in this elementary model."],"level":"core","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 27 · PDF pp. 7, 9–10","answerUnit":"","tol":1e-09},{"id":"u25-l27-3","unit":"u25","type":"number","prompt":"Use σ1s < σ*1s. What bond order does the elementary MO model predict for He₂⁺?","answer":0.5,"steps":["The two He atoms supply four electrons; the +1 charge removes one.","Occupancy is σ1s² σ*1s¹.","Bond order = (2 − 1)/2 = 0.5; one electron is unpaired."],"level":"core","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 27 · PDF pp. 7, 9–10","answerUnit":"","tol":1e-09},{"id":"u25-l27-4","unit":"u25","type":"concept","prompt":"Under σ1s < σ*1s, what is the magnetic classification of He₂⁺?","answer":"Paramagnetic: one unpaired electron","steps":["Three electrons occupy σ1s² σ*1s¹.","The singly occupied antibonding orbital makes the species paramagnetic."],"level":"core","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 27 · PDF pp. 9–10","options":["Paramagnetic: one unpaired electron","Diamagnetic: all electrons are paired","Paramagnetic: three unpaired electrons","Magnetism follows from positive charge alone"]},{"id":"u25-l27-5","unit":"u25","type":"number","prompt":"For the stated order σ2s < σ*2s < π2p < σ2p < π*2p < σ*2p, find the bond order of CO⁺. Use C = 4 and O = 6 valence electrons.","answer":2.5,"steps":["Valence electrons = 4 + 6 − 1 = 9.","Occupancy: σ2s² σ*2s² π2p⁴ σ2p¹.","There are seven bonding electrons and two antibonding electrons, so bond order = (7 − 2)/2 = 2.5 in this stated diagram."],"level":"challenge","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 27 · PDF pp. 6, 8–9, 11","answerUnit":"","tol":1e-09},{"id":"u25-l27-6","unit":"u25","type":"concept","prompt":"For σ2s < σ*2s < π2p < σ2p < π*2p < σ*2p, CO⁻ has 11 valence electrons. What is its magnetic classification?","answer":"Paramagnetic: one electron occupies the π* pair","steps":["The first ten electrons fill σ2s² σ*2s² π2p⁴ σ2p².","The eleventh electron enters one π*2p orbital and remains unpaired."],"level":"challenge","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 27 · PDF pp. 6, 8–9, 11","options":["Paramagnetic: one electron occupies the π* pair","Diamagnetic: the extra electron pairs in σ2p","Paramagnetic: three electrons remain unpaired","Diamagnetic: all negatively charged ions have paired electrons"]},{"id":"u25-l27-7","unit":"u25","type":"number","prompt":"NF has 12 valence electrons. Use σ2s < σ*2s < σ2p < π2p < π*2p < σ*2p. How many unpaired electrons result?","answer":2,"steps":["Fill σ2s² σ*2s² σ2p² π2p⁴, using ten electrons.","The last two enter the degenerate π* orbitals separately with parallel spins.","There are two unpaired electrons."],"level":"challenge","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 27 · PDF pp. 6, 8–9, 12","answerUnit":"","tol":1e-09},{"id":"u25-l27-8","unit":"u25","type":"number","prompt":"NF⁻ has 13 valence electrons. Use σ2s < σ*2s < σ2p < π2p < π*2p < σ*2p. Calculate its bond order.","answer":1.5,"steps":["Occupancy: σ2s² σ*2s² σ2p² π2p⁴ π*2p³.","Bonding electrons = 2 + 2 + 4 = 8. Antibonding electrons = 2 + 3 = 5.","Bond order = (8 − 5)/2 = 1.5."],"level":"challenge","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 27 · PDF pp. 6, 8–9, 12","answerUnit":"","tol":1e-09},{"id":"u25-l27-9","unit":"u25","type":"concept","prompt":"Why does a simple Lewis structure fail to explain the paramagnetism of O₂?","answer":"It pairs all electrons, whereas the MO diagram has two unpaired electrons","steps":["A standard O=O Lewis structure shows bonding and nonbonding electrons as pairs.","In the ground-state MO description, the two highest π* electrons occupy separate degenerate orbitals."],"level":"core","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 27 · PDF pp. 2, 6, 8–9","options":["It pairs all electrons, whereas the MO diagram has two unpaired electrons","It gives oxygen the wrong atomic number","It predicts that every molecule is ionic","It assigns O₂ no valence electrons"]},{"id":"u24-l28-0","unit":"u24","type":"concept","prompt":"In a localized carbonyl-oxygen diagram, how are the six oxygen valence electrons placed in three sp² orbitals and one p orbital?","answer":"sp²: 2, 2, 1; p: 1","steps":["Two lone pairs occupy two sp² orbitals.","One electron in the third sp² orbital contributes to the σ bond.","One electron in the unhybridized p orbital contributes to the π bond. Total = 2 + 2 + 1 + 1 = 6."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 28 · PDF pp. 2","options":["sp²: 2, 2, 1; p: 1","sp²: 2, 2, 2; p: 0","sp²: 1, 1, 1; p: 1","sp²: 2, 1, 1; p: 2"]},{"id":"u24-l28-1","unit":"u24","type":"concept","prompt":"A neutral carbonyl carbon forms three σ bonds and one π bond. Which bonded-atom valence-orbital occupancy fits?","answer":"sp²: 1, 1, 1; p: 1","steps":["Carbon contributes four valence electrons.","Three singly occupied sp² orbitals provide σ overlap and one singly occupied p orbital provides π overlap."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 28 · PDF pp. 2","options":["sp²: 1, 1, 1; p: 1","sp²: 2, 1, 1; p: 0","sp³: 2, 2, 0, 0","sp: 2, 2; p: 0, 0"]},{"id":"u24-l28-2","unit":"u24","type":"concept","prompt":"An amide-free nitrogen has two single bonds, two lone pairs, and formal charge −1. In the simple localized model, what is its hybridization?","answer":"sp³","steps":["Two σ-bond directions plus two lone pairs make four electron domains.","The local assignment is sp³, with occupancies 2, 2, 1, 1.","The nitrogen is assigned six electrons in the localized bookkeeping: one more than a neutral nitrogen atom."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 28 · PDF pp. 5–6","options":["sp³","sp²","sp","No hybrid orbitals because the atom is charged"]},{"id":"u24-l28-3","unit":"u24","type":"concept","prompt":"An oxygen has three single bonds, one lone pair, and formal charge +1. Which local hybrid-orbital occupancy is consistent?","answer":"Four sp³ orbitals with occupancies 2, 1, 1, 1","steps":["There are four domains: three σ bonds and one lone pair.","The oxygen is assigned five electrons, consistent with 6 − 1 for formal charge +1.","A paired orbital holds the lone pair; three singly occupied orbitals supply the σ bonds."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 28 · PDF pp. 7–8","options":["Four sp³ orbitals with occupancies 2, 1, 1, 1","Four sp³ orbitals each containing two electrons","Two sp orbitals with occupancies 2, 2","Three sp² orbitals all doubly occupied"]},{"id":"u24-l28-4","unit":"u24","type":"number","prompt":"How many π bonds occur in CH₂=CH–C(=O)–CH₃?","answer":2,"steps":["The C=C double bond supplies one π bond.","The C=O double bond supplies one π bond.","There are two π bonds total."],"level":"core","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 28 · PDF pp. 3–4, 9","answerUnit":"","tol":1e-09},{"id":"u24-l28-5","unit":"u24","type":"number","prompt":"How many σ bonds occur in CH₂=CH–C(=O)–CH₃? Include all bonds to H.","answer":10,"steps":["There are six C–H bonds: two on CH₂, one on CH, and three on CH₃.","The four-carbon chain has three C–C σ bonds.","The C=O connection adds one C–O σ bond.","Total = 6 + 3 + 1 = 10 σ bonds."],"level":"challenge","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 28 · PDF pp. 3–4, 9","answerUnit":"","tol":1e-09},{"id":"u24-l28-6","unit":"u24","type":"concept","prompt":"In CH₃–C(=O)–CH=CH₂, which orbitals overlap for the σ bond between the carbonyl carbon and the adjacent alkene carbon?","answer":"An sp² orbital on each carbon","steps":["The carbonyl carbon has three σ-bond directions and is sp² in this model.","The adjacent alkene carbon also has three σ-bond directions and is sp².","The σ connection between them is an end-on sp²–sp² overlap."],"level":"challenge","hint":"Separate σ bonds, π bonds, and lone pairs.","source":"Lecture 28 · PDF pp. 2, 9","options":["An sp² orbital on each carbon","Two unhybridized p orbitals only","An sp³ orbital on each carbon","Two carbon 1s core orbitals"]},{"id":"u25-l28-7","unit":"u25","type":"number","prompt":"CF⁺ has 10 valence electrons. Use σ2s < σ*2s < σ2p < π2p < π*2p < σ*2p. What is its bond order?","answer":3,"steps":["Carbon contributes four valence electrons and fluorine seven; the +1 charge removes one.","Fill σ2s² σ*2s² σ2p² π2p⁴.","Eight electrons are bonding and two are antibonding: bond order = (8 − 2)/2 = 3."],"level":"challenge","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 28 · PDF pp. 10","answerUnit":"","tol":1e-09},{"id":"u25-l28-8","unit":"u25","type":"concept","prompt":"CF has 11 valence electrons. Use σ2s < σ*2s < σ2p < π2p < π*2p < σ*2p. Which result follows?","answer":"Bond order 2.5; paramagnetic","steps":["The first ten electrons fill σ2s² σ*2s² σ2p² π2p⁴.","The eleventh occupies one π*2p orbital.","Bond order = (8 − 3)/2 = 2.5. One unpaired electron makes the species paramagnetic."],"level":"challenge","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 28 · PDF pp. 10","options":["Bond order 2.5; paramagnetic","Bond order 3; diamagnetic","Bond order 2; diamagnetic","Bond order 0.5; paramagnetic"]},{"id":"u25-l28-9","unit":"u25","type":"concept","prompt":"CF⁻ has 12 valence electrons. Use σ2s < σ*2s < σ2p < π2p < π*2p < σ*2p. Which statement follows?","answer":"The two π* electrons are unpaired; bond order is 2","steps":["Twelve valence electrons fill σ2s² σ*2s² σ2p² π2p⁴ π*2p².","Hund’s rule puts the two π* electrons into separate orbitals with parallel spins.","Bond order = (8 − 4)/2 = 2; the species is paramagnetic."],"level":"challenge","hint":"Count the electrons, fill the stated energy order, then check bonding and unpaired electrons.","source":"Lecture 28 · PDF pp. 10","options":["The two π* electrons are unpaired; bond order is 2","Both π* electrons pair immediately; bond order is 3","The negative charge guarantees diamagnetism","The extra electron enters σ*2p before π*2p"]}],"sections":{"1.1":{"title":"Chemistry in Context","url":"https://openstax.org/books/chemistry-2e/pages/1-1-chemistry-in-context"},"1.2":{"title":"Phases and Classification of Matter","url":"https://openstax.org/books/chemistry-2e/pages/1-2-phases-and-classification-of-matter"},"1.3":{"title":"Physical and Chemical Properties","url":"https://openstax.org/books/chemistry-2e/pages/1-3-physical-and-chemical-properties"},"1.4":{"title":"Measurements","url":"https://openstax.org/books/chemistry-2e/pages/1-4-measurements"},"1.5":{"title":"Measurement Uncertainty, Accuracy, and Precision","url":"https://openstax.org/books/chemistry-2e/pages/1-5-measurement-uncertainty-accuracy-and-precision"},"1.6":{"title":"Mathematical Treatment of Measurement Results","url":"https://openstax.org/books/chemistry-2e/pages/1-6-mathematical-treatment-of-measurement-results"},"2.1":{"title":"Early Ideas in Atomic Theory","url":"https://openstax.org/books/chemistry-2e/pages/2-1-early-ideas-in-atomic-theory"},"2.2":{"title":"Evolution of Atomic Theory","url":"https://openstax.org/books/chemistry-2e/pages/2-2-evolution-of-atomic-theory"},"2.3":{"title":"Atomic Structure and Symbolism","url":"https://openstax.org/books/chemistry-2e/pages/2-3-atomic-structure-and-symbol  16.466 → 16.5"]},"u2-q4":{"given":["Ion: ⁵⁶Fe³⁺","Mass number A = 56; atomic number Z = 26"],"relationship":"Number of neutrons = A − Z","calculation":["56 − 26 = 30 neutrons","The 3+ charge changes the electron count, not the neutron count."]},"u3-q3":{"given":["Isotope 1: 62.00 u at 70.00% abundance","Isotope 2: 64.00 u at 30.00% abundance"],"relationship":"Average mass = Σ(fractional abundance × isotope mass)","calculation":["70.00% / 100 = 0.7000; 30.00% / 100 = 0.3000","Average = 0.7000(62.00 u) + 0.3000(64.00 u) = 62.60 u"]},"u4-q7":{"given":["One formula unit of Al₂(SO₄)₃","Each sulfate group contains 4 oxygen atoms"],"relationship":"Oxygen count = number of sulfate groups × oxygen atoms per group","calculation":["3 groups × (4 oxygen atoms / group) = 12 oxygen atoms"]},"u5-q2":{"given":["Water mass m = 9.00 g","Molar mass M = 18.015 g/mol"],"relationship":"n = m / M","calculation":["n = (9.00 g) / (18.015 g/mol) = 0.4996… mol","Round to 3 significant figures: 0.500 mol"]},"u6-q2":{"given":["NaCl mass = 5.85 g; molar mass = 58.5 g/mol","Final solution volume = 250. mL"],"relationship":"n = m / molar mass;  molarity = n / Vsolution","calculation":["n = (5.85 g) / (58.5 g/mol) = 0.100 mol","V = 250. mL × (1 L / 1000 mL) = 0.250 L","M = (0.100 mol) / (0.250 L) = 0.400 mol/L"]},"u7-q2":{"given":["C₂H₆ + O₂ → CO₂ + H₂O","Find the smallest whole-number coefficient of O₂"],"relationship":"Conserve the number of atoms of each element on both sides.","calculation":["Balance C and H first: C₂H₆ + 7/2 O₂ → 2 CO₂ + 3 H₂O","Multiply every coefficient by 2: 2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O","Check both sides: 4 C atoms, 12 H atoms, and 14 O atoms"]},"u8-q4":{"given":["Ion: MnO₄⁻; total charge = −1","Each oxygen has oxidation state −2"],"relationship":"The sum of oxidation states equals the species’ overall charge.","calculation":["x + 4(−2) = −1","x − 8 = −1;  x = +7"],"answer":"+7"},"u9-q2":{"given":["2 Al + 3 Cl₂ → 2 AlCl₃","Amount of Cl₂ = 0.450 mol; Al is in excess"],"relationship":"n(AlCl₃) = n(Cl₂) × (2 mol AlCl₃ / 3 mol Cl₂)","calculation":["n(AlCl₃) = 0.450 mol Cl₂ × (2 mol AlCl₃ / 3 mol Cl₂)","The Cl₂ units cancel, leaving 0.300 mol AlCl₃"]},"u10-q2":{"given":["Actual product mass = 6.80 g","Theoretical product mass = 8.50 g"],"relationship":"Percent yield = (actual yield / theoretical yield) × 100%","calculation":["Percent yield = (6.80 g / 8.50 g) × 100%","The mass units cancel: 0.800 × 100% = 80.0%"]},"u11-q3":{"given":["Heat absorbed by the system: q = +125 J","Work done by the system: w = −48 J"],"relationship":"ΔU = q + w","calculation":["ΔU = (+125 J) + (−48 J) = +77 J"],"answer":"+77 J"},"u12-q3":{"given":["Solution mass = 100.0 g","Specific heat = 4.18 J/(g·°C)","Temperature: 22.00 °C → 26.50 °C","Cup heat capacity and heat loss are neglected"],"relationship":"qsolution = mcΔT;  qreaction = −qsolution","calculation":["ΔT = 26.50 °C − 22.00 °C = 4.50 °C","qsolution = (100.0 g)(4.18 J/(g·°C))(4.50 °C) = +1881 J","qreaction = −1881 J × (1 kJ / 1000 J) = −1.881 kJ","Round to 3 significant figures: −1.88 kJ"]},"u13-q3":{"given":["N₂(g) + 3 H₂(g) → 2 NH₃(g); ΔH = −92.4 kJ","Target: 4 NH₃(g) → 2 N₂(g) + 6 H₂(g)"],"relationship":"Reversing a reaction reverses the sign of ΔH; scaling coefficients scales ΔH.","calculation":["Reverse the original reaction: ΔH = +92.4 kJ","Double the reversed reaction: ΔH = 2(+92.4 kJ) = +184.8 kJ"],"answer":"+184.8 kJ"},"u14-q3":{"given":["Wavelength λ = 500. nm","Speed of light c = 2.998 × 10⁸ m/s"],"relationship":"c = λν;  ν = c / λ","calculation":["λ = 500. nm × (10⁻⁹ m / 1 nm) = 5.00 × 10⁻⁷ m","ν = (2.998 × 10⁸ m/s) / (5.00 × 10⁻⁷ m) = 5.996 × 10¹⁴ s⁻¹","1 s⁻¹ = 1 Hz; round to 3 significant figures: 6.00 × 10¹⁴ Hz"]},"u15-q3":{"given":["Principal quantum number n = 3","Each orbital holds at most 2 electrons"],"relationship":"Maximum electrons in a shell = 2n²","calculation":["The shell contains n² = 3² = 9 orbitals","9 orbitals × (2 electrons / orbital) = 18 electrons"]},"u16-q4":{"given":["Ground-state phosphorus: Z = 15","Electron configuration: [Ne] 3s² 3p³"],"relationship":"Hund’s rule: occupy equal-energy orbitals singly with parallel spins before pairing.","calculation":["The filled core and 3s orbital have paired electrons.","The three 3p electrons occupy three separate orbitals, leaving 3 unpaired electrons."]},"u17-q5":{"given":["Successive ionization energies: 590, 1145, 4910, 6490 kJ/mol","The atom is a main-group element"],"relationship":"A large increase after removing the valence electrons signals the start of core-electron removal.","calculation":["The largest increase is from 1145 to 4910 kJ/mol, between the second and third removals.","Two electrons are removed before the core is reached: 2 valence electrons."]},"u18-q4":{"given":["Magnesium: Z = 12","Ion charge: +2"],"relationship":"Electron count = proton count − signed ionic charge","calculation":["A +2 ion has lost 2 electrons.","12 − 2 = 10 electrons"]},"u19-q4":{"given":["Electronegativity of C = 2.5","Electronegativity of O = 3.5"],"relationship":"ΔEN = |EN(O) − EN(C)|","calculation":["ΔEN = |3.5 − 2.5| = 1.0","Electronegativity is dimensionless; O is the partial-negative end of the bond."]},"u20-q4":{"given":["Carbonate ion: CO₃²⁻","Valence electrons per atom: C = 4; O = 6"],"relationship":"Total valence electrons = sum from neutral atoms + electrons added for negative charge","calculation":["One C contributes 4 electrons; three O atoms contribute 3 × 6 = 18 electrons.","Add 2 electrons for the 2− charge: 4 + 18 + 2 = 24 electrons"]},"u21-q3":{"given":["N has 5 valence electrons","4 single bonds; no lone pairs"],"relationship":"Formal charge = valence electrons − nonbonding electrons − ½(bonding electrons)","calculation":["Four single bonds contain 8 bonding electrons.","FC = 5 − 0 − ½(8) = +1"],"answer":"+1"},"u22-q3":{"given":["H₂ + Cl₂ → 2 HCl","Bond energies: H–H = 436, Cl–Cl = 243, H–Cl = 431 kJ/mol"],"relationship":"ΔH ≈ Σ(bond energies of bonds broken) − Σ(bond energies of bonds formed)","calculation":["Break 1 mol H–H and 1 mol Cl–Cl bonds: (1 mol)(436 kJ/mol) + (1 mol)(243 kJ/mol) = 679 kJ","Form 2 mol H–Cl bonds: (2 mol)(431 kJ/mol) = 862 kJ","ΔH ≈ 679 kJ − 862 kJ = −183 kJ for the reaction as written"]},"u23-q4":{"given":["CO₂ Lewis structure: O=C=O","The central carbon has no lone pairs"],"relationship":"Each bonded atom counts as one electron domain, regardless of bond order; each lone pair is one domain.","calculation":["The two C=O double bonds contribute one domain each.","2 bonding domains + 0 lone-pair domains = 2 electron domains"]},"u24-n0":{"given":["H₂C=O: carbon has two C–H single bonds and one C=O double bond","Use a localized valence-bond description"],"relationship":"Number of σ-bond directions determines the hybrid-orbital set in this model.","calculation":["Two C–H σ bonds + one C–O σ bond = three directions around C.","Three sp² orbitals provide those σ directions. One unhybridized p orbital contributes to the C=O π bond."],"answer":"sp² at carbon"},"u25-n0":{"given":["Bonding electrons = 8","Antibonding electrons = 4"],"relationship":"Bond order = (bonding electrons − antibonding electrons) / 2","calculation":["Bond order = (8 − 4) / 2 = 2"],"answer":"Bond order = 2"},"u26-n0":{"given":["n = 0.125 mol; T = 300. K; V = 2.50 L","R = 0.082057 L·atm/(mol·K)"],"relationship":"PV = nRT;  P = nRT / V","calculation":["P = (0.125 mol)(0.082057 L·atm/(mol·K))(300. K) / (2.50 L)","P = 1.230855 atm → 1.23 atm to 3 significant figures"]},"u27-n0":{"given":["Density d = 1.18 g/L; P = 1.00 atm; T = 300. K","R = 0.082057 L·atm/(mol·K)"],"relationship":"PV = (m/M)RT;  M = (m/V)RT/P = dRT/P","calculation":["M = (1.18 g/L)(0.082057 L·atm/(mol·K))(300. K) / (1.00 atm)","M = 29.048178 g/mol → 29.0 g/mol to 3 significant figures"]},"u28-n0":{"given":["runknown / rCO₂ = 1.50","M(CO₂) = 44.01 g/mol; same temperature and effusion conditions"],"relationship":"runknown / rCO₂ = √[M(CO₂) / Munknown]","calculation":["1.50² = 44.01 / Munknown","Munknown = 44.01 / 2.25 = 19.56 g/mol","The faster gas has the smaller molar mass: 19.6 g/mol to 3 significant figures"]},"u29-n0":{"given":["Compare gases at the same dilute-gas conditions","Candidate parameters a and b are given in a common unit system"],"relationship":"(P + an²/V²)(V − nb) = nRT","calculation":["The a term accounts for attractions; b accounts for excluded volume.","Of the listed pairs, a = 0.20 and b = 0.025 are both the smallest, so both corrections are smallest."],"answer":"a = 0.20, b = 0.025"},"u24-l26-5":{"given":["How many σ bonds are present in CH₃–C≡C–CH₃? Include the C–H bonds."],"relationship":"Each connected atom pair has one σ bond. A double bond adds one π bond; a triple bond adds two.","calculation":["The six hydrogen atoms give six C–H σ bonds.","The four-carbon chain has three C–C connections, each with one σ bond.","Total σ bonds = 6 + 3 = 9. The triple bond also contains two π bonds."],"answer":"9 σ bonds"},"u25-l27-3":{"given":["Use σ1s < σ*1s. What bond order does the elementary MO model predict for He₂⁺?"],"relationship":"Bond order = (Nbonding − Nantibonding) / 2; apply Aufbau, Pauli, and Hund’s rule.","calculation":["The two He atoms supply four electrons; the +1 charge removes one.","Occupancy is σ1s² σ*1s¹.","Bond order = (2 − 1)/2 = 0.5; one electron is unpaired."],"answer":"0.5"},"u25-l27-5":{"given":["For the stated order σ2s < σ*2s < π2p < σ2p < π*2p < σ*2p, find the bond order of CO⁺. Use C = 4 and O = 6 valence electrons."],"relationship":"Bond order = (Nbonding − Nantibonding) / 2; apply Aufbau, Pauli, and Hund’s rule.","calculation":["Valence electrons = 4 + 6 − 1 = 9.","Occupancy: σ2s² σ*2s² π2p⁴ σ2p¹.","There are seven bonding electrons and two antibonding electrons, so bond order = (7 − 2)/2 = 2.5 in this stated diagram."],"answer":"2.5"},"u25-l27-8":{"given":["NF⁻ has 13 valence electrons. Use σ2s < σ*2s < σ2p < π2p < π*2p < σ*2p. Calculate its bond order."],"relationship":"Bond order = (Nbonding − Nantibonding) / 2; apply Aufbau, Pauli, and Hund’s rule.","calculation":["Occupancy: σ2s² σ*2s² σ2p² π2p⁴ π*2p³.","Bonding electrons = 2 + 2 + 4 = 8. Antibonding electrons = 2 + 3 = 5.","Bond order = (8 − 5)/2 = 1.5."],"answer":"1.5"},"u24-l28-0":{"given":["In a localized carbonyl-oxygen diagram, how are the six oxygen valence electrons placed in three sp² orbitals and one p orbital?"],"relationship":"Account for six O valence electrons: two lone pairs, one σ contribution, and one π contribution.","calculation":["Two lone pairs occupy two sp² orbitals.","One electron in the third sp² orbital contributes to the σ bond.","One electron in the unhybridized p orbital contributes to the π bond. Total = 2 + 2 + 1 + 1 = 6."],"answer":"sp²: 2, 2, 1; p: 1"},"u24-l28-5":{"given":["How many σ bonds occur in CH₂=CH–C(=O)–CH₃? Include all bonds to H."],"relationship":"Each connected atom pair has one σ bond. A double bond adds one π bond; a triple bond adds two.","calculation":["There are six C–H bonds: two on CH₂, one on CH, and three on CH₃.","The four-carbon chain has three C–C σ bonds.","The C=O connection adds one C–O σ bond.","Total = 6 + 3 + 1 = 10 σ bonds."],"answer":"10 σ bonds"},"u25-l28-7":{"given":["CF⁺ has 10 valence electrons. Use σ2s < σ*2s < σ2p < π2p < π*2p < σ*2p. What is its bond order?"],"relationship":"Bond order = (Nbonding − Nantibonding) / 2; apply Aufbau, Pauli, and Hund’s rule.","calculation":["Carbon contributes four valence electrons and fluorine seven; the +1 charge removes one.","Fill σ2s² σ*2s² σ2p² π2p⁴.","Eight electrons are bonding and two are antibonding: bond order = (8 − 2)/2 = 3."],"answer":"3"},"u25-l28-8":{"given":["CF has 11 valence electrons. Use σ2s < σ*2s < σ2p < π2p < π*2p < σ*2p. Which result follows?"],"relationship":"Bond order = (Nbonding − Nantibonding) / 2; apply Aufbau, Pauli, and Hund’s rule.","calculation":["The first ten electrons fill σ2s² σ*2s² σ2p² π2p⁴.","The eleventh occupies one π*2p orbital.","Bond order = (8 − 3)/2 = 2.5. One unpaired electron makes the species paramagnetic."],"answer":"Bond order 2.5; paramagnetic"}}};

function diagramSVG(kind){
 const text=(x,y,t,small=false)=>`<text x="${x}" y="${y}" text-anchor="middle" class="${small?'diagram-small':'diagram-atom'}">${t}</text>`;
 const pair=(x,y,vertical=false)=>`<circle cx="${x-(vertical?0:3)}" cy="${y-(vertical?3:0)}" r="1.7"/><circle cx="${x+(vertical?0:3)}" cy="${y+(vertical?3:0)}" r="1.7"/>`;
 let body='',label='',height=165;
 if(kind==='amide'){
  label='Acetamide connectivity: CH3–C(=O)–NH2. Oxygen has two lone pairs; nitrogen has one.';
  body='<path d="M127 110h52m26 0h52M188 95V56m8 39V56"/>'+text(99,116,'H₃C')+text(192,116,'C')+text(192,44,'O')+text(284,116,'NH₂')+pair(178,25)+pair(206,25)+pair(276,88);
 }else if(kind==='formaldehyde'){
  label='Formaldehyde connectivity: a central carbon bonded to two hydrogen atoms and double-bonded to oxygen. Oxygen has two lone pairs.';
  body='<path d="M176 80l-40-27m40 40-40 27M202 81h57m-57 7h57"/>'+text(188,92,'C')+text(119,47,'H')+text(119,135,'H')+text(275,92,'O')+pair(275,59)+pair(275,115);
 }else if(kind==='carboxylate'){
  label='Two equivalent carboxylate contributors: R–C(=O)–O minus and R–C(–O minus)=O. Atom positions stay fixed.';
  const contributor=(x,swap)=>`<g transform="translate(${x} 0)"><path d="M39 91h29M90 80l27-26M90 96l27 25${swap?'M96 94l27 25':'M96 82l27-26'}"/>${text(25,97,'R')}${text(80,95,'C')}${text(130,46,'O')}${text(130,143,'O')}${text(150,swap?29:126,'−',true)}${pair(121,23)}${pair(148,44,true)}${pair(121,160)}${pair(148,141,true)}${swap?pair(106,42,true):pair(106,139,true)}</g>`;
  body=contributor(0,false)+text(200,94,'↔')+contributor(220,true);height=180;
 }else if(kind==='dipoles'){
  label='Molecular geometry sketches: O=C=O is linear; the O–S–O framework is bent.';
  body='<path d="M44 80h41m-41 6h41m28-6h41m-41 6h41M277 80l-27 36m41-36 27 36"/>'+text(28,90,'O')+text(99,90,'C')+text(170,90,'O')+text(283,72,'S')+text(237,137,'O')+text(330,137,'O')+text(100,32,'CO₂',true)+text(283,32,'SO₂',true);
 }else return '';
 return `<svg viewBox="0 0 400 ${height}" role="img" aria-label="${e(label)}" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">${body}</g></svg>`;
}
function renderDiagram(kind,caption='Structural reference · original schematic'){
 const svg=diagramSVG(kind);return svg?`<figure class="chem-figure">${svg}<figcaption>${e(caption)}</figcaption></figure>`:'';
}

function shapeExplorer(){return `<section class="panel"><h3>From electron domains to molecular shape</h3><p class="small muted">Count each bond as one domain, regardless of bond order. Lone pairs affect the geometry but are omitted from the molecular-shape name.</p><div class="shape-controls"><label for="shape-select">Molecule</label><select id="shape-select">${SHAPES.map((s,i)=>`<option value="${i}" ${V.shape===i?'selected':''}>${s[0]} · ${s[5]}</option>`).join('')}</select></div><div id="shape-content">${shapeDetail()}</div><p class="source">Lectures 24–25 · Chemistry 2e §7.6. A = central atom, X = bonded atom, E = central lone pair. Angles are ideal or approximate; polarity refers to the named molecule.</p></section>`;}
function shapeDetail(){let s=SHAPES[V.shape||0];return `<div class="shape-readout"><div class="shape-formula">${science(s[0])}<span>${science(s[1])}</span></div><dl>${[['Electron domains',s[2]],['Central lone pairs',s[3]],['Electron geometry',s[4]],['Molecular shape',s[5]],['Bond angles',s[6]],['Molecular polarity',s[7]]].map(([k,v])=>`<div><dt>${e(k)}</dt><dd>${e(v)}</dd></div>`).join('')}</dl></div>`;}
function topicFigure(u){

}

function sampleByChapter(list,count){

 let remaining=Math.min(count,list.length);
 while(remaining>0){for(const group of groups){if(!remaining)break;if(group.count<group.items.length){group.count++;remaining--;}}}
 return shuffle(groups.flatMap(group=>balancedSample(group.items,group.count)));
}

function normalizeScientific(raw){return String(raw).trim().replace(/[−–]/g,'-').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]/g,c=>'0123456789+-'['⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻'.indexOf(c)]).replace(/\s+/g,'').replace(/[×x*]10\^?([+-]?\d+)$/i,'e$1');}
