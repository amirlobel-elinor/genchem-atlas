H5O","aliases":[],"steps":["Divide each subscript by 2: C₂H₅O."],"level":"core","hint":"Convert percentages to fractions.","source":"L5 p6–8"},{"id":"u3-q6","unit":"u3","type":"number","prompt":"Two of three isotopes have abundances 18.50% and 46.25%. What is the third abundance?","answer":35.25,"answerUnit":"%","steps":["All isotope percentages sum to 100%.","100.00 − 18.50 − 46.25 = 35.25%."],"level":"core","hint":"Convert percentages to fractions.","source":"L5 p4–5","dec":2,"tol":1e-08},{"id":"u4-q0","unit":"u4","type":"concept","prompt":"What is the formula of calcium phosphate?","answer":"Ca₃(PO₄)₂","options":["Ca₃(PO₄)₂","CaPO₄","Ca₂PO₄","Ca(PO₄)₃"],"steps":["Three Ca²⁺ ions supply +6; two PO₄³⁻ ions supply −6."],"level":"core","hint":"Identify ionic, molecular, or acid naming.","source":"L6 p3–7","examIds":["fa26-pe1","su25-e1"]},{"id":"u4-q1","unit":"u4","type":"concept","prompt":"What does the III in iron(III) chloride mean?","answer":"Each iron ion has charge +3","options":["Each iron ion has charge +3","There are three iron atoms","Chlorine has charge −3","There are three ions in total"],"steps":["The Roman numeral gives the metal ion’s charge. FeCl₃ has one Fe³⁺ and three Cl⁻."],"level":"core","hint":"Identify ionic, molecular, or acid naming.","source":"L6 p11"},{"id":"u4-q2","unit":"u4","type":"concept","prompt":"What is the name of N₂O₄?","answer":"Dinitrogen tetroxide","options":["Dinitrogen tetroxide","Nitrogen(IV) oxide","Dinitrogen dioxide","Nitrogen tetraoxide"],"steps":["Molecular prefixes specify two N and four O; tetraoxide contracts to tetroxide."],"level":"core","hint":"Identify ionic, molecular, or acid naming.","source":"L6 p12","examIds":["fa26-pe1","su25-e1"]},{"id":"u4-q3","unit":"u4","type":"concept","prompt":"What is the name of HNO₂(aq)?","answer":"Nitrous acid","options":["Nitrous acid","Nitric acid","Hydronitric acid","Nitrogen acid"],"steps":["NO₂⁻ is nitrite; the -ite ending becomes -ous acid."],"level":"core","hint":"Identify ionic, molecular, or acid naming.","source":"L6 p14","examIds":["fa26-pe1","su25-e1"]},{"id":"u4-q4","unit":"u4","type":"concept","prompt":"Which compound is ionic even though it has no metal?","answer":"NH₄Cl","options":["NH₄Cl","CO₂","CH₄","N₂O₄"],"steps":["NH₄Cl contains the ammonium cation and chloride anion."],"level":"core","hint":"Identify ionic, molecular, or acid naming.","source":"L6 p4–9"},{"id":"u4-q5","unit":"u4","type":"text","prompt":"Write the formula of magnesium nitrate using plain digits and parentheses.","answer":"Mg(NO3)2","aliases":[],"steps":["Mg²⁺ requires two NO₃⁻ ions; use parentheses around the repeated nitrate."],"level":"core","hint":"Identify ionic, molecular, or acid naming.","source":"L6 p7,16"},{"id":"u4-q6","unit":"u4","type":"text","prompt":"Name Cu₂O. Use a Roman numeral in parentheses.","answer":"copper(I) oxide","aliases":["copper (I) oxide"],"steps":["O is 2−; the two Cu ions must sum to +2, so each is +1."],"level":"core","hint":"Identify ionic, molecular, or acid naming.","source":"L6 p11,15"},{"id":"u4-q7","unit":"u4","type":"number","prompt":"How many oxygen atoms are in one formula unit of Al₂(SO₄)₃?","answer":12,"answerUnit":"atoms","steps":["Each sulfate contains four O atoms. Three sulfates give 3 × 4 = 12."],"level":"core","hint":"Identify ionic, molecular, or acid naming.","source":"L6 p7","tol":1e-10,"examIds":["fa26-pe1","su25-e1"]},{"id":"u5-q0","unit":"u5","type":"concept","prompt":"A sample contains 0.50 mol of CO₂ molecules. How many moles of oxygen atoms does it contain?","answer":"1.0 mol","options":["1.0 mol","0.25 mol","0.50 mol","1.5 mol"],"steps":["Each CO₂ molecule contains two oxygen atoms, so multiply molecular moles by 2."],"level":"core","hint":"Masses → moles of each element.","source":"L7 p3–8"},{"id":"u5-q1","unit":"u5","type":"concept","prompt":"Mole ratios for an empirical formula are 1.00 : 1.50. What should you do next?","answer":"Multiply both by 2","options":["Multiply both by 2","Round 1.50 down to 1","Round 1.50 up to 2","Multiply only 1.50 by 2"],"steps":["Multiplying all ratios gives the simplest integers 2:3 while preserving composition."],"level":"core","hint":"Masses → moles of each element.","source":"L7 p12–14"},{"id":"u5-q2","unit":"u5","type":"number","prompt":"How many moles are in 9.00 g of water? Use 18.015 g/mol.","answer":0.5,"answerUnit":"mol","steps":["n = 9.00 / 18.015 = 0.4996… mol → 0.500 mol."],"level":"core","hint":"Masses → moles of each element.","source":"L7 p4–7","sf":3,"tol":0.003,"examIds":["fa26-pe1","su25-e1"]},{"id":"u5-q3","unit":"u5","type":"number","prompt":"How many molecules are in 0.250 mol of CO₂? Use Nₐ = 6.022 × 10²³ mol⁻¹.","answer":1.51e+23,"answerUnit":"molecules","steps":["N = 0.250 × 6.022 × 10²³ = 1.5055 × 10²³ → 1.51 × 10²³."],"level":"core","hint":"Masses → moles of each element.","source":"L7 p3–8","sf":3,"tol":9.06e+20,"examIds":["fa26-pe1","su25-e1"]},{"id":"u5-q4","unit":"u5","type":"number","prompt":"What mass percent of H is present in H₂O? Use H = 1.008 and O = 15.999 g/mol.","answer":11.19,"answerUnit":"%","steps":["M(H₂O) = 18.015 g/mol; hydrogen contributes 2.016 g/mol.","100(2.016/18.015) = 11.19%."],"level":"core","hint":"Masses → moles of each element.","source":"L7 p9–11","sf":4,"tol":0.01,"examIds":["fa26-pe1","su25-e1"]},{"id":"u5-q5","unit":"u5","type":"text","prompt":"A compound is 40.00% C, 6.71% H, and 53.29% O. Use C 12.01, H 1.008, O 16.00 g/mol. Enter its empirical formula.","answer":"CH2O","aliases":[],"steps":["For 100 g: n(C) = 3.331, n(H) = 6.657, n(O) = 3.331 mol.","Divide by 3.331: approximately 1:2:1, giving CH₂O."],"level":"core","hint":"Masses → moles of each element.","source":"L7 p12–14"},{"id":"u5-q6","unit":"u5","type":"text","prompt":"A compound has empirical formula CH₂O and molar mass 180.16 g/mol. Its empirical formula mass is 30.03 g/mol. Enter the molecular formula.","answer":"C6H12O6","aliases":[],"steps":["180.16 / 30.03 ≈ 6. Multiply all empirical subscripts by 6."],"level":"core","hint":"Masses → moles of each element.","source":"L7 p12–14"},{"id":"u5-q7","unit":"u5","type":"text","prompt":"Complete combustion of a hydrocarbon gives 4.40 g CO₂ and 1.80 g H₂O. Use 44.0 and 18.0 g/mol. Find the empirical formula.","answer":"CH2","aliases":[],"steps":["n(C) = 4.40/44.0 = 0.100 mol.","n(H) = 2(1.80/18.0) = 0.200 mol.","The C:H ratio is 1:2, so CH₂."],"level":"challenge","hint":"Masses → moles of each element.","source":"L7 p15"},{"id":"u6-q0","unit":"u6","type":"concept","prompt":"Which quantity is conserved during a dilution with no loss of solute?","answer":"Moles of solute","options":["Moles of solute","Molarity","Solution volume","Mass of solvent"],"steps":["Adding solvent changes volume and concentration but leaves solute amount unchanged."],"level":"core","hint":"Convert volume to liters when using n = MV.","source":"L8 p4–5"},{"id":"u6-q1","unit":"u6","type":"concept","prompt":"The denominator in molarity is…","answer":"Liters of final solution","options":["Liters of final solution","Liters of added water","Grams of solute","Grams of solvent"],"steps":["Molarity is nsolute/Vsolution, including all components of the final solution."],"level":"core","hint":"Convert volume to liters when using n = MV.","source":"L8 p2–3"},{"id":"u6-q2","unit":"u6","type":"number","prompt":"Dissolve 5.85 g NaCl (58.5 g/mol) to make 250. mL of solution. Find its molarity.","answer":0.4,"answerUnit":"M","steps":["n = 5.85/58.5 = 0.100 mol.","M = 0.100/0.250 = 0.400 mol/L."],"level":"core","hint":"Convert volume to liters when using n = MV.","source":"L8 p3","sf":3,"tol":0.0024000000000000002,"examIds":["fa26-pe1"]},{"id":"u6-q3","unit":"u6","type":"number","prompt":"A 20.0 mL sample of 1.50 M solution is diluted to a final volume of 150.0 mL. Find the new molarity.","answer":0.2,"answerUnit":"M","steps":["M₂ = M₁V₁/V₂ = 1.50 × 20.0/150.0 = 0.200 M."],"level":"core","hint":"Convert volume to liters when using n = MV.","source":"L8 p4–5","sf":3,"tol":0.0012000000000000001,"examIds":["fa26-pe1"]},{"id":"u6-q4","unit":"u6","type":"number","prompt":"For ideal complete dissociation, what is [Cl⁻] in 0.150 M CaCl₂?","answer":0.3,"answerUnit":"M","steps":["Each CaCl₂ releases two Cl⁻ ions: 2 × 0.150 = 0.300 M."],"level":"core","hint":"Convert volume to liters when using n = MV.","source":"L9 p2–4","sf":3,"tol":0.0018},{"id":"u6-q5","unit":"u6","type":"number","prompt":"A solution has 12.0 g solute and 88.0 g water. Find its mass percent solute.","answer":12.0,"answerUnit":"%","steps":["Solution mass = 12.0 + 88.0 = 100.0 g.","Mass percent = 100 × 12.0/100.0 = 12.0%."],"level":"core","hint":"Convert volume to liters when using n = MV.","source":"L8 p6","sf":3,"tol":0.07200000000000001},{"id":"u6-q6","unit":"u6","type":"number","prompt":"A 1.50 M NaCl solution has density 1.060 g/mL. Use M(NaCl) = 58.44 g/mol. Find its mass percent.","answer":8.27,"answerUnit":"%","steps":["Choose 1.000 L solution: mass = 1060 g.","NaCl mass = 1.50 × 58.44 = 87.66 g.","Mass percent = 100 × 87.66/1060 = 8.27%."],"level":"challenge","hint":"Convert volume to liters when using n = MV.","source":"L8 p7","sf":3,"tol":0.04962,"examIds":["su25-e2"]},{"id":"u6-q7","unit":"u6","type":"number","prompt":"A solution is 4.00% (m/v) glucose. How many grams of glucose are in 65.0 mL?","answer":2.6,"answerUnit":"g","steps":["4.00% (m/v) means 4.00 g per 100 mL solution.","Mass = 65.0 × 4.00/100 = 2.60 g."],"level":"core","hint":"Convert volume to liters when using n = MV.","source":"L8 p6","sf":3,"tol":0.015600000000000001},{"id":"u7-q0","unit":"u7","type":"concept","prompt":"When balancing a chemical equation, you may change…","answer":"Coefficients only","options":["Coefficients only","Subscripts only","Element symbols","Charges to make the totals agree"],"steps":["Subscripts define the substance. Coefficients change its relative amount."],"level":"core","hint":"Write correct reactant and product formulas.","source":"L8 p8–13"},{"id":"u7-q1","unit":"u7","type":"concept","prompt":"For N₂ + 3 H₂ → 2 NH₃, the ratio 3:2 relates…","answer":"Moles of H₂ consumed to moles of NH₃ formed","options":["Moles of H₂ consumed to moles of NH₃ formed","Grams of H₂ to grams of NH₃","Protons in H₂ to neutrons in NH₃","Densities of H₂ and NH₃"],"steps":["Balanced coefficients give particle or mole ratios, not mass ratios."],"level":"core","hint":"Write correct reactant and product formulas.","source":"L8 p8–9"},{"id":"u7-q2","unit":"u7","type":"number","prompt":"Balance C₂H₆ + O₂ → CO₂ + H₂O with the smallest whole-number coefficients. What is the coefficient of O₂?","answer":7,"answerUnit":"","steps":["2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O.","Both sides contain 4 C, 12 H, and 14 O atoms."],"level":"core","hint":"Write correct reactant and product formulas.","source":"L8 p10–13","tol":1e-10,"examIds":["fa26-pe1","su25-e1"]},{"id":"u7-q3","unit":"u7","type":"text","prompt":"Balance Al + O₂ → Al₂O₃. Enter the three smallest integer coefficients in order, separated by commas.","answer":"4,3,2","aliases":[],"steps":["Choose 2 Al₂O₃ to give 6 O atoms; this needs 3 O₂ and 4 Al."],"level":"core","hint":"Write correct reactant and product formulas.","source":"L8 p10–13"},{"id":"u7-q4","unit":"u7","type":"text","prompt":"Balance Fe₂O₃ + CO → Fe + CO₂. Enter the four smallest integer coefficients in order, separated by commas.","answer":"1,3,2,3","aliases":[],"steps":["1 Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂.","Check: Fe 2, C 3, O 6 on each side."],"level":"core","hint":"Write correct reactant and product formulas.","source":"L8 p10–13"},{"id":"u7-q5","unit":"u7","type":"number","prompt":"Balance Na₃PO₄ + CaCl₂ → Ca₃(PO₄)₂ + NaCl. What is the smallest whole-number coefficient of NaCl?","answer":6,"answerUnit":"","steps":["2 Na₃PO₄ + 3 CaCl₂ → Ca₃(PO₄)₂ + 6 NaCl."],"level":"core","hint":"Write correct reactant and product formulas.","source":"L8 p10–13","tol":1e-10,"examIds":["fa26-pe1","su25-e1"]},{"id":"u7-q6","unit":"u7","type":"concept","prompt":"Which equation is balanced with the smallest whole-number coefficients?","answer":"2 KClO₃ → 2 KCl + 3 O₂","options":["2 KClO₃ → 2 KCl + 3 O₂","KClO₃ → KCl + O₂","2 KClO₃ → KCl + 3 O₂","4 KClO₃ → 4 KCl + 6 O₂"],"steps":["The final option is balanced but can be reduced by 2; the correct coefficients are 2,2,3."],"level":"core","hint":"Write correct reactant and product formulas.","source":"L8 p8–13"},{"id":"u8-q0","unit":"u8","type":"concept","prompt":"Mixing aqueous BaCl₂ and Na₂SO₄ forms which precipitate?","answer":"BaSO₄(s)","options":["BaSO₄(s)","NaCl(s)","BaNa₂(s)","No precipitate"],"steps":["The course rules classify BaSO₄ as insoluble and NaCl as soluble."],"level":"core","hint":"Predict products and physical states.","source":"L9 p3,5–7","examIds":["su25-e2"]},{"id":"u8-q1","unit":"u8","type":"concept","prompt":"Which is the net ionic equation for AgNO₃(aq) reacting with NaCl(aq)?","answer":"Ag⁺(aq) + Cl⁻(aq) → AgCl(s)","options":["Ag⁺(aq) + Cl⁻(aq) → AgCl(s)","Na⁺ + NO₃⁻ → NaNO₃(s)","AgNO₃ → Ag + NO₃","Ag⁺ + Na⁺ → AgNa"],"steps":["Na⁺ and NO₃⁻ are spectator ions; AgCl precipitates."],"level":"core","hint":"Predict products and physical states.","source":"L9 p16–18"},{"id":"u8-q2","unit":"u8","type":"concept","prompt":"In Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s), the reducing agent is…","answer":"Zn(s)","options":["Zn(s)","Cu²⁺(aq)","Zn²⁺(aq)","Cu(s)"],"steps":["Zn loses two electrons and is oxidized; it supplies electrons that reduce Cu²⁺."],"level":"core","hint":"Predict products and physical states.","source":"L9 p11–15","examIds":["su25-e2"]},{"id":"u8-q3","unit":"u8","type":"concept","prompt":"At equivalence in H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O…","answer":"NaOH moles are twice H₂SO₄ moles","options":["NaOH moles are twice H₂SO₄ moles","Acid and base moles must be equal","Volumes must be equal","Masses must be equal"],"steps":["The balanced coefficients require 2 mol NaOH per 1 mol H₂SO₄ for complete neutralization."],"level":"core","hint":"Predict products and physical states.","source":"L9 p9–10"},{"id":"u8-q4","unit":"u8","type":"number","prompt":"What is the oxidation state of Mn in MnO₄⁻?","answer":7,"answerUnit":"","steps":["x + 4(−2) = −1, so x = +7."],"level":"core","hint":"Predict products and physical states.","source":"L9 p12–13","tol":1e-10,"examIds":["su25-e2","practice-e2"]},{"id":"u8-q5","unit":"u8","type":"number","prompt":"What is the oxidation state of Cr in Cr₂O₇²⁻?","answer":6,"answerUnit":"","steps":["2x + 7(−2) = −2; 2x = 12, so x = +6."],"level":"core","hint":"Predict products and physical states.","source":"L9 p12–13","tol":1e-10,"examIds":["su25-e2","practice-e2"]},{"id":"u8-q6","unit":"u8","type":"concept","prompt":"When writing the net ionic equation for a weak acid reacting with NaOH, the weak acid is…","answer":"Kept intact in its molecular form","options":["Kept intact in its molecular form","Split completely into ions","Removed as a spectator","Written as a solid"],"steps":["Weak acids are not completely ionized, so they remain intact in the net ionic equation."],"level":"core","hint":"Predict products and physical states.","source":"L9 p16–18"},{"id":"u8-q7","unit":"u8","type":"number","prompt":"Mix 25.0 mL of 0.200 M NaOH and 25.0 mL of 0.100 M Ba(OH)₂. Assuming volumes add and complete dissociation, find [OH⁻].","answer":0.2,"answerUnit":"M","steps":["OH⁻ from NaOH = 0.0250 × 0.200 = 0.00500 mol.","OH⁻ from Ba(OH)₂ = 2 × 0.0250 × 0.100 = 0.00500 mol.","[OH⁻] = 0.01000/0.0500 = 0.200 M."],"level":"core","hint":"Predict products and physical states.","source":"L9 p4","sf":3,"tol":0.0012000000000000001},{"id":"u9-q0","unit":"u9","type":"concept","prompt":"How do you compare reactants to find the limiting one?","answer":"Compare each available mole amount divided by its coefficient","options":["Compare each available mole amount divided by its coefficient","Compare their masses only","Choose the lowest molar mass","Choose the first formula in the equation"],"steps":["The smallest n/coefficient limits how many stoichiometric reaction units can occur."],"level":"core","hint":"Find each reactant’s moles.","source":"L10 p5–10"},{"id":"u9-q1","unit":"u9","type":"concept","prompt":"For N₂ + 3 H₂ → 2 NH₃, a mixture has 2.0 mol N₂ and 3.0 mol H₂. Which reactant is limiting?","answer":"H₂","options":["H₂","N₂","NH₃","Neither"],"steps":["N₂ allows 2.0 reaction units; H₂ allows 3.0/3 = 1.0, so H₂ is limiting."],"level":"core","hint":"Find each reactant’s moles.","source":"L10 p5–9"},{"id":"u9-q2","unit":"u9","type":"number","prompt":"For 2 Al + 3 Cl₂ → 2 AlCl₃, how many moles of AlCl₃ form from 0.450 mol Cl₂ and excess Al?","answer":0.3,"answerUnit":"mol","steps":["0.450 mol Cl₂ × (2 mol AlCl₃/3 mol Cl₂) = 0.300 mol."],"level":"core","hint":"Find each reactant’s moles.","source":"L10 p2–4","sf":3,"tol":0.0018,"examIds":["su25-e1"]},{"id":"u9-q3","unit":"u9","type":"number","prompt":"For N₂ + 3 H₂ → 2 NH₃, begin with 2.00 mol N₂ and 3.00 mol H₂. How many moles of N₂ remain after complete reaction?","answer":1.0,"answerUnit":"mol","steps":["H₂ is limiting and consumes 3.00/3 = 1.00 mol N₂.","N₂ remaining = 2.00 − 1.00 = 1.00 mol."],"level":"core","hint":"Find each reactant’s moles.","source":"L10 p7–9","sf":3,"tol":0.006,"examIds":["su25-e1","practice-e2"]},{"id":"u9-q4","unit":"u9","type":"number","prompt":"CaCO₃ → CaO + CO₂. What mass of CO₂ forms from 25.0 g CaCO₃? Use 100.09 and 44.01 g/mol.","answer":11.0,"answerUnit":"g","steps":["n(CaCO₃) = 25.0/100.09 mol.","The mole ratio is 1:1. Mass CO₂ = (25.0/100.09) × 44.01 = 11.0 g."],"level":"core","hint":"Find each reactant’s moles.","source":"L10 p2–4","sf":3,"tol":0.066,"examIds":["su25-e1","practice-e2"]},{"id":"u9-q5","unit":"u9","type":"number","prompt":"Mix 100.0 mL of 0.100 M AgNO₃ and 100.0 mL of 0.150 M NaCl. Assuming AgCl precipitates completely and volumes add, find the remaining [Cl⁻].","answer":0.025,"answerUnit":"M","steps":["Ag⁺ = 0.0100 mol; Cl⁻ = 0.0150 mol.","Ag⁺ is limiting in the 1:1 reaction. Cl⁻ left = 0.0050 mol.","[Cl⁻] = 0.0050/0.2000 = 0.0250 M."],"level":"challenge","hint":"Find each reactant’s moles.","source":"L10 p10","sf":3,"tol":0.00015000000000000001},{"id":"u9-q6","unit":"u9","type":"number","prompt":"For 2 H₂ + O₂ → 2 H₂O, start with 4.00 g H₂ and 16.0 g O₂. Use molar masses 2.016, 32.00, and 18.015 g/mol. Find the theoretical mass of water.","answer":18.0,"answerUnit":"g","steps":["H₂ gives 1.984 mol; O₂ gives 0.500 mol.","O₂ is limiting: 0.500 × 2 = 1.00 mol H₂O.","Mass = 1.00 × 18.015 = 18.0 g."],"level":"core","hint":"Find each reactant’s moles.","source":"L10 p7–9","sf":3,"tol":0.108,"examIds":["su25-e1","practice-e2"]},{"id":"u10-q0","unit":"u10","type":"concept","prompt":"A percent yield is 112%. What is the best interpretation?","answer":"The isolated sample may contain impurities or residual solvent","options":["The isolated sample may contain impurities or residual solvent","More product formed than conservation of mass allows","The reaction created atoms","The theoretical yield must always be wrong"],"steps":["An apparent yield above 100% often reflects extra mass or measurement/calculation error; it is a reason to investigate."],"level":"core","hint":"Balance the reaction.","source":"L11 p2–5"},{"id":"u10-q1","unit":"u10","type":"concept","prompt":"What is the difference between endpoint and equivalence point?","answer":"Endpoint is an observed signal; equivalence is the stoichiometric condition","options":["Endpoint is an observed signal; equivalence is the stoichiometric condition","They are always exactly identical","Endpoint is the initial buret reading","Equivalence means the indicator is always colorless"],"steps":["Indicator color change estimates the theoretical stoichiometric point, but the two need not coincide exactly."],"level":"core","hint":"Balance the reaction.","source":"L11 p7–9"},{"id":"u10-q2","unit":"u10","type":"number","prompt":"A reaction theoretically produces 8.50 g, but 6.80 g is isolated. Find the percent yield.","answer":80.0,"answerUnit":"%","steps":["Percent yield = 100 × 6.80/8.50 = 80.0%."],"level":"core","hint":"Balance the reaction.","source":"L11 p2–5","sf":3,"tol":0.48,"examIds":["su25-e1"]},{"id":"u10-q3","unit":"u10","type":"number","prompt":"Two consecutive steps have yields of 80.0% and 75.0%. What is the overall percent yield?","answer":60.0,"answerUnit":"%","steps":["Multiply fractions: 0.800 × 0.750 = 0.600.","Overall yield = 60.0%."],"level":"core","hint":"Balance the reaction.","source":"L11 p6","sf":3,"tol":0.36},{"id":"u10-q4","unit":"u10","type":"number","prompt":"A 25.00 mL HCl sample requires 18.60 mL of 0.1500 M NaOH. Find [HCl].","answer":0.1116,"answerUnit":"M","steps":["HCl + NaOH → NaCl + H₂O (1:1).","n(NaOH) = 0.01860 × 0.1500 = 0.002790 mol.","[HCl] = 0.002790/0.02500 = 0.1116 M."],"level":"core","hint":"Balance the reaction.","source":"L11 p8–9","sf":4,"tol":0.0001,"examIds":["su25-e2","practice-e2"]},{"id":"u10-q5","unit":"u10","type":"number","prompt":"A 20.00 mL H₂SO₄ sample requires 30.00 mL of 0.1000 M NaOH for complete neutralization. Find [H₂SO₄].","answer":0.075,"answerUnit":"M","steps":["H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O.","Acid moles = (0.03000 × 0.1000)/2 = 0.001500.","Concentration = 0.001500/0.02000 = 0.07500 M."],"level":"core","hint":"Balance the reaction.","source":"L11 p8–9","sf":4,"tol":4e-05,"examIds":["su25-e2","practice-e2"]},{"id":"u10-q6","unit":"u10","type":"number","prompt":"A 0.3000 g sample of a monoprotic acid requires 25.00 mL of 0.1000 M NaOH. Find its molar mass.","answer":120.0,"answerUnit":"g/mol","steps":["Acid moles = base moles = 0.02500 × 0.1000 = 0.002500.","Molar mass = 0.3000/0.002500 = 120.0 g/mol."],"level":"core","hint":"Balance the reaction.","source":"L11 p8","sf":4,"tol":0.05},{"id":"u10-q7","unit":"u10","type":"number","prompt":"A 10.00 mL vinegar sample has density 1.010 g/mL and consumes 20.00 mL of 0.5000 M NaOH. Acetic acid is monoprotic (60.05 g/mol). Find acid mass percent.","answer":5.946,"answerUnit":"%","steps":["Acid moles = 0.02000 × 0.5000 = 0.01000 mol.","Acid mass = 0.6005 g; solution mass = 10.10 g.","100 × 0.6005/10.10 = 5.946%."],"level":"challenge","hint":"Balance the reaction.","source":"L11 p9","sf":4,"tol":0.005},{"id":"u11-q0","unit":"u11","type":"concept","prompt":"A system releases heat while expanding. The signs of q and w are…","answer":"Both negative","options":["Both negative","Both positive","q positive, w negative","q negative, w positive"],"steps":["Heat leaves the system, and expansion does work on the surroundings. Both lower system energy."],"level":"core","hint":"Define the system and signs.","source":"L12 p6–10"},{"id":"u11-q1","unit":"u11","type":"concept","prompt":"For equal masses receiving equal heat, which has the largest temperature rise?","answer":"The sample with the lowest specific heat","options":["The sample with the lowest specific heat","The sample with the highest specific heat","All must rise equally","The densest sample always"],"steps":["ΔT = q/(mc); at fixed q and m, smaller c gives larger ΔT."],"level":"core","hint":"Define the system and signs.","source":"L12 p12–16"},{"id":"u11-q2","unit":"u11","type":"concept","prompt":"Which statement about heat is correct?","answer":"It is energy transferred because of a temperature difference","options":["It is energy transferred because of a temperature difference","It is a substance stored inside matter","It is identical to temperature","It always flows from cold to hot without work"],"steps":["Heat describes energy transfer, while internal energy is a state property."],"level":"core","hint":"Define the system and signs.","source":"L12 p5–8"},{"id":"u11-q3","unit":"u11","type":"number","prompt":"A system absorbs 125 J of heat and does 48 J of work on its surroundings. Find ΔU.","answer":77,"answerUnit":"J","steps":["q = +125 J; work done by the system gives w = −48 J.","ΔU = 125 − 48 = +77 J."],"level":"core","hint":"Define the system and signs.","source":"L12 p8–9","tol":1e-10,"examIds":["su25-e2"]},{"id":"u11-q4","unit":"u11","type":"number","prompt":"A gas compresses from 4.00 L to 1.50 L against 1.20 atm. Calculate w. Use 101.3 J per L·atm.","answer":304,"answerUnit":"J","steps":["ΔV = 1.50 − 4.00 = −2.50 L.","w = −1.20(−2.50) = +3.00 L·atm = +303.9 J → +304 J."],"level":"core","hint":"Define the system and signs.","source":"L12 p10","sf":3,"tol":1.824,"examIds":["su25-e2"]},{"id":"u11-q5","unit":"u11","type":"number","prompt":"A 25.0 g metal sample with c = 0.900 J/(g·°C) warms from 20.0 to 35.0 °C. Find q.","answer":338,"answerUnit":"J","steps":["ΔT = 15.0 °C.","q = 25.0 × 0.900 × 15.0 = 337.5 J → 338 J."],"level":"core","hint":"Define the system and signs.","source":"L12 p12–16","sf":3,"tol":2.028,"examIds":["practice-e2"]},{"id":"u11-q6","unit":"u11","type":"number","prompt":"A 40.0 g copper sample (c = 0.385 J/(g·°C)) loses 308 J. Its initial temperature is 50.0 °C. Find the final temperature.","answer":30.0,"answerUnit":"°C","steps":["q = −308 J. ΔT = −308/(40.0 × 0.385) = −20.0 °C.","Tfinal = 50.0 − 20.0 = 30.0 °C."],"level":"core","hint":"Define the system and signs.","source":"L12 p16","dec":1,"tol":0.06},{"id":"u11-q7","unit":"u11","type":"number","prompt":"A gas absorbs 0.500 kJ of heat and expands from 2.00 to 5.00 L against 1.00 atm. Use 101.3 J per L·atm. Find ΔU in joules.","answer":196,"answerUnit":"J","steps":["q = +500 J; w = −1.00(3.00)(101.3) = −303.9 J.","ΔU = 500 − 303.9 = +196.1 J → 196 J."],"level":"challenge","hint":"Define the system and signs.","source":"L12 p10","sf":3,"tol":1.176},{"id":"u12-q0","unit":"u12","type":"concept","prompt":"A solution warms in an insulated coffee-cup calorimeter. The reaction is…","answer":"Exothermic","options":["Exothermic","Endothermic","At zero enthalpy change","Necessarily nonspontaneous"],"steps":["Heat gained by the surroundings corresponds to heat lost by the reaction."],"level":"core","hint":"Calculate the surroundings’ heat gain or loss.","source":"L13 p2–5"},{"id":"u12-q1","unit":"u12","type":"concept","prompt":"A rigid bomb calorimeter measures reaction heat at constant…","answer":"Volume","options":["Volume","Pressure","Temperature","Enthalpy"],"steps":["Its rigid container fixes volume, so pressure–volume work is zero."],"level":"core","hint":"Calculate the surroundings’ heat gain or loss.","source":"L13 p7–9"},{"id":"u12-q2","unit":"u12","type":"concept","prompt":"A calorimeter’s heat capacity is given in kJ/°C. Which expression gives its heat change?","answer":"qcal = CcalΔT","options":["qcal = CcalΔT","qcal = Ccal/ΔT","qcal = ΔT/Ccal","qcal = m/Ccal"],"steps":["The whole calorimeter’s heat capacity already includes its amount of material."],"level":"core","hint":"Calculate the surroundings’ heat gain or loss.","source":"L13 p8–9"},{"id":"u12-q3","unit":"u12","type":"number","prompt":"A reaction warms 100.0 g of solution from 22.00 to 26.50 °C. Use c = 4.18 J/(g·°C), neglect cup heat capacity and heat loss. Find qreaction in kJ.","answer":-1.88,"answerUnit":"kJ","steps":["qsolution = 100.0 × 4.18 × 4.50 = +1881 J.","qreaction = −qsolution = −1.881 kJ, approximately −1.88 kJ."],"level":"core","hint":"Calculate the surroundings’ heat gain or loss.","source":"L13 p3–6","sf":3,"tol":0.01128,"examIds":["practice-e2"]},{"id":"u12-q4","unit":"u12","type":"number","prompt":"A bomb calorimeter has heat capacity 5.20 kJ/°C and warms by 2.40 °C. Find the signed heat of the reaction.","answer":-12.5,"answerUnit":"kJ","steps":["qcal = 5.20 × 2.40 = +12.48 kJ.","qreaction = −12.48 kJ → −12.5 kJ."],"level":"core","hint":"Calculate the surroundings’ heat gain or loss.","source":"L13 p7–9","sf":3,"tol":0.075},{"id":"u12-q5","unit":"u12","type":"number","prompt":"A 50.0 g metal at 80.00 °C is placed in 100.0 g water at 20.00 °C. The final temperature is 23.00 °C. Neglect heat loss and cup heat capacity; use cwater = 4.18 J/(g·°C). Find cmetal.","answer":0.44,"answerUnit":"J/(g·°C)","steps":["qwater = 100.0 × 4.18 × 3.0 = 1254 J.","50.0 cmetal (23.0 − 80.0) = −1254 J.","cmetal = 1254/(50.0 × 57.0) = 0.440 J/(g·°C)."],"level":"challenge","hint":"Calculate the surroundings’ heat gain or loss.","source":"L13 p5","sf":3,"tol":0.00264,"examIds":["su25-e2","practice-e2"]},{"id":"u12-q6","unit":"u12","type":"number","prompt":"Dissolving 0.0500 mol of salt releases 1.50 kJ. Find its molar enthalpy of dissolution.","answer":-30.0,"answerUnit":"kJ/mol","steps":["Heat released has negative sign for the dissolving system.","ΔH = −1.50/0.0500 = −30.0 kJ/mol."],"level":"core","hint":"Calculate the surroundings’ heat gain or loss.","source":"L13 p3–6","sf":3,"tol":0.18,"examIds":["su25-e2"]},{"id":"u12-q7","unit":"u12","type":"number","prompt":"A reaction releases 2.00 kJ into 200.0 g solution with c = 4.00 J/(g·°C). Neglect other heat uptake. Find the temperature rise.","answer":2.5,"answerUnit":"°C","steps":["The solution absorbs +2000 J.","ΔT = 2000/(200.0 × 4.00) = 2.50 °C."],"level":"core","hint":"Calculate the surroundings’ heat gain or loss.","source":"L13 p4","sf":3,"tol":0.015},{"id":"u13-q0","unit":"u13","type":"concept","prompt":"Why can Hess’s law combine reactions along different paths?","answer":"Enthalpy is a state function","options":["Enthalpy is a state function","Heat is always a state function","Every reaction has the same enthalpy","Intermediates have zero energy"],"steps":["The overall enthalpy depends on initial and final states, regardless of the path."],"level":"core","hint":"Match species, coefficients, and phases.","source":"L14 p3,8–10"},{"id":"u13-q1","unit":"u13","type":"concept","prompt":"Which formation enthalpy is zero by convention at 298 K?","answer":"O₂(g) in its reference state","options":["O₂(g) in its reference state","O(g)","O₃(g)","H₂O(l)"],"steps":["The zero convention applies to elements in their reference states, not to every elemental form."],"level":"core","hint":"Match species, coefficients, and phases.","source":"L14 p6–7","examIds":["su25-e2"]},{"id":"u13-q2","unit":"u13","type":"concept","prompt":"A standard formation equation must produce…","answer":"Exactly one mole of the specified substance","options":["Exactly one mole of the specified substance","Exactly one gram of product","Only gaseous products","Equal moles of all elements"],"steps":["The reference quantity is formation of one mole; fractional reactant coefficients can be appropriate."],"level":"core","hint":"Match species, coefficients, and phases.","source":"L14 p6–7","examIds":["su25-e2"]},{"id":"u13-q3","unit":"u13","type":"number","prompt":"N₂(g) + 3 H₂(g) → 2 NH₃(g) has ΔH = −92.4 kJ. Find ΔH for 4 NH₃(g) → 2 N₂(g) + 6 H₂(g).","answer":184.8,"answerUnit":"kJ","steps":["Reverse the equation: ΔH becomes +92.4 kJ.","Multiply all coefficients by 2: ΔH = +184.8 kJ."],"level":"core","hint":"Match species, coefficients, and phases.","source":"L14 p4","dec":1,"tol":0.06,"examIds":["su25-e2","practice-e2"]},{"id":"u13-q4","unit":"u13","type":"number","prompt":"Use ΔH°f[CH₄(g)] = −74.8, CO₂(g) = −393.5, H₂O(l) = −285.8, O₂(g) = 0 kJ/mol. Find ΔH° for CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(l).","answer":-890.3,"answerUnit":"kJ","steps":["Products: −393.5 + 2(−285.8) = −965.1 kJ.","Reactants: −74.8 kJ.","ΔH° = −965.1 − (−74.8) = −890.3 kJ."],"level":"core","hint":"Match species, coefficients, and phases.","source":"L14 p10–13","dec":1,"tol":0.06,"examIds":["su25-e2","practice-e2"]},{"id":"u13-q5","unit":"u13","type":"number","prompt":"Given C(graphite) + O₂(g) → CO₂(g), ΔH = −393.5 kJ, and CO(g) + ½ O₂(g) → CO₂(g), ΔH = −283.0 kJ, find ΔH for C(graphite) + ½ O₂(g) → CO(g).","answer":-110.5,"answerUnit":"kJ","steps":["Reverse the second reaction, giving ΔH = +283.0 kJ.","Add to the first; cancel CO₂ and half of O₂.","ΔH = −393.5 + 283.0 = −110.5 kJ."],"level":"core","hint":"Match species, coefficients, and phases.","source":"L14 p8–9","dec":1,"tol":0.06,"examIds":["su25-e2"]},{"id":"u13-q6","unit":"u13","type":"number","prompt":"An exothermic reaction releases 2.40 kJ when 0.0150 mol reacts. Find the molar enthalpy change.","answer":-160,"answerUnit":"kJ/mol","steps":["ΔH = −2.40 kJ / 0.0150 mol = −160 kJ/mol."],"level":"core","hint":"Match species, coefficients, and phases.","source":"L14 p5","sf":3,"tol":0.96},{"id":"u13-q7","unit":"u13","type":"number","prompt":"Heating water requires 80.0 kJ. Only 25.0% of a fuel’s released heat reaches the water. The fuel releases 2000 kJ/mol and has molar mass 44.0 g/mol. Find the fuel mass needed.","answer":7.04,"answerUnit":"g","steps":["Fuel must release 80.0/0.250 = 320 kJ.","Fuel amount = 320/2000 = 0.160 mol.","Mass = 0.160 × 44.0 = 7.04 g."],"level":"challenge","hint":"Match species, coefficients, and phases.","source":"L14 p14","sf":3,"tol":0.04224},{"id":"u14-q0","unit":"u14","type":"concept","prompt":"If a photon’s wavelength doubles in vacuum, its energy…","answer":"Halves","options":["Halves","Doubles","Quadruples","Stays constant"],"steps":["E = hc/λ, so energy is inversely proportional to wavelength."],"level":"core","hint":"Convert data to compatible units.","source":"L15 p2–5","examIds":["practice-e2"]},{"id":"u14-q1","unit":"u14","type":"concept","prompt":"Light below a metal’s threshold frequency becomes more intense. In the single-photon model, what happens?","answer":"Electrons still are not ejected","options":["Electrons still are not ejected","Electrons gain more kinetic energy","The work function decreases","Every photon eventually accumulates enough energy"],"steps":["Each photon must meet the threshold energy; intensity alone does not change photon energy."],"level":"core","hint":"Convert data to compatible units.","source":"L15 p6–9","examIds":["practice-e2"]},{"id":"u14-q2","unit":"u14","type":"concept","prompt":"A hydrogen atom goes from n = 2 to n = 5. It…","answer":"Absorbs energy","options":["Absorbs energy","Emits energy","Loses a proton","Must become an ion"],"steps":["A higher n bound state has higher (less negative) energy, so this transition needs absorption."],"level":"core","hint":"Convert data to compatible units.","source":"L15 p10–16"},{"id":"u14-q3","unit":"u14","type":"number","prompt":"Find the frequency of 500. nm light in vacuum. Use c = 2.998 × 10⁸ m/s.","answer":599600000000000.0,"answerUnit":"Hz","steps":["500. nm = 5.00 × 10⁻⁷ m.","ν = c/λ = 5.996 × 10¹⁴ Hz (about 6.00 × 10¹⁴ Hz)."],"level":"core","hint":"Convert data to compatible units.","source":"L15 p4–5","sf":3,"tol":3597600000000.0,"examIds":["practice-e2","su25-e3"]},{"id":"u14-q4","unit":"u14","type":"number","prompt":"Find the energy per photon of 400. nm light. Use h = 6.626 × 10⁻³⁴ J·s and c = 2.998 × 10⁸ m/s.","answer":4.966187e-19,"answerUnit":"J","steps":["400. nm = 4.00 × 10⁻⁷ m.","E = hc/λ = 4.966 × 10⁻¹⁹ J → 4.97 × 10⁻¹⁹ J."],"level":"core","hint":"Convert data to compatible units.","source":"L15 p4–5","sf":3,"tol":2.9797122e-21,"examIds":["practice-e2","su25-e3"]},{"id":"u14-q5","unit":"u14","type":"number","prompt":"A 2.00 mJ pulse contains photons of energy 4.00 × 10⁻¹⁹ J each. How many photons are present?","answer":5000000000000000.0,"answerUnit":"photons","steps":["2.00 mJ = 2.00 × 10⁻³ J.","N = (2.00 × 10⁻³)/(4.00 × 10⁻¹⁹) = 5.00 × 10¹⁵."],"level":"core","hint":"Convert data to compatible units.","source":"L15 p7","sf":3,"tol":30000000000000.0},{"id":"u14-q6","unit":"u14","type":"number","prompt":"For hydrogen, Eₙ = −2.179 × 10⁻¹⁸ J/n². Find the positive energy of the photon emitted for n = 4 → n = 2.","answer":4.085625e-19,"answerUnit":"J","steps":["Photon energy = RH(1/2² − 1/4²).","E = 2.179 × 10⁻¹⁸ × 3/16 = 4.086 × 10⁻¹⁹ J."],"level":"core","hint":"Convert data to compatible units.","source":"L15 p13–15","sf":4,"tol":4e-22,"examIds":["su25-e3"]},{"id":"u14-q7","unit":"u14","type":"number","prompt":"A metal’s work function is 2.20 eV. A photon has energy 3.50 eV. Find the maximum photoelectron kinetic energy in joules. Use 1 eV = 1.602 × 10⁻¹⁹ J.","answer":2.0826e-19,"answerUnit":"J","steps":["KE = 3.50 − 2.20 = 1.30 eV.","Convert: 1.30 × 1.602 × 10⁻¹⁹ = 2.08 × 10⁻¹⁹ J."],"level":"core","hint":"Convert data to compatible units.","source":"L15 p6–9","sf":3,"tol":1.24956e-21,"examIds":["su25-e3"]},{"id":"u15-q0","unit":"u15","type":"concept","prompt":"Which quantum-number set is allowed?","answer":"n = 3, ℓ = 2, mℓ = −2","options":["n = 3, ℓ = 2, mℓ = −2","n = 2, ℓ = 2, mℓ = 0","n = 1, ℓ = 1, mℓ = 0","n = 3, ℓ = 1, mℓ = 2"],"steps":["For n = 3, ℓ can be 0,1,2; when ℓ = 2, mℓ ranges from −2 to +2."],"level":"core","hint":"Check whether every quantum number is allowed.","source":"L16 p3–8","examIds":["practice-e2"]},{"id":"u15-q1","unit":"u15","type":"concept","prompt":"Which subshell contains five orbitals?","answer":"d","options":["d","s","p","f"],"steps":["For a d subshell, ℓ = 2, so 2ℓ + 1 = 5 orbitals."],"level":"core","hint":"Check whether every quantum number is allowed.","source":"L16 p3–8"},{"id":"u15-q2","unit":"u15","type":"concept","prompt":"The uncertainty principle concerns an intrinsic tradeoff between…","answer":"Position and momentum spreads","options":["Position and momentum spreads","Position and electric charge","Mass and atomic number","Wavelength and proton count"],"steps":["ΔxΔp has a nonzero lower bound; it is not merely a statement about poor instruments."],"level":"core","hint":"Check whether every quantum number is allowed.","source":"L16 p12–14"},{"id":"u15-q3","unit":"u15","type":"number","prompt":"What is the maximum number of electrons in the n = 3 shell?","answer":18,"answerUnit":"electrons","steps":["A shell has n² orbitals and two spin states per orbital: 2 × 3² = 18."],"level":"core","hint":"Check whether every quantum number is allowed.","source":"L16 p3–8","tol":1e-10,"examIds":["practice-e2"]},{"id":"u15-q4","unit":"u15","type":"number","prompt":"How many electrons can share n = 3, ℓ = 1, and mℓ = 0?","answer":2,"answerUnit":"electrons","steps":["These three numbers specify one allowed orbital; it holds two opposite-spin electrons."],"level":"core","hint":"Check whether every quantum number is allowed.","source":"L16 p8","tol":1e-10,"examIds":["practice-e2"]},{"id":"u15-q5","unit":"u15","type":"number","prompt":"How many electrons can have n = 2 and ℓ = 2?","answer":0,"answerUnit":"electrons","steps":["ℓ must be less than n. For n = 2, only ℓ = 0 or 1 is allowed."],"level":"core","hint":"Check whether every quantum number is allowed.","source":"L16 p8","tol":1e-10},{"id":"u15-q6","unit":"u15","type":"number","prompt":"Find the de Broglie wavelength of a particle with mass 2.00 × 10⁻²⁶ kg moving at 500. m/s. Use h = 6.626 × 10⁻³⁴ J·s.","answer":6.626e-11,"answerUnit":"m","steps":["λ = h/(mv) = (6.626 × 10⁻³⁴)/(2.00 × 10⁻²⁶ × 500.).","λ = 6.63 × 10⁻¹¹ m."],"level":"core","hint":"Check whether every quantum number is allowed.","source":"L16 p10–11","sf":3,"tol":3.9756e-13,"examIds":["practice-e2","su25-e3"]},{"id":"u15-q7","unit":"u15","type":"number","prompt":"An electron has speed uncertainty 20.0 m/s. Use m = 9.11 × 10⁻³¹ kg and h = 6.626 × 10⁻³⁴ J·s. Find the minimum position uncertainty in μm.","answer":2.894,"answerUnit":"μm","steps":["Δx ≥ h/(4πmΔv).","Substitution gives 2.894 × 10⁻⁶ m = 2.89 μm."],"level":"challenge","hint":"Check whether every quantum number is allowed.","source":"L16 p13–14","sf":3,"tol":0.017364,"examIds":["su25-e3"]},{"id":"u16-q0","unit":"u16","type":"concept","prompt":"Which is the ground-state configuration of sulfur (Z = 16)?","answer":"[Ne] 3s² 3p⁴","options":["[Ne] 3s² 3p⁴","[Ne] 3s² 3p⁶","[Ne] 3s¹ 3p⁵","[Ar] 4s²"],"steps":["[Ne] accounts for 10 electrons; 3s²3p⁴ supplies the remaining six in the ground state."],"level":"core","hint":"Determine the electron total from Z and charge.","source":"L17 p5–8"},{"id":"u16-q1","unit":"u16","type":"concept","prompt":"Hund’s rule says equal-energy orbitals are occupied…","answer":"Singly with parallel spins before pairing","options":["Singly with parallel spins before pairing","By paired electrons before any unpaired ones","Only by spin-down electrons","With up to four electrons each"],"steps":["Separate parallel-spin occupation precedes pairing within a degenerate subshell."],"level":"core","hint":"Determine the electron total from Z and charge.","source":"L17 p3,7"},{"id":"u16-q2","unit":"u16","type":"concept","prompt":"When Fe forms Fe²⁺ from [Ar] 4s² 3d⁶, which electrons are removed?","answer":"The two 4s electrons","options":["The two 4s electrons","Two 3d electrons","Two 3p electrons","One 4s and one 3s"],"steps":["The highest principal shell, n = 4, is emptied before 3d for this cation."],"level":"core","hint":"Determine the electron total from Z and charge.","source":"L17 p10–12"},{"id":"u16-q3","unit":"u16","type":"concept","prompt":"The configuration 1s² 2s² 2p⁶ 3s¹ 3p¹ describes an excited neutral atom of…","answer":"Mg","options":["Mg","Al","Na","Ne"],"steps":["Count 12 electrons. Neutral Z = 12 is magnesium; excitation does not change the element."],"level":"core","hint":"Determine the electron total from Z and charge.","source":"L17 p10–11"},{"id":"u16-q4","unit":"u16","type":"number","prompt":"How many unpaired electrons are present in ground-state phosphorus (Z = 15)?","answer":3,"answerUnit":"electrons","steps":["P is [Ne] 3s² 3p³.","Hund’s rule places the three 3p electrons in separate orbitals."],"level":"core","hint":"Determine the electron total from Z and charge.","source":"L17 p7","tol":1e-10,"examIds":["practice-e2","su25-e3"]},{"id":"u16-q5","unit":"u16","type":"number","prompt":"How many valence electrons does a main-group chlorine atom have?","answer":7,"answerUnit":"electrons","steps":["Cl is [Ne] 3s²3p⁵; the outer n = 3 shell contains 7 electrons."],"level":"core","hint":"Determine the electron total from Z and charge.","source":"L17 p8","tol":1e-10,"examIds":["practice-e2"]},{"id":"u16-q6","unit":"u16","type":"number","prompt":"An ion has charge +2 and 18 electrons. What is its atomic number?","answer":20,"answerUnit":"","steps":["Protons − electrons = +2, so Z = 18 + 2 = 20 (Ca²⁺)."],"level":"core","hint":"Determine the electron total from Z and charge.","source":"L17 p11–12","tol":1e-10,"examIds":["su25-e3"]},{"id":"u16-q7","unit":"u16","type":"number","prompt":"How many total electrons occupy d subshells in ground-state Zn (Z = 30)?","answer":10,"answerUnit":"electrons","steps":["Zn is [Ar] 3d¹⁰ 4s². Only the 3d subshell is occupied among its d subshells."],"level":"core","hint":"Determine the electron total from Z and charge.","source":"L17 p9","tol":1e-10,"examIds":["practice-e2","su25-e3"]},{"id":"u17-q0","unit":"u17","type":"concept","prompt":"Which sequence lists Na, Mg, and Cl in order of increasing atomic radius?","answer":"Cl < Mg < Na","options":["Cl < Mg < Na","Na < Mg < Cl","Mg < Cl < Na","Cl < Na < Mg"],"steps":["Within period 3, radius generally decreases as effective nuclear attraction increases."],"level":"core","hint":"Check whether the comparison is within a period, group, or isoelectronic series.","source":"L18 p5,12","examIds":["practice-e2","su25-e3"]},{"id":"u17-q1","unit":"u17","type":"concept","prompt":"Which is smallest among O²⁻, F⁻, Na⁺, and Mg²⁺?","answer":"Mg²⁺","options":["Mg²⁺","O²⁻","F⁻","Na⁺"],"steps":["All have 10 electrons. Mg²⁺ has the most protons, so it attracts that electron cloud most strongly."],"level":"core","hint":"Check whether the comparison is within a period, group, or isoelectronic series.","source":"L18 p6,13–14"},{"id":"u17-q2","unit":"u17","type":"concept","prompt":"Compared with neutral Na, Na⁺ is…","answer":"Smaller","options":["Smaller","Larger","Exactly the same size","A different element"],"steps":["Losing its 3s electron removes sodium’s outer shell and reduces electron repulsion."],"level":"core","hint":"Check whether the comparison is within a period, group, or isoelectronic series.","source":"L18 p6"},{"id":"u17-q3","unit":"u17","type":"concept","prompt":"Which has the highest first ionization energy: Li, Na, K, or Rb?","answer":"Li","options":["Li","Na","K","Rb"],"steps":["Down group 1, the outer electron is farther away and more shielded, so it is easier to remove."],"level":"core","hint":"Check whether the comparison is within a period, group, or isoelectronic series.","source":"L18 p7–9","examIds":["practice-e2","su25-e3"]},{"id":"u17-q4","unit":"u17","type":"concept","prompt":"What distinguishes electronegativity from electron affinity?","answer":"Electronegativity concerns bonded electrons; affinity is an energy change on adding an electron","options":["Electronegativity concerns bonded electrons; affinity is an energy change on adding an electron","Both are the exact same measured quantity","Electronegativity counts neutrons","Electron affinity is always positive"],"steps":["The two ideas are related but describe different processes and quantities."],"level":"core","hint":"Check whether the comparison is within a period, group, or isoelectronic series.","source":"L18 p10–11"},{"id":"u17-q5","unit":"u17","type":"number","prompt":"An element’s successive ionization energies are 590, 1145, 4910, and 6490 kJ/mol. How many valence electrons does this main-group atom most likely have?","answer":2,"answerUnit":"electrons","steps":["The large jump occurs between removal of the second and third electrons.","Two valence electrons are removed before reaching the core."],"level":"core","hint":"Check whether the comparison is within a period, group, or isoelectronic series.","source":"L18 p9,13","tol":1e-10,"examIds":["practice-e2","su25-e3"]},{"id":"u17-q6","unit":"u17","type":"number","prompt":"How many electrons are present in each species in the isoelectronic series N³⁻, O²⁻, F⁻, Ne?","answer":10,"answerUnit":"electrons","steps":["N: 7+3; O: 8+2; F: 9+1; Ne: 10. Each total is 10."],"level":"core","hint":"Check whether the comparison is within a period, group, or isoelectronic series.","source":"L18 p13","tol":1e-10,"examIds":["practice-e2","su25-e3"]},{"id":"u18-q0","unit":"u18","type":"concept","prompt":"Which formula correctly balances Al³⁺ and O²⁻?","answer":"Al₂O₃","options":["Al₂O₃","AlO","Al₃O₂","AlO₃"],"steps":["Two Al³⁺ give +6 and three O²⁻ give −6."],"level":"core","hint":"Predict or read the ion charges.","source":"L19 p2,10–12"},{"id":"u18-q1","unit":"u18","type":"concept","prompt":"Which pair is most likely to form an ionic solid?","answer":"Mg and Cl","options":["Mg and Cl","C and H","N and O","S and O"],"steps":["Mg commonly forms Mg²⁺ and Cl forms Cl⁻, producing MgCl₂."],"level":"core","hint":"Predict or read the ion charges.","source":"L19 p2,8"},{"id":"u18-q2","unit":"u18","type":"concept","prompt":"An ionic formula unit represents…","answer":"The simplest neutral ratio of ions","options":["The simplest neutral ratio of ions","A separate molecule in every salt","A single isolated electron","Only the cations in a solid"],"steps":["Ionic crystals are extended lattices; formula units express composition."],"level":"core","hint":"Predict or read the ion charges.","source":"L19 p2,10–12"},{"id":"u18-q3","unit":"u18","type":"concept","prompt":"A Ca²⁺ ion has the same electron configuration as…","answer":"Ar","options":["Ar","Ne","Kr","Ca"],"steps":["Ca has 20 electrons when neutral; Ca²⁺ has 18, matching Ar."],"level":"core","hint":"Predict or read the ion charges.","source":"L19 p2"},{"id":"u18-q4","unit":"u18","type":"number","prompt":"How many electrons does Mg²⁺ have? Magnesium has Z = 12.","answer":10,"answerUnit":"electrons","steps":["12 − 2 = 10 electrons."],"level":"core","hint":"Predict or read the ion charges.","source":"L19 p2,11","tol":1e-10},{"id":"u18-q5","unit":"u18","type":"number","prompt":"How many chloride ions are needed per aluminum ion in neutral aluminum chloride?","answer":3,"answerUnit":"ions","steps":["One Al³⁺ requires three Cl⁻ to balance the charge."],"level":"core","hint":"Predict or read the ion charges.","source":"L19 p12","tol":1e-10},{"id":"u19-q0","unit":"u19","type":"concept","prompt":"In the H–F bond, which end is δ−?","answer":"F","options":["F","H","Both ends","Neither end"],"steps":["Fluorine attracts the shared electrons more strongly."],"level":"core","hint":"Compare the bonded atoms’ electronegativities.","source":"L19 p4–8"},{"id":"u19-q1","unit":"u19","type":"concept","prompt":"Which bond is nonpolar by symmetry?","answer":"N–N","options":["N–N","H–Cl","C–O","H–F"],"steps":["Identical atoms attract the shared electron density equally."],"level":"core","hint":"Compare the bonded atoms’ electronegativities.","source":"L19 p4–8","examIds":["su25-e3"]},{"id":"u19-q2","unit":"u19","type":"concept","prompt":"The equilibrium bond length corresponds to…","answer":"A minimum in potential energy","options":["A minimum in potential energy","A maximum in potential energy","Zero attraction at every distance","The point where electrons stop"],"steps":["At the minimum, attractive and repulsive contributions balance to give zero net force."],"level":"core","hint":"Compare the bonded atoms’ electronegativities.","source":"L19 p3"},{"id":"u19-q3","unit":"u19","type":"concept","prompt":"A bond dipole arrow points toward the…","answer":"More electronegative atom","options":["More electronegative atom","Larger atom in every case","Positive end","Atom with fewer neutrons"],"steps":["The dipole arrow convention used here points toward the partial-negative end."],"level":"core","hint":"Compare the bonded atoms’ electronegativities.","source":"L19 p5"},{"id":"u19-q4","unit":"u19","type":"number","prompt":"Using course-style electronegativities C = 2.5 and O = 3.5, find the difference for a C–O bond.","answer":1.0,"answerUnit":"","steps":["ΔEN = |3.5 − 2.5| = 1.0; oxygen is the partial-negative end."],"level":"core","hint":"Compare the bonded atoms’ electronegativities.","source":"L19 p6–8","dec":1,"tol":0.01,"examIds":["su25-e3"]},{"id":"u19-q5","unit":"u19","type":"number","prompt":"How many shared electrons are present in a triple covalent bond?","answer":6,"answerUnit":"electrons","steps":["A triple bond contains three shared pairs: 3 × 2 = 6 electrons."],"level":"core","hint":"Compare the bonded atoms’ electronegativities.","source":"L19 p13","tol":1e-10},{"id":"u20-q0","unit":"u20","type":"concept","prompt":"Why does NH₄⁺ have eight total valence electrons?","answer":"5 + 4(1) − 1 = 8","options":["5 + 4(1) − 1 = 8","5 + 4(1) + 1 = 10","7 + 4(1) = 11","4 × 8 = 32"],"steps":["Count nitrogen and hydrogen valence electrons, then subtract one for the positive charge."],"level":"core","hint":"Count the electron budget.","source":"L19 p13–17"},{"id":"u20-q1","unit":"u20","type":"concept","prompt":"Which species necessarily has an odd number of valence electrons?","answer":"NO","options":["NO","CO₂","NH₃","CH₄"],"steps":["NO has 5 + 6 = 11 valence electrons, requiring an unpaired electron in a Lewis representation."],"level":"core","hint":"Count the electron budget.","source":"L20 p4–5"},{"id":"u20-q2","unit":"u20","type":"concept","prompt":"Which central atom is commonly electron-deficient in a simple Lewis structure?","answer":"B in BF₃","options":["B in BF₃","C in CH₄","N in NH₃","O in H₂O"],"steps":["Three B–F bonds place six electrons around boron."],"level":"core","hint":"Count the electron budget.","source":"L20 p4,6","examIds":["su25-e3"]},{"id":"u20-q3","unit":"u20","type":"concept","prompt":"Which atom cannot have an expanded octet in a conventional introductory Lewis structure?","answer":"N","options":["N","P","S","Xe"],"steps":["Nitrogen is a second-period atom and is restricted to an octet in these structures."],"level":"core","hint":"Count the electron budget.","source":"L20 p4,7–8","examIds":["su25-e3"]},{"id":"u20-q4","unit":"u20","type":"number","prompt":"How many total valence electrons are in CO₃²⁻?","answer":24,"answerUnit":"electrons","steps":["4 + 3(6) + 2 = 24."],"level":"core","hint":"Count the electron budget.","source":"L19 p17","tol":1e-10,"examIds":["su25-e3"]},{"id":"u20-q5","unit":"u20","type":"number","prompt":"How many total valence electrons are in NO₂⁻?","answer":18,"answerUnit":"electrons","steps":["5 + 2(6) + 1 = 18."],"level":"core","hint":"Count the electron budget.","source":"L20 p2","tol":1e-10,"examIds":["su25-e3"]},{"id":"u20-q6","unit":"u20","type":"number","prompt":"In O=C=O, how many lone pairs are on each oxygen atom?","answer":2,"answerUnit":"pairs","steps":["Each O has four electrons in its double bond and needs four more for an octet: two lone pairs."],"level":"core","hint":"Count the electron budget.","source":"L19 p16","tol":1e-10},{"id":"u20-q7","unit":"u20","type":"number","prompt":"How many lone pairs are on the central atom in the standard expanded-octet Lewis structure of SF₄?","answer":1,"answerUnit":"pair","steps":["Total electrons = 6 + 4(7) = 34.","Four S–F bonds use 8; the four terminal F octets use 24 more.","The remaining 2 electrons form one lone pair on S."],"level":"challenge","hint":"Count the electron budget.","source":"L20 p4,7–8","tol":1e-10,"examIds":["su25-e3"]},{"id":"u20-q8","unit":"u20","type":"number","prompt":"How many total valence electrons are in methylamine, CH₃NH₂?","answer":14,"answerUnit":"electrons","steps":["C contributes 4, N contributes 5, and five H atoms contribute 5. Total = 14."],"level":"core","hint":"Count the electron budget.","source":"L20 p3","tol":1e-10},{"id":"u20-q9","unit":"u20","type":"number","prompt":"In H₂C=O, how many total bonding pairs are present?","answer":4,"answerUnit":"pairs","steps":["Two C–H single bonds contribute two pairs; the C=O double bond contributes two pairs. Total = 4."],"level":"core","hint":"Count the electron budget.","source":"L20 p3","tol":1e-10},{"id":"u21-q0","unit":"u21","type":"concept","prompt":"Between resonance contributors, which feature stays unchanged?","answer":"Atom connectivity","options":["Atom connectivity","Placement of π electrons","Formal charge distribution","Placement of all lone pairs"],"steps":["Resonance changes electron placement without moving atoms or changing connectivity."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":""},{"id":"u21-q1","unit":"u21","type":"concept","prompt":"The actual ozone molecule is best described as…","answer":"One structure with delocalized bonding","options":["One structure with delocalized bonding","Two structures rapidly alternating","A mixture of separate isomers","Two independent oxygen molecules"],"steps":["Contributors are representations of one electronic structure; the molecule does not flip between drawings."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":""},{"id":"u21-q2","unit":"u21","type":"concept","prompt":"The sum of formal charges in CO₃²⁻ must be…","answer":"−2","options":["−2","0","+2","−6"],"steps":["Formal charges over all atoms must reproduce the ion’s overall charge."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":""},{"id":"u21-q3","unit":"u21","type":"number","prompt":"An N atom has five valence electrons, four single bonds, and no lone pairs. Find its formal charge.","answer":1,"answerUnit":"","steps":["FC = 5 − 0 − 4 = +1."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":"","tol":1e-10,"examIds":["su25-e3"]},{"id":"u21-q4","unit":"u21","type":"number","prompt":"An O atom has three lone pairs and one single bond. Find its formal charge.","answer":-1,"answerUnit":"","steps":["FC = 6 − 6 − 1 = −1."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":"","tol":1e-10,"examIds":["su25-e3"]},{"id":"u21-q5","unit":"u21","type":"number","prompt":"In one carbonate contributor, carbon has one double bond and two single bonds. Find carbon’s formal charge.","answer":0,"answerUnit":"","steps":["Bond order sum = 2 + 1 + 1 = 4. FC = 4 − 0 − 4 = 0."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":"","tol":1e-10,"examIds":["su25-e3"]},{"id":"u22-q0","unit":"u22","type":"concept","prompt":"Breaking a covalent bond in the gas phase requires…","answer":"An input of energy","options":["An input of energy","A release of energy","No energy change","An electron affinity of zero"],"steps":["Bond dissociation moves the system out of a lower-energy bonded state."],"level":"core","hint":"List and count broken bonds.","source":""},{"id":"u22-q1","unit":"u22","type":"concept","prompt":"For the same bonded elements, increasing bond order usually makes the bond…","answer":"Shorter and stronger","options":["Shorter and stronger","Longer and weaker","Longer and stronger","Unchanged"],"steps":["Additional shared bonding interactions generally shorten the equilibrium distance and increase dissociation energy."],"level":"core","hint":"List and count broken bonds.","source":""},{"id":"u22-q2","unit":"u22","type":"concept","prompt":"Which ionic solid is expected to have the largest lattice dissociation energy among these?","answer":"MgO","options":["MgO","NaCl","KBr","CsI"],"steps":["MgO has 2+ and 2− ions and relatively small separations, giving a large electrostatic attraction."],"level":"core","hint":"List and count broken bonds.","source":""},{"id":"u22-q3","unit":"u22","type":"number","prompt":"Estimate ΔH for H₂ + Cl₂ → 2 HCl. Use bond energies H–H = 436, Cl–Cl = 243, H–Cl = 431 kJ/mol.","answer":-183,"answerUnit":"kJ","steps":["Broken: 436 + 243 = 679 kJ.","Formed: 2 × 431 = 862 kJ.","ΔH ≈ 679 − 862 = −183 kJ."],"level":"core","hint":"List and count broken bonds.","source":"","tol":1e-10,"examIds":["su25-e3"]},{"id":"u22-q4","unit":"u22","type":"number","prompt":"A molecule has four identical C–H bonds with average energy 413 kJ/mol. Estimate the energy to break all four bonds in one mole of molecules.","answer":1652,"answerUnit":"kJ","steps":["4 × 413 = 1652 kJ."],"level":"core","hint":"List and count broken bonds.","source":"","tol":1e-10,"examIds":["su25-e3"]},{"id":"u22-q5","unit":"u22","type":"number","prompt":"Lattice formation releases 780 kJ/mol. In the positive dissociation convention, what is the lattice energy?","answer":780,"answerUnit":"kJ/mol","steps":["Dissociation reverses formation, so the sign reverses from −780 to +780 kJ/mol."],"level":"core","hint":"List and count broken bonds.","source":"","tol":1e-10},{"id":"u23-q0","unit":"u23","type":"concept","prompt":"What is the molecular shape of NH₃?","answer":"Trigonal pyramidal","options":["Trigonal pyramidal","Tetrahedral","Trigonal planar","Linear"],"steps":["Three bonds and one lone pair give tetrahedral electron geometry and trigonal pyramidal molecular shape."],"level":"core","hint":"Count bonding domains and lone pairs.","source":""},{"id":"u23-q1","unit":"u23","type":"concept","prompt":"Why is CO₂ nonpolar despite its polar bonds?","answer":"Equal opposite bond dipoles cancel in its linear shape","options":["Equal opposite bond dipoles cancel in its linear shape","C–O bonds are nonpolar","It has no electrons","Oxygen is less electronegative than carbon"],"steps":["The two identical bond dipoles point in opposite directions."],"level":"core","hint":"Count bonding domains and lone pairs.","source":""},{"id":"u23-q2","unit":"u23","type":"concept","prompt":"What is the molecular shape of SF₄?","answer":"Seesaw","options":["Seesaw","Tetrahedral","Square planar","Trigonal planar"],"steps":["Five electron domains with one equatorial lone pair give a seesaw molecular arrangement."],"level":"core","hint":"Count bonding domains and lone pairs.","source":""},{"id":"u23-q3","unit":"u23","type":"concept","prompt":"What is the molecular shape of XeF₄?","answer":"Square planar","options":["Square planar","Tetrahedral","Trigonal pyramidal","Seesaw"],"steps":["Six electron domains include two opposite lone pairs, leaving four F atoms in a square plane."],"level":"core","hint":"Count bonding domains and lone pairs.","source":""},{"id":"u23-q4","unit":"u23","type":"number","prompt":"How many electron domains are around carbon in CO₂?","answer":2,"answerUnit":"domains","steps":["Each double bond counts as one electron domain. Two double bonds give two domains."],"level":"core","hint":"Count bonding domains and lone pairs.","source":"","tol":1e-10,"examIds":["su25-e4"]},{"id":"u23-q5","unit":"u23","type":"number","prompt":"What is the ideal bond angle for four bonding domains and no lone pairs?","answer":109.5,"answerUnit":"°","steps":["Four domains adopt tetrahedral geometry with an ideal bond angle near 109.5°."],"level":"core","hint":"Count bonding domains and lone pairs.","source":"","dec":1,"tol":0.05,"examIds":["su25-e4"]},{"id":"u5-q8","unit":"u5","type":"concept","prompt":"A 0.100 mol sample of Al₂(SO₄)₃ contains how many moles of oxygen atoms?","answer":"1.20 mol","options":["1.20 mol","0.400 mol","0.300 mol","0.100 mol"],"steps":["Each formula unit has 3 × 4 = 12 O atoms; 0.100 × 12 = 1.20 mol."],"level":"core","hint":"Masses → moles of each element.","source":"L7 p6–8"},{"id":"u8-q8","unit":"u8","type":"concept","prompt":"Which must remain intact when writing a complete ionic equation?","answer":"BaSO₄(s)","options":["BaSO₄(s)","NaCl(aq)","KNO₃(aq)","NaOH(aq)"],"steps":["A solid precipitate is not written as free aqueous ions."],"level":"core","hint":"Predict products and physical states.","source":"L9 p16–18"},{"id":"u5-q9","unit":"u5","type":"number","prompt":"A sample containing only C, H, and O has mass 3.00 g. Its combustion gives 4.40 g CO₂ and 1.80 g H₂O. Use molar masses CO₂ 44.0, H₂O 18.0, C 12.0, H 1.00 g/mol. Find the oxygen mass in the original sample.","answer":1.6,"answerUnit":"g","steps":["C mass = (4.40/44.0) × 12.0 = 1.20 g.","H mass = 2(1.80/18.0) × 1.00 = 0.200 g.","O mass = 3.00 − 1.20 − 0.200 = 1.60 g."],"level":"challenge","hint":"Masses → moles of each element.","source":"L7 p15","sf":3,"tol":0.009600000000000001},{"id":"u6-q8","unit":"u6","type":"number","prompt":"A solution is 2.00% (v/v) of a liquid solute with density 1.20 g/mL and molar mass 60.0 g/mol. How many moles of solute are in 250. mL solution?","answer":0.1,"answerUnit":"mol","steps":["Solute volume = 0.0200 × 250. = 5.00 mL.","Solute mass = 5.00 × 1.20 = 6.00 g.","n = 6.00/60.0 = 0.100 mol."],"level":"challenge","hint":"Convert volume to liters when using n = MV.","source":"L8 p7","sf":3,"tol":0.0006000000000000001,"examIds":["su25-e2"]},{"id":"u1-q7","unit":"u1","type":"concept","prompt":"A result of 0.00620 written as 6.20 × 10⁻³ has…","answer":"Three significant figures in either notation","options":["Three significant figures in either notation","Two significant figures in decimal form","Five significant figures in decimal form","Three only in scientific notation"],"steps":["Both notations explicitly preserve the final zero as a significant digit."],"level":"core","hint":"Choose the appropriate rounding rule.","source":"L3 p2–3"},{"id":"u12-q8","unit":"u12","type":"concept","prompt":"For qreaction = −(msolutioncsolution + Ccup)ΔT, why is Ccup included?","answer":"The cup also absorbs or releases heat","options":["The cup also absorbs or releases heat","It changes the reaction stoichiometry","It converts kelvin to Celsius","It changes the solution’s molar mass"],"steps":["Ignoring a non-negligible cup heat capacity underestimates the total heat transferred."],"level":"core","hint":"Calculate the surroundings’ heat gain or loss.","source":"L13 p2–5"},{"id":"u3-q7","unit":"u3","type":"number","prompt":"A fictional element has 75.00% isotope A (mass 30.00 u) and 25.00% isotope B. Its average mass is 30.50 u. Find isotope B’s mass.","answer":32.0,"answerUnit":"u","steps":["30.50 = 0.7500(30.00) + 0.2500mB.","mB = (30.50 − 22.50)/0.2500 = 32.00 u."],"level":"challenge","hint":"Convert percentages to fractions.","source":"L5 p5","dec":2,"tol":0.006,"examIds":["fa26-pe1"]},{"id":"u5-q10","unit":"u5","type":"text","prompt":"A hydrocarbon gives 4.40 g CO₂ and 1.80 g H₂O on combustion. Use CO₂ 44.0 and H₂O 18.0 g/mol. Its molar mass is 42.0 g/mol; use empirical CH₂ mass 14.0 g/mol. Find the molecular formula.","answer":"C3H6","aliases":[],"steps":["C:H mole amounts are 0.100:0.200, so empirical formula is CH₂.","Molecular multiplier = 42.0/14.0 = 3; formula is C₃H₆."],"level":"challenge","hint":"Masses → moles of each element.","source":"L7 p15"},{"id":"u6-q9","unit":"u6","type":"number","prompt":"What volume of water must be added to 15.0 mL of 2.00 M stock to obtain 0.500 M solution? Assume volumes are additive.","answer":45.0,"answerUnit":"mL","steps":["Final volume = M₁V₁/M₂ = 2.00 × 15.0/0.500 = 60.0 mL.","Water added = 60.0 − 15.0 = 45.0 mL."],"level":"core","hint":"Convert volume to liters when using n = MV.","source":"L8 p5","sf":3,"tol":0.27},{"id":"u9-q7","unit":"u9","type":"number","prompt":"Mix 100.0 mL of 0.200 M Al(NO₃)₃ with 200.0 mL of 0.150 M KOH. Assume Al(OH)₃ precipitates completely and volumes add. Find the remaining [Al³⁺].","answer":0.0333,"answerUnit":"M","steps":["Al³⁺ + 3 OH⁻ → Al(OH)₃(s). Initial amounts: 0.0200 mol Al³⁺ and 0.0300 mol OH⁻.","OH⁻ limits the reaction and consumes 0.0300/3 = 0.0100 mol Al³⁺.","Al³⁺ left = 0.0100 mol; divide by 0.3000 L to get 0.0333 M."],"level":"challenge","hint":"Find each reactant’s moles.","source":"L10 p10","sf":3,"tol":0.00019980000000000003},{"id":"u10-q8","unit":"u10","type":"number","prompt":"A two-step synthesis could theoretically yield 20.0 g final product at 100% in both steps. The step yields are 85.0% and 70.0%. Find the final product mass.","answer":11.9,"answerUnit":"g","steps":["Overall fraction = 0.850 × 0.700 = 0.595.","Actual product = 20.0 × 0.595 = 11.9 g."],"level":"challenge","hint":"Balance the reaction.","source":"L11 p6","sf":3,"tol":0.0714},{"id":"u11-q8","unit":"u11","type":"number","prompt":"A 75.0 g sample has specific heat 0.800 J/(g·°C). What is the heat capacity of this sample?","answer":60.0,"answerUnit":"J/°C","steps":["C = mc = 75.0 × 0.800 = 60.0 J/°C."],"level":"core","hint":"Define the system and signs.","source":"L12 p12–13","sf":3,"tol":0.36},{"id":"u12-q9","unit":"u12","type":"number","prompt":"Burning a standard releases 30.0 kJ and warms a bomb calorimeter by 2.00 °C. In the same calorimeter, burning 0.0200 mol of another substance raises temperature by 3.00 °C. Find its molar combustion energy.","answer":-2250,"answerUnit":"kJ/mol","steps":["Calorimeter heat capacity = 30.0/2.00 = 15.0 kJ/°C.","Second reaction releases 15.0 × 3.00 = 45.0 kJ.","Molar reaction energy = −45.0/0.0200 = −2.25 × 10³ kJ/mol."],"level":"challenge","hint":"Calculate the surroundings’ heat gain or loss.","source":"L13 p8–9","sf":3,"tol":13.5},{"id":"u13-q8","unit":"u13","type":"number","prompt":"CO(g) + ½ O₂(g) → CO₂(g) has ΔH° = −283.0 kJ. Given ΔH°f[CO₂(g)] = −393.5 kJ/mol and ΔH°f[O₂(g)] = 0, find ΔH°f[CO(g)].","answer":-110.5,"answerUnit":"kJ/mol","steps":["−283.0 = −393.5 − ΔH°f(CO).","Rearrange: ΔH°f(CO) = −393.5 + 283.0 = −110.5 kJ/mol."],"level":"challenge","hint":"Match species, coefficients, and phases.","source":"L14 p12","dec":1,"tol":0.06,"examIds":["su25-e2"]},{"id":"u13-q9","unit":"u13","type":"number","prompt":"Given N₂ + 3 H₂ → 2 NH₃, ΔH = −92.4 kJ; N₂ + O₂ → 2 NO, ΔH = +180.6 kJ; and 2 H₂ + O₂ → 2 H₂O(l), ΔH = −571.6 kJ (all other species gases), find ΔH for 4 NH₃ + 5 O₂ → 4 NO + 6 H₂O(l).","answer":-1168.8,"answerUnit":"kJ","steps":["Reverse and double the ammonia formation: +184.8 kJ.","Double NO formation: +361.2 kJ. Triple water formation: −1714.8 kJ.","Cancel N₂ and H₂ intermediates. Sum = 184.8 + 361.2 − 1714.8 = −1168.8 kJ."],"level":"challenge","hint":"Match species, coefficients, and phases.","source":"L14 p9","dec":1,"tol":0.06,"examIds":["su25-e2"]},{"id":"u14-q8","unit":"u14","type":"number","prompt":"A photoelectron has kinetic energy 1.80 × 10⁻¹⁹ J. Use electron mass 9.11 × 10⁻³¹ kg. Find its speed.","answer":628632.977,"answerUnit":"m/s","steps":["KE = ½mv², so v = √(2KE/m).","v = √[2(1.80 × 10⁻¹⁹)/(9.11 × 10⁻³¹)] = 6.29 × 10⁵ m/s."],"level":"challenge","hint":"Convert data to compatible units.","source":"L15 p7–9","sf":3,"tol":3771.797862,"examIds":["practice-e2"]},{"id":"u14-q9","unit":"u14","type":"number","prompt":"The minimum photon energy that ionizes a hydrogen atom in an excited state is 8.716 × 10⁻²⁰ J. Use RH = 2.179 × 10⁻¹⁸ J. What is its initial principal quantum number n?","answer":5,"answerUnit":"","steps":["Ionization from n requires E = RH/n².","n² = (2.179 × 10⁻¹⁸)/(8.716 × 10⁻²⁰) = 25; n = 5."],"level":"challenge","hint":"Convert data to compatible units.","source":"L15 p16","tol":1e-10},{"id":"u15-q8","unit":"u15","type":"number","prompt":"How many electrons in one atom can have n = 3, ℓ = 1, mℓ = 0, and ms = +½?","answer":1,"answerUnit":"electron","steps":["All four allowed quantum numbers specify one electron state. Pauli permits at most one electron in that state."],"level":"core","hint":"Check whether every quantum number is allowed.","source":"L16 p8","tol":1e-10},{"id":"u16-q8","unit":"u16","type":"number","prompt":"Ground-state Hg has configuration [Xe] 4f¹⁴ 5d¹⁰ 6s². How many total electrons occupy d subshells? The [Xe] core contains 3d¹⁰ and 4d¹⁰.","answer":30,"answerUnit":"electrons","steps":["Count 3d¹⁰ + 4d¹⁰ + 5d¹⁰: 10 + 10 + 10 = 30."],"level":"core","hint":"Determine the electron total from Z and charge.","source":"L17 p9","tol":1e-10,"examIds":["practice-e2","su25-e3"]},{"id":"u16-q9","unit":"u16","type":"number","prompt":"Ground-state Hg has 80 electrons, all paired. How many have spin quantum number ms = +½?","answer":40,"answerUnit":"electrons","steps":["Each paired orbital has one electron of each spin, so 80/2 = 40 have ms = +½."],"level":"core","hint":"Determine the electron total from Z and charge.","source":"L17 p9","tol":1e-10},{"id":"u18-q6","unit":"u18","type":"concept","prompt":"How many dots surround Cl⁻ in its Lewis symbol?","answer":"Eight","options":["Eight","Seven","Six","Zero"],"steps":["Neutral Cl contributes seven valence electrons and gains one to form Cl⁻."],"level":"core","hint":"Predict or read the ion charges.","source":"L19 p9–12"},{"id":"u19-q6","unit":"u19","type":"concept","prompt":"Using EN values C 2.5, N 3.0, and O 3.5, which listed bond has the greatest electronegativity difference?","answer":"C–O","options":["C–O","C–N","N–O","C–C"],"steps":["The differences are 1.0, 0.5, 0.5, and 0.0, respectively."],"level":"core","hint":"Compare the bonded atoms’ electronegativities.","source":"L19 p6–8"},{"id":"u20-q10","unit":"u20","type":"number","prompt":"In the expanded-octet Lewis representation of IF₅, how many lone pairs are on iodine?","answer":1,"answerUnit":"pair","steps":["Total electrons = 7 + 5(7) = 42.","Five I–F bonds use 10 and terminal fluorine lone pairs use 30.","The remaining 2 electrons make one lone pair on I."],"level":"challenge","hint":"Count the electron budget.","source":"L20 p8","tol":1e-10,"examIds":["su25-e3"]},{"id":"u20-q11","unit":"u20","type":"number","prompt":"How many total lone pairs are on both oxygen atoms in methyl formate, H–C(=O)–O–CH₃?","answer":4,"answerUnit":"pairs","steps":["The carbonyl oxygen has two lone pairs.","The single-bonded oxygen has two bonds and two lone pairs. Total = 4 lone pairs."],"level":"challenge","hint":"Count the electron budget.","source":"L20 p9","tol":1e-10},{"id":"u21-q6","unit":"u21","type":"concept","prompt":"A resonance arrow means that the drawings are…","answer":"Contributors to one electronic structure","options":["Contributors to one electronic structure","Different compounds in equilibrium","Different conformations caused by rotating a single bond","States with different atom positions"],"steps":["Resonance is electron delocalization, distinct from reaction equilibrium or conformational changes."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":""},{"id":"u22-q6","unit":"u22","type":"number","prompt":"For forming NaCl(s), use: Na atomization +109, Na ionization +496, ½Cl₂ dissociation +122, Cl electron affinity −349, and ΔH°f[NaCl(s)] = −411 kJ/mol. Find the positive lattice dissociation energy.","answer":789,"answerUnit":"kJ/mol","steps":["The gaseous-ion preparation steps sum to 109 + 496 + 122 − 349 = +378 kJ/mol.","−411 = 378 − Ulattice, so Ulattice = 789 kJ/mol."],"level":"challenge","hint":"List and count broken bonds.","source":"","tol":1e-10,"examIds":["su25-e3"]},{"id":"u21-n0","unit":"u21","type":"concept","prompt":"Which change is allowed when drawing a resonance contributor?","answer":"Move a lone pair into an adjacent bond while keeping all nuclei fixed","steps":["Resonance contributors differ only in electron placement; the atom arrangement, electron count, and overall charge are preserved."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":"Lecture 21 pp. 7–10; Lecture 22 pp. 7–9","options":["Move a lone pair into an adjacent bond while keeping all nuclei fixed","Move a hydrogen atom to a different oxygen","Change the total charge of the ion","Add two electrons without changing the charge"],"examIds":["su25-e3"]},{"id":"u21-n1","unit":"u21","type":"concept","prompt":"In H₃C–C(=O)–NH₂, which lone pair can participate in the adjacent carbonyl π system?","answer":"The lone pair on N","steps":["The N lone pair is adjacent to the C=O π bond. Suitable alignment allows a contributor with C=N and O⁻/N⁺."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":"Lecture 22 pp. 3–9","options":["The lone pair on N","A lone pair on a remote saturated carbon","All C–H bonding pairs are lone pairs","No pair can interact with the carbonyl"],"diagram":"amide","examIds":["su25-e3"]},{"id":"u21-n2","unit":"u21","type":"concept","prompt":"A curved full-headed arrow in a resonance drawing must start at which location?","answer":"An existing electron pair in a bond or lone pair","steps":["The arrow represents an electron pair, so its tail begins at the electrons being reassigned."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":"Lecture 22 p. 9","options":["An existing electron pair in a bond or lone pair","A positive formal-charge label","A nucleus with no available electron pair","The resonance arrow between drawings"],"examIds":["su25-e3"]},{"id":"u21-n3","unit":"u21","type":"number","prompt":"A carbon is bonded to three atoms by three single bonds and has no lone pairs. What is its formal charge?","answer":1,"steps":["FC = 4 − 0 − 3 = +1."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":"Lecture 21 pp. 2–6","answerUnit":"","tol":1e-09,"examIds":["su25-e3"]},{"id":"u21-n4","unit":"u21","type":"number","prompt":"In the symmetric carboxylate group shown, two equivalent contributors each contain one C=O and one C–O bond. What is the average order of each C–O bond?","answer":1.5,"steps":["The total C–O bond order in either contributor is 2 + 1 = 3.","Shared equally over two C–O links: 3/2 = 1.5."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":"Lecture 21 pp. 7–10","answerUnit":"","tol":1e-09,"diagram":"carboxylate","examIds":["su25-e3"]},{"id":"u21-n5","unit":"u21","type":"concept","prompt":"In an octet-valid contributor for N₃⁻, the central N has two double bonds and no lone pairs. Which central formal charge is correct?","answer":"+1","steps":["Central N: FC = 5 − 0 − (2 + 2) = +1.","Check that all three formal charges sum to −1."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":"Lecture 21 p. 2; Summer 2025 Exam 3 Q3","options":["+1","−1","0","+2"],"examIds":["su25-e3"]},{"id":"u21-n6","unit":"u21","type":"concept","prompt":"Which description of a resonance hybrid is correct?","answer":"One electronic structure with delocalized electrons","steps":["Contributors are alternative drawings used together to describe one electronic structure."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":"Lecture 21 pp. 7–10","options":["One electronic structure with delocalized electrons","A molecule that spends half its time in each drawing","An equilibrium of different atom connectivities","A molecule with an extra electron for every contributor"],"examIds":["su25-e3"]},{"id":"u21-n7","unit":"u21","type":"concept","prompt":"For two comparable octet-valid contributors, where is a negative formal charge generally more favorable?","answer":"On the more electronegative atom","steps":["After checking electron count and valid octets, prefer small charge separation and negative charge on a more electronegative atom."],"level":"core","hint":"Count nonbonding electrons and bond orders.","source":"Lecture 21 pp. 3–6","options":["On the more electronegative atom","On the least electronegative atom","Only on a hydrogen atom","Where it makes the total charge zero regardless of the ion"],"examIds":["su25-e3"]},{"id":"u22-n0","unit":"u22","type":"number","prompt":"Estimate the atomization energy of one mole of CH₃OH(g). Use C–H = 410, C–O = 355, and O–H = 465 kJ/mol.","answer":2050,"steps":["Count 3 C–H, 1 C–O, and 1 O–H bond.","3(410) + 355 + 465 = 2050 kJ per mole of molecules."],"level":"core","hint":"List and count broken bonds.","source":"Lecture 23 pp. 2–5; Summer 2025 Exam 3 Q5","answerUnit":"kJ/mol","tol":1e-09,"examIds":["su25-e3"]},{"id":"u22-n1","unit":"u22","type":"number","prompt":"For C₂H₄(g) + H₂(g) → C₂H₆(g), estimate ΔH per reaction as written. Use C=C = 610, H–H = 435, C–C = 350, and C–H = 415 kJ/mol.","answer":-135,"steps":["The four original C–H bonds cancel from the accounting.","Break one C=C and one H–H; form one C–C and two C–H.","ΔH ≈ 610 + 435 − 350 − 2(415) = −135 kJ."],"level":"core","hint":"List and count broken bonds.","source":"Lecture 23 pp. 4–6","answerUnit":"kJ","tol":1e-09,"examIds":["su25-e3"]},{"id":"u22-n2","unit":"u22","type":"concept","prompt":"For gaseous M²⁺ and two gaseous X⁻ ions to form MX₂(s), which lattice step is written correctly?","answer":"M²⁺(g) + 2 X⁻(g) → MX₂(s)","steps":["The lattice formation step assembles the solid from separated gaseous ions with the required stoichiometry."],"level":"core","hint":"List and count broken bonds.","source":"Lecture 23 pp. 9–13; Summer 2025 Exam 3 Q15","options":["M²⁺(g) + 2 X⁻(g) → MX₂(s)","MX₂(g) → M(s) + X₂(g)","M⁺(g) + X²⁻(g) → MX₂(s)","M(s) + X₂(g) → MX₂(g)"],"examIds":["su25-e3"]},{"id":"u22-n3","unit":"u22","type":"concept","prompt":"Which ionization terms are needed in a Born–Haber cycle for MgCl₂(s)?","answer":"IE₁(Mg) + IE₂(Mg)","steps":["The metal must go from Mg(g) to Mg²⁺(g), removing two electrons in successive steps."],"level":"core","hint":"List and count broken bonds.","source":"Lecture 23 pp. 10–13","options":["IE₁(Mg) + IE₂(Mg)","2 IE₁(Mg)","IE₁(Mg) only","IE₁(Mg) + IE₂(Mg) + IE₃(Mg)"],"examIds":["su25-e3"]},{"id":"u22-n4","unit":"u22","type":"number","prompt":"For a hypothetical MX₂(s), ΔHf = −1100 kJ/mol. Atomization of M costs 160; IE₁ + IE₂ = 1700; X₂ dissociation costs 150; each first electron affinity is −300 kJ/mol. Find the positive lattice dissociation energy U.","answer":2510,"steps":["Gaseous-ion preparation = 160 + 1700 + 150 + 2(−300) = 1410 kJ/mol.","−1100 = 1410 − U, so U = 2510 kJ/mol."],"level":"challenge","hint":"List and count broken bonds.","source":"Lecture 23 pp. 12–13; Summer 2025 Exam 3 Q15","answerUnit":"kJ/mol","tol":1e-09,"examIds":["su25-e3"]},{"id":"u22-n5","unit":"u22","type":"concept","prompt":"Why does a Born–Haber cycle for CaF₂ use two first electron affinities of F rather than the first and second electron affinity of one F atom?","answer":"Two separate F atoms each gain one electron","steps":["The product ions are 2 F⁻. The second electron affinity of F would refer to adding an electron to F⁻, making F²⁻."],"level":"core","hint":"List and count broken bonds.","source":"Lecture 23 pp. 12–13","options":["Two separate F atoms each gain one electron","One F atom gains two electrons","Ca gains the two electrons","Electron affinity is always positive"],"examIds":["su25-e3"]},{"id":"u22-n6","unit":"u22","type":"concept","prompt":"For the same two bonded elements, which trend
